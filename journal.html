<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- 👇 貼在這裡：Travelpayouts Drive 腳本 (需放在 <head> 內) 👇 -->
    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
        (function () {
            var script = document.createElement("script");
            script.async = 1;
            script.setAttribute("data-cmp-ab","2");
            script.src = 'https://emrld.ltd/NTk5Njg0.js?t=599684';
            document.head.appendChild(script);
        })();
    </script>
    <!-- 👆 Travelpayouts Drive 腳本結束 👆 -->

    <style>
        /* === 1. 全域色彩變數與基礎頁面設定 === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-yellow: #FFE599;     /* 標題底線亮黃色 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕（強調與文字用） */
            --accent-pink: #E5D1C7;       /* 藕粉底色（地圖載入與預留框用） */
            --text-dark: #4A4A4A;         /* 主要深灰文字 */
            --text-light: #7A7A7A;        /* 內文淺灰文字 */
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100%;
        }

        /* === 2. 左右雙欄主版面配置 (左地圖 50% / 右內容 50%) === */
        .container { display: flex; width: 100%; }
        #map-container {
            position: sticky;
            top: 0;
            width: 50vw;
            height: 100vh;
            background-color: var(--accent-pink);
        }
        #map { width: 100%; height: 100%; }
        #right-panel { width: 50vw; box-sizing: border-box; }

        /* === 3. 右側頂部常駐導覽列與天數切換按鈕 (Day Tabs) === */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            padding: 16px 40px 12px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-brown-dark);
            font-size: 0.9rem;
            font-weight: bold;
        }
        .trip-main-title {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent-brown-dark);
        }
        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .day-tab {
            border: 1px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-tab:hover { background: var(--accent-pink); color: white; }
        .day-tab.active {
            background: var(--accent-brown);
            color: white;
            box-shadow: 0 2px 8px rgba(196, 169, 158, 0.4);
        }

        /* === 4. 日記文章容器與每日大標題橫幅 (Day Banner) === */
        #content { padding: 30px 40px 60px; }
        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0 30px;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .day-banner .day-badge,
        .day-banner .field-test-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.28);
            color: white;
            padding: 4px 12px;
            height: 24px;
            box-sizing: border-box;
            border-radius: 12px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            font-weight: bold;
            line-height: 1;
        }
        .day-banner h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
        }

        /* === 5. 單一章節卡片樣式 (Chapter Card) === */
        .chapter {
            min-height: 65vh;
            margin-bottom: 45px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15);
            position: relative;
            transition: opacity 0.4s ease;
            opacity: 0.35; /* 非當前閱讀章節半透明化 */
        }
        .chapter.active { opacity: 1; }
        .chapter h2 {
            color: var(--accent-brown);
            font-size: 1.3rem;
            margin-top: 0;
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 10px;
            display: inline-block;
        }
        .chapter-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1rem;
            letter-spacing: 0.04em;
            white-space: pre-line;
        }
        /* 無照片時的粉色文字佔位框 */
        .photo-placeholder {
            width: 100%;
            min-height: 220px;
            background-color: var(--accent-pink);
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            overflow: hidden;
        }

        /* === 6. 多媒體畫廊排版系統 (對應 config.yml 的所有版型選項) === */
        .media-gallery {
            margin: 20px 0;
            display: grid;
            gap: 10px;
            width: 100%;
        }
        /* 單張滿版 / 垂直堆疊 */
        .media-gallery.layout-single,
        .media-gallery.layout-stack { grid-template-columns: 1fr; }
        .media-gallery.layout-single .media-item { max-height: 440px; }

        /* 2 欄、3 欄、4 欄等寬並排 */
        .media-gallery.layout-auto-2,
        .media-gallery.layout-grid-equal { grid-template-columns: repeat(2, 1fr); }
        .media-gallery.layout-auto-3,
        .media-gallery.layout-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .media-gallery.layout-auto-4,
        .media-gallery.layout-grid-4 { grid-template-columns: repeat(4, 1fr); }

        /* 雜誌風比例排版 (2:1 / 1:2 / 1:2:1) */
        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        .media-gallery.layout-grid-1-2-1 { grid-template-columns: 1fr 2fr 1fr; }

        /* IG 風橫向滑動輪播 (5 張以上自動套用或手動指定) */
        .media-gallery.layout-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .media-gallery.layout-carousel .media-item {
            flex: 0 0 82%;
            scroll-snap-align: center;
        }

        /* 單一照片/影片項目容器與懸停效果 */
        .media-item {
            position: relative;
            min-width: 0;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f5efe6;
            height: 260px;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .media-item img:hover,
        .media-item video:hover { transform: scale(1.02); }
        .media-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.65));
            color: #fff;
            font-size: 0.78rem;
            padding: 16px 10px 6px;
            pointer-events: none;
        }
        .replay-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 5;
        }
        .replay-btn:hover { background: rgba(0, 0, 0, 0.8); }

        /* === 7. 點擊圖片/影片放大預覽燈箱 (支援左右按鈕、鍵盤與手機觸控滑動) === */
        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
            touch-action: pan-y; /* 允許垂直捲動但攔截水平滑動手勢 */
        }
        #lightbox-overlay img,
        #lightbox-overlay video {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            object-fit: contain;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
            backdrop-filter: blur(4px);
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }
        .lightbox-nav:hover {
            background: rgba(196, 169, 158, 0.85);
            transform: translateY(-50%) scale(1.08);
        }
        .lightbox-nav.prev { left: 24px; }
        .lightbox-nav.next { right: 24px; }

        .lightbox-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10001;
            white-space: nowrap;
        }

        /* === 8. 內文重點提示框樣式 (Callout Box) 與 莫蘭迪色預訂按鈕 === */
        .callout-box {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #333;
            white-space: normal;
        }
        .callout-icon { font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
        .callout-content { flex-grow: 1; }
        .callout-title { font-weight: bold; margin-bottom: 4px; }
        .callout-warning { background-color: #fdf6ec; border-left: 4px solid #e6a23c; }
        .callout-warning .callout-title { color: #b88230; }
        .callout-tip { background-color: #f0f9eb; border-left: 4px solid #67c23a; }
        .callout-tip .callout-title { color: #529b2e; }
        .callout-info { background-color: #eef4ff; border-left: 4px solid #3b82f6; }
        .callout-info .callout-title { color: #2563eb; }

        /* 莫蘭迪色 Travelpayouts 推薦預訂按鈕外層容器 (支援多顆按鈕自動換行並排) */
        .affiliate-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed rgba(196, 169, 158, 0.35); /* 頂部奶茶色虛線分隔 */
        }
        /* 莫蘭迪色膠囊預訂按鈕本體 */
        .affiliate-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background-color: #f7f1ed;       /* 淺米杏底色 */
            color: var(--accent-brown-dark); /* 深奶茶文字色 */
            border: 1px solid #d8c3b8;       /* 柔和奶茶邊框 */
            border-radius: 24px;             /* 膠囊圓角 */
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(196, 169, 158, 0.15);
        }
        /* 滑鼠移上預訂按鈕時的微浮起與反白效果 */
        .affiliate-btn:hover {
            background-color: var(--accent-brown);
            color: #ffffff;
            border-color: var(--accent-brown);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(196, 169, 158, 0.35);
        }
        /* 按鈕右側小箭頭 (↗) 動畫 */
        .affiliate-btn .arrow-icon {
            font-size: 0.85em;
            opacity: 0.85;
            transition: transform 0.2s ease;
        }
        .affiliate-btn:hover .arrow-icon {
            transform: translate(2px, -2px);
        }

        /* === 9. 地圖標記、路線方向箭頭與小狐狸角色樣式 === */
        .custom-marker { background: transparent; border: none; }
        .custom-marker .marker-dot {
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            background-color: var(--accent-brown);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .custom-marker:hover .marker-dot,
        .custom-marker.active .marker-dot {
            background-color: var(--accent-brown-dark);
            transform: scale(1.35);
            box-shadow: 0 0 0 4px rgba(255, 229, 153, 0.7), 0 3px 8px rgba(0,0,0,0.3);
        }
        .custom-marker:hover,
        .custom-marker.active { z-index: 900 !important; }

        /* 路線上的方向小箭頭 */
        .route-arrow-icon { background: transparent; border: none; pointer-events: none; }
        .route-arrow-inner {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-brown-dark);
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
            text-shadow: 0 0 3px #fff, 0 0 3px #fff;
        }

        /* 🦊 沿路線移動的小狐狸角色 */
        .fox-traveler-icon { background: transparent; border: none; z-index: 2000 !important; pointer-events: none; }
        .fox-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2.5px solid var(--accent-brown-dark);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(166, 137, 124, 0.55);
            font-size: 20px;
            transition: transform 0.15s ease;
        }
        .fox-wrapper.walking { animation: foxWalkBounce 0.32s infinite alternate ease-in-out; }
        @keyframes foxWalkBounce {
            0% { margin-top: 0px; }
            100% { margin-top: -6px; }
        }

        /* 地圖節點懸停提示框 (Tooltip) */
        .marker-tooltip {
            background: rgba(74, 74, 74, 0.92);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .marker-tooltip::before { border-top-color: rgba(74, 74, 74, 0.92) !important; }

        /* === 10. 手機版 RWD 響應式配置 (上地圖 38vh / 下內容，照片每排最多 2 張) === */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map-container { width: 100vw; height: 38vh; position: sticky; top: 0; z-index: 200; }
            #right-panel { width: 100vw; }
            .top-nav { top: 38vh; padding: 12px 20px; }
            #content { padding: 20px; }
            .chapter { min-height: auto; margin-bottom: 30px; }
            .media-gallery:not(.layout-single):not(.layout-stack):not(.layout-carousel) {
                grid-template-columns: repeat(2, 1fr);
            }
            .media-item { height: 180px; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.1rem; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            /* 手機版預訂按鈕自動滿版置中，方便拇指點擊 */
            .affiliate-btn { width: 100%; justify-content: center; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側常駐地圖區 -->
        <div id="map-container"><div id="map"></div></div>

        <!-- 右側導覽列與日記文章區 -->
        <div id="right-panel">
            <div class="top-nav">
                <div class="nav-header">
                    <a href="index.html" class="back-link">← 返回手帳書櫃</a>
                    <h2 class="trip-main-title" id="trip-title">讀取中...</h2>
                </div>
                <div class="day-tabs" id="day-tabs"></div>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <!-- 點圖/點影片放大預覽燈箱（支援同章節左右按鈕、鍵盤方向鍵與手機手指左右滑動） -->
    <div id="lightbox-overlay" onclick="handleOverlayClick()">
        <button type="button" class="lightbox-nav prev" id="lightbox-prev" onclick="event.stopPropagation(); stepLightbox(-1)">❮</button>
        <img id="lightbox-img" src="" alt="放大預覽" onclick="event.stopPropagation()">
        <video id="lightbox-video" src="" controls loop playsinline onclick="event.stopPropagation()" style="display: none;"></video>
        <button type="button" class="lightbox-nav next" id="lightbox-next" onclick="event.stopPropagation(); stepLightbox(1)">❯</button>
        <div id="lightbox-info" class="lightbox-info"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* === 1. 全域狀態變數與參數初始化 === */
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('trip') || 'tohoku_2026';

        let map = null;
        let baseRouteLayer = null;   // 底層：整天行程的淺色虛線
        let activeRouteLayer = null; // 頂層：當前移動區段的深色虛線與方向箭頭
        let markersLayer = null;     // 景點圓點標記圖層
        let foxMarker = null;        // 🦊 小狐狸角色標記
        let foxAnimFrame = null;     // 小狐狸移動動畫計時器

        let observer = null;         // 章節滾動監聽器
        let videoObserver = null;    // 影片自動播放監聽器
        let normalizedDays = [];     // 統一格式後的每日行程陣列
        let currentChaptersList = [];// 當前顯示的所有章節清單
        let currentActiveIndex = 0;  // 當前閱讀中的章節索引

        // 燈箱專用的章節媒體清單、索引與觸控滑動狀態
        let lightboxItems = [];
        let lightboxIndex = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let justSwiped = false;

        const segmentCoordsCache = {};     // 路線座標記憶體快取
        const chapterMarkers = new Map();  // 章節 DOM 對應地圖 Marker 的映射表
        let isClickScrolling = false;      // 點擊地圖平滑滾動時的鎖定旗標
        let scrollUnlockTimer = null;

        // 非公路類交通工具的弧線曲率設定（數值越大弧度越彎）
        const CURVE_MODES = {
            flight: 0.22,
            hsr: 0.12,
            boat: 0.12,
            train: 0.08,
            metro: 0.05,
            ropeway: 0.04
        };

        /* === 2. 讀取旅程 JSON 資料並初始化畫面（已加入防快取機制） === */
        fetch(`data/${tripId}.json?t=${Date.now()}`, { cache: 'no-store' })
            .then(res => {
                if (!res.ok) throw new Error('找不到該旅程的資料檔');
                return res.json();
            })
            .then(data => {
                document.title = data.tripTitle || '電子旅行手帳';
                document.getElementById('trip-title').textContent = data.tripTitle || '';

                // 相容新版 days 結構與舊版扁平 chapters 結構
                if (Array.isArray(data.days) && data.days.length > 0) {
                    normalizedDays = data.days;
                } else if (Array.isArray(data.chapters)) {
                    const grouped = {};
                    data.chapters.forEach(ch => {
                        const d = ch.day || 'Day 01';
                        if (!grouped[d]) {
                            grouped[d] = { day: d, dayTitle: ch.dayTitle || '', isFieldTest: ch.isFieldTest || false, chapters: [] };
                        }
                        grouped[d].chapters.push(ch);
                    });
                    normalizedDays = Object.values(grouped);
                }

                initMap(normalizedDays);
                buildDayTabs();
                renderDay('ALL');
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `<h2>糟糕，讀取失敗！</h2><p>${error.message}</p>`;
            });

        /* === 3. 初始化 Leaflet 地圖與圖層 === */
        function initMap(daysData) {
            const firstCh = daysData?.[0]?.chapters?.[0];
            const startLat = firstCh?.lat || 35.6895;
            const startLng = firstCh?.lng || 139.6917;
            const startZoom = firstCh?.zoom || 7;

            map = L.map('map', { zoomControl: false }).setView([startLat, startLng], startZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            baseRouteLayer = L.layerGroup().addTo(map);
            activeRouteLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        /* === 4. 距離計算、交通方式判別與路線座標產生 === */
        // 計算兩組經緯度之間的直線距離 (公里)
        function getDistanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // 統一將交通方式正規化為標準英文代碼（支援後台設定與內文關鍵字自動偵測）
        function resolveTransportMode(currCh, distKm) {
            const raw = (currCh.transport || '').toString().trim().toLowerCase();
            const modeAliases = {
                flight: ['flight', 'airplane', 'plane', '飛機', '航班'],
                hsr: ['hsr', 'shinkansen', '高鐵', '新幹線'],
                train: ['train', 'jr', '火車', '台鐵'],
                metro: ['metro', 'mrt', 'subway', '捷運', '地鐵'],
                boat: ['boat', 'ferry', '遊船', '渡輪'],
                ropeway: ['ropeway', 'cable_car', '纜車'],
                walk: ['walk', 'foot', '步行', '散步'],
                drive: ['drive', 'car', '自駕', '計程車'],
                bus: ['bus', '巴士', '公車']
            };
            for (const [stdMode, aliases] of Object.entries(modeAliases)) {
                if (aliases.includes(raw)) return stdMode;
            }

            // 若未指定，依距離與章節文字自動推斷
            const text = `${currCh.title || ''} ${currCh.content || ''}`;
            if (distKm > 250 || /直飛|航班|班機|起飛|降落/.test(text)) return 'flight';
            if (/遊船|觀光船|渡輪|乘船/.test(text)) return 'boat';
            if (/纜車|山頂站/.test(currCh.title || '')) return 'ropeway';
            if (/新幹線|高鐵/.test(currCh.title || '')) return 'hsr';
            if (/JR|仙石線|奧羽本線|電鐵|Skyliner|火車|台鐵/i.test(currCh.title || '')) return 'train';
            if (/地鐵|捷運|Metro/i.test(currCh.title || '')) return 'metro';
            return distKm <= 3.5 ? 'walk' : 'bus';
        }

        // 產生兩點之間的平滑二次貝茲曲線座標（用於飛機、鐵道、纜車、船班或備援路線）
        function generateCurve(start, end, curvature = 0.15, segments = 32) {
            const [lat1, lng1] = start, [lat2, lng2] = end;
            const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
            const ctrlLat = midLat - (lng2 - lng1) * curvature;
            const ctrlLng = midLng + (lat2 - lat1) * curvature;

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) ** 2 * lat1 + 2 * (1 - t) * t * ctrlLat + t ** 2 * lat2;
                const lng = (1 - t) ** 2 * lng1 + 2 * (1 - t) * t * ctrlLng + t ** 2 * lng2;
                points.push([Number(lat.toFixed(5)), Number(lng.toFixed(5))]);
            }
            return points;
        }

        // 取得兩章節間的詳細路徑（鐵道/航空走優美弧線，步行/巴士/自駕查詢 OSRM 實際街道）
        async function getDetailedPath(prevCh, currCh) {
            const cacheKey = `auto_v1_${prevCh.id}_to_${currCh.id}`;
            if (segmentCoordsCache[cacheKey]) return segmentCoordsCache[cacheKey];

            const start = [prevCh.lat, prevCh.lng];
            const end = [currCh.lat, currCh.lng];
            const distKm = getDistanceKm(prevCh.lat, prevCh.lng, currCh.lat, currCh.lng);
            const mode = resolveTransportMode(currCh, distKm);

            // 1. 軌道、航空、船隻或長途跨區：直接產生平滑曲線
            if (CURVE_MODES[mode] !== undefined || distKm > 250) {
                const curv = CURVE_MODES[mode] ?? 0.22;
                const arcCoords = generateCurve(start, end, curv, 36);
                segmentCoordsCache[cacheKey] = arcCoords;
                return arcCoords;
            }

            // 2. 檢查瀏覽器 localStorage 是否已有街道快取
            const saved = localStorage.getItem(cacheKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                segmentCoordsCache[cacheKey] = parsed;
                return parsed;
            }

            // 3. 呼叫 OSRM 取得貼合街道的真實路線
            try {
                const profile = mode === 'walk' ? 'foot' : 'driving';
                const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${prevCh.lng},${prevCh.lat};${currCh.lng},${currCh.lat}?overview=full&geometries=geojson`;
                const res = await fetch(osrmUrl);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes?.length > 0) {
                    const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    segmentCoordsCache[cacheKey] = roadCoords;
                    try { localStorage.setItem(cacheKey, JSON.stringify(roadCoords)); } catch (e) {}
                    return roadCoords;
                }
            } catch (e) {}

            // 4. 若網路或 API 失敗，以微彎曲線作為備援
            const fallbackCoords = generateCurve(start, end, 0.05, 24);
            segmentCoordsCache[cacheKey] = fallbackCoords;
            return fallbackCoords;
        }

        /* === 5. 繪製當前移動路線與小狐狸沿途移動動畫 === */
        // 繪製深色虛線與沿途方向小箭頭 (- - > - - >)
        function drawActiveArrowRoute(coords) {
            activeRouteLayer.clearLayers();
            if (!coords || coords.length < 2) return;

            L.polyline(coords, {
                color: '#a6897c', weight: 3.5, opacity: 0.9, dashArray: '6, 8'
            }).addTo(activeRouteLayer);

            const arrowCount = Math.min(7, Math.max(2, Math.floor(coords.length / 6)));
            for (let k = 1; k <= arrowCount; k++) {
                const idx = Math.min(coords.length - 1, Math.floor((k / (arrowCount + 1)) * coords.length));
                const p1 = coords[idx - 1], p2 = coords[idx];
                if (!p1 || !p2) continue;

                const angleDeg = Math.atan2(p2[0] - p1[0], p2[1] - p1[1]) * (180 / Math.PI);
                const arrowIcon = L.divIcon({
                    className: 'route-arrow-icon',
                    html: `<div class="route-arrow-inner" style="transform: rotate(${-angleDeg}deg);">❯</div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });
                L.marker([(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2], {
                    icon: arrowIcon, interactive: false
                }).addTo(activeRouteLayer);
            }
        }

        // 控制小狐狸沿座標點平滑移動並自動翻轉面向
        function animateFoxAlongPath(coords, targetZoom) {
            if (foxAnimFrame) cancelAnimationFrame(foxAnimFrame);
            if (!coords || coords.length === 0) return;

            if (!foxMarker) {
                const foxIcon = L.divIcon({
                    className: 'fox-traveler-icon',
                    html: '<div class="fox-wrapper" id="fox-avatar">🦊</div>',
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                foxMarker = L.marker(coords[0], { icon: foxIcon, zIndexOffset: 2000 }).addTo(map);
            } else {
                foxMarker.setLatLng(coords[0]);
            }

            // 單點直接定點飛行
            if (coords.length === 1) {
                map.flyTo(coords[0], targetZoom || 14, { animate: true, duration: 1.2 });
                return;
            }

            // 計算各段累積距離以確保等速平滑移動
            const cumDist = [0];
            let totalDist = 0;
            for (let i = 1; i < coords.length; i++) {
                totalDist += Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]);
                cumDist.push(totalDist);
            }

            if (totalDist === 0) {
                foxMarker.setLatLng(coords[coords.length - 1]);
                map.flyTo(coords[coords.length - 1], targetZoom || 14, { animate: true, duration: 1.0 });
                return;
            }

            map.flyToBounds(L.latLngBounds(coords), { padding: [70, 70], maxZoom: targetZoom || 15, animate: true, duration: 0.7 });

            const foxEl = document.getElementById('fox-avatar');
            if (foxEl) foxEl.classList.add('walking');

            const duration = 1900;
            const startTime = performance.now();

            function step(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                const targetD = eased * totalDist;

                let segIdx = 0;
                while (segIdx < cumDist.length - 2 && cumDist[segIdx + 1] < targetD) segIdx++;

                const segStartD = cumDist[segIdx];
                const segLen = cumDist[segIdx + 1] - segStartD;
                const ratio = segLen > 0 ? (targetD - segStartD) / segLen : 0;

                const p1 = coords[segIdx], p2 = coords[segIdx + 1];
                foxMarker.setLatLng([
                    p1[0] + (p2[0] - p1[0]) * ratio,
                    p1[1] + (p2[1] - p1[1]) * ratio
                ]);

                // 依東西向移動方向自動左右翻轉小狐狸
                const avatar = document.getElementById('fox-avatar');
                if (avatar && Math.abs(p2[1] - p1[1]) > 0.00001) {
                    avatar.style.transform = `scaleX(${(p2[1] - p1[1]) < 0 ? 1 : -1})`;
                }

                if (progress < 1) {
                    foxAnimFrame = requestAnimationFrame(step);
                } else {
                    if (avatar) avatar.classList.remove('walking');
                    map.flyTo(coords[coords.length - 1], targetZoom || 15, { animate: true, duration: 0.9 });
                }
            }

            foxAnimFrame = requestAnimationFrame(step);
        }

        // 切換章節時觸發路線繪製與小狐狸移動（相鄰章節雙向走動，跨章節跳轉直接定位）
        async function transitionToChapter(newIndex) {
            const targetCh = currentChaptersList[newIndex];
            if (!targetCh?.lat || !targetCh?.lng) return;

            if (newIndex !== currentActiveIndex && Math.abs(newIndex - currentActiveIndex) === 1) {
                const fromCh = currentChaptersList[currentActiveIndex];
                const isForward = newIndex > currentActiveIndex;
                const rawPath = await getDetailedPath(isForward ? fromCh : targetCh, isForward ? targetCh : fromCh);
                const moveCoords = isForward ? rawPath : [...rawPath].reverse();

                drawActiveArrowRoute(moveCoords);
                animateFoxAlongPath(moveCoords, targetCh.zoom || 14);
            } else {
                activeRouteLayer.clearLayers();
                if (newIndex > 0) {
                    const prevCh = currentChaptersList[newIndex - 1];
                    const pathCoords = await getDetailedPath(prevCh, targetCh);
                    drawActiveArrowRoute(pathCoords);
                }
                animateFoxAlongPath([[targetCh.lat, targetCh.lng]], targetCh.zoom || 14);
            }

            currentActiveIndex = newIndex;
        }

        /* === 6. 天數導覽列建立與切換 (Day Tabs) === */
        function buildDayTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            const tabs = [
                { key: 'ALL', label: '全部天數' },
                ...normalizedDays.map(d => ({ key: d.day, label: d.day }))
            ];

            tabs.forEach((tab, idx) => {
                const btn = document.createElement('button');
                btn.className = `day-tab ${idx === 0 ? 'active' : ''}`;
                btn.textContent = tab.label;
                btn.onclick = () => {
                    document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderDay(tab.key);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                tabsContainer.appendChild(btn);
            });
        }

        /* === 7. 多媒體畫廊、莫蘭迪預訂按鈕 HTML 生成、路徑智慧補全、影片自動播放與燈箱切換 === */
        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            const clean = str.trim();
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|heic|mp4|mov|m4v|webm)$/i.test(clean) ||
                   clean.includes('media/') || clean.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|m4v|webm)$/i.test((str || '').trim());
        }

        // 智慧修正媒體路徑（移除開頭斜線、若只填檔名自動補上 media/旅程ID/ 前綴）
        function normalizeMediaSrc(rawSrc) {
            let s = (rawSrc || '').trim().replace(/^\/+/, '');
            if (!s) return '';
            if (!s.includes('/') && !s.startsWith('http')) {
                return `media/${tripId}/${s}`;
            }
            return s;
        }

        function buildMediaHTML(ch, chIndex) {
            const items = [];

            // 1. 檢查單張主圖欄位是否為實際媒體路徑
            if (isMediaFile(ch.mediaPlaceholder)) {
                items.push({ src: normalizeMediaSrc(ch.mediaPlaceholder), caption: '' });
            }

            // 2. 匯入多張媒體清單（相容字串陣列與 {src, caption} 物件陣列）
            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const rawSrc = typeof item === 'string' ? item : (item?.src || item?.file || item?.url || '');
                    const caption = typeof item === 'object' && item?.caption ? item.caption : '';
                    if (isMediaFile(rawSrc)) {
                        items.push({ src: normalizeMediaSrc(rawSrc), caption });
                    }
                });
            }

            // 將整理好的媒體陣列存進該章節物件，供燈箱左右切換讀取
            ch._mediaItems = items;

            // 3. 若無任何媒體檔案，顯示粉色預留提示框
            if (items.length === 0) {
                return ch.mediaPlaceholder ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>` : '';
            }

            // 4. 決定排版樣式 class (auto 會依張數自動對應)
            const layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length <= 4) layoutClass = `layout-auto-${items.length}`;
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map((item, itemIdx) => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata" onclick="openLightbox(${chIndex}, ${itemIdx})"></video>
                            <button type="button" class="replay-btn" onclick="event.stopPropagation(); replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>`;
                }
                return `
                    <div class="media-item">
                        <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox(${chIndex}, ${itemIdx})">
                        ${captionHTML}
                    </div>`;
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        // 生成莫蘭迪色 Travelpayouts 預訂按鈕 HTML（相容單筆欄位與多筆清單，未填寫時完全隱形）
        function buildAffiliateHTML(ch) {
            const links = [];

            // 1. 讀取單筆推薦預訂欄位 (affiliateText + affiliateUrl)
            if (ch.affiliateUrl && ch.affiliateUrl.trim() !== '') {
                links.push({
                    text: (ch.affiliateText && ch.affiliateText.trim() !== '')
                        ? ch.affiliateText.trim()
                        : '🔗 查看同款行程與最新優惠',
                    url: ch.affiliateUrl.trim()
                });
            }

            // 2. 讀取多筆推薦預訂清單 (affiliateLinks: [{text, url}, ...])
            if (Array.isArray(ch.affiliateLinks)) {
                ch.affiliateLinks.forEach(item => {
                    if (item && item.url && item.url.trim() !== '') {
                        links.push({
                            text: (item.text && item.text.trim() !== '')
                                ? item.text.trim()
                                : '🔗 查看同款行程與最新優惠',
                            url: item.url.trim()
                        });
                    }
                });
            }

            // 3. 若該章節沒有設定任何預訂連結，回傳空字串（完全不佔畫面空間）
            if (links.length === 0) return '';

            // 4. 產生莫蘭迪色膠囊按鈕群組 HTML
            const buttonsHTML = links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener sponsored" class="affiliate-btn">
                    <span>${link.text}</span>
                    <span class="arrow-icon">↗</span>
                </a>
            `).join('');

            return `<div class="affiliate-container">${buttonsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) {
                video.currentTime = 0;
                video.play();
            }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.45 });

            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        // 開啟放大燈箱（載入指定章節的媒體清單與當前索引）
        function openLightbox(chIndex, itemIdx = 0) {
            const ch = currentChaptersList[chIndex];
            if (!ch || !Array.isArray(ch._mediaItems) || ch._mediaItems.length === 0) return;

            lightboxItems = ch._mediaItems;
            lightboxIndex = itemIdx;
            updateLightboxContent();
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        // 更新燈箱顯示內容（自動判斷圖片或影片、更新頁碼圖說與左右按鈕顯示狀態）
        function updateLightboxContent() {
            const item = lightboxItems[lightboxIndex];
            if (!item) return;

            const imgEl = document.getElementById('lightbox-img');
            const videoEl = document.getElementById('lightbox-video');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            const infoEl = document.getElementById('lightbox-info');

            // 若該章節只有 1 個檔案則隱藏左右按鈕，多於 1 個才顯示
            const hasMultiple = lightboxItems.length > 1;
            prevBtn.style.display = hasMultiple ? 'flex' : 'none';
            nextBtn.style.display = hasMultiple ? 'flex' : 'none';

            // 顯示頁碼與圖說（例如：1 / 4 ｜ 沒吃到的鴨to葱）
            const countText = `${lightboxIndex + 1} / ${lightboxItems.length}`;
            infoEl.textContent = item.caption ? `${countText} ｜ ${item.caption}` : countText;
            infoEl.style.display = (hasMultiple || item.caption) ? 'block' : 'none';

            if (isVideoFile(item.src)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = 'block';
                videoEl.src = item.src;
                videoEl.currentTime = 0;
                videoEl.play().catch(() => {});
            } else {
                videoEl.pause();
                videoEl.style.display = 'none';
                videoEl.src = '';
                imgEl.style.display = 'block';
                imgEl.src = item.src;
            }
        }

        // 左右切換同一章節的上/下一張照片或影片（頭尾自動循環）
        function stepLightbox(dir) {
            if (lightboxItems.length <= 1) return;
            lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
            updateLightboxContent();
        }

        // 點擊燈箱黑底關閉（若剛完成手指滑動則忽略此次點擊，避免誤關）
        function handleOverlayClick() {
            if (justSwiped) return;
            closeLightbox();
        }

        // 關閉放大燈箱並停止燈箱內的影片播放
        function closeLightbox() {
            const overlay = document.getElementById('lightbox-overlay');
            const videoEl = document.getElementById('lightbox-video');
            videoEl.pause();
            videoEl.src = '';
            overlay.style.display = 'none';
        }

        // 監聽鍵盤左右方向鍵與 Esc 鍵操作燈箱
        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('lightbox-overlay');
            if (!overlay || overlay.style.display !== 'flex') return;

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                stepLightbox(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                stepLightbox(1);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeLightbox();
            }
        });

        // 監聽手機版燈箱手指左右滑動（Touch Swipe）切換上/下一張
        const lightboxOverlayEl = document.getElementById('lightbox-overlay');
        lightboxOverlayEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        lightboxOverlayEl.addEventListener('touchend', (e) => {
            if (lightboxItems.length <= 1 || e.changedTouches.length === 0) return;

            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            // 確認為水平滑動（水平距離大於 45px 且大於垂直距離）
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
                justSwiped = true;
                setTimeout(() => { justSwiped = false; }, 300);

                if (dx < 0) {
                    stepLightbox(1);  // 手指往左滑 ➔ 下一張
                } else {
                    stepLightbox(-1); // 手指往右滑 ➔ 上一張
                }
            }
        }, { passive: true });

        /* === 8. 渲染日記內容、地圖節點綁定與滾動監聽 === */
        // 同步切換右側章節卡片與左側地圖圓點的 Active 高亮狀態
        function setActiveChapter(activeSection, activeMarker) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            if (activeSection) activeSection.classList.add('active');

            document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('active'));
            const marker = activeMarker || chapterMarkers.get(activeSection);
            if (marker?.getElement()) {
                marker.getElement().classList.add('active');
            }
        }

        // 渲染指定天數或全部天數的日記與地圖路線
        function renderDay(dayKey) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            if (observer) observer.disconnect();

            markersLayer.clearLayers();
            baseRouteLayer.clearLayers();
            activeRouteLayer.clearLayers();
            chapterMarkers.clear();

            const dotIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            currentChaptersList = [];
            currentActiveIndex = 0;
            const simpleLatLngs = [];

            const daysToRender = dayKey === 'ALL'
                ? normalizedDays
                : normalizedDays.filter(d => d.day === dayKey);

            daysToRender.forEach(dayObj => {
                // 建立每日橫幅 (Day Banner)
                const banner = document.createElement('div');
                banner.className = 'day-banner';
                const fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';
                banner.innerHTML = `
                    <div class="day-banner-header">
                        <div class="day-badge">${dayObj.day}</div>
                        ${fieldTestBadgeHTML}
                    </div>
                    <h1>${dayObj.dayTitle || dayObj.day}</h1>
                `;
                contentDiv.appendChild(banner);

                // 建立該日的所有章節卡片與地圖標記
                (dayObj.chapters || []).forEach(ch => {
                    const chIndex = currentChaptersList.length;
                    currentChaptersList.push(ch);

                    const section = document.createElement('section');
                    section.className = `chapter ${chIndex === 0 ? 'active' : ''}`;
                    section.id = `section-${ch.id}`;
                    section.setAttribute('data-index', chIndex);
                    // 組合章節卡片內容（標題 + 多媒體畫廊 + 內文 + 莫蘭迪色預訂按鈕）
                    section.innerHTML = `
                        <h2>${ch.title}</h2>
                        ${buildMediaHTML(ch, chIndex)}
                        <div class="chapter-body">${ch.content || ''}</div>
                        ${buildAffiliateHTML(ch)}
                    `;
                    contentDiv.appendChild(section);

                    if (ch.lat && ch.lng) {
                        simpleLatLngs.push([ch.lat, ch.lng]);
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);

                        marker.bindTooltip(`${dayObj.day}｜${ch.title}`, {
                            direction: 'top',
                            offset: [0, -10],
                            className: 'marker-tooltip'
                        });

                        // 點擊地圖圓點：鎖定滾動監聽並平滑捲動至對應章節卡片
                        marker.on('click', () => {
                            isClickScrolling = true;
                            clearTimeout(scrollUnlockTimer);

                            setActiveChapter(section, marker);
                            transitionToChapter(chIndex);

                            const topNav = document.querySelector('.top-nav');
                            const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                            const targetY = window.pageYOffset + section.getBoundingClientRect().top - navBottom - 20;
                            window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });

                            scrollUnlockTimer = setTimeout(() => { isClickScrolling = false; }, 950);
                        });

                        chapterMarkers.set(section, marker);
                    }
                });
            });

            // 繪製底層全天淺色參考虛線
            if (simpleLatLngs.length > 1) {
                L.polyline(simpleLatLngs, {
                    color: '#C4A99E', weight: 2, opacity: 0.45, dashArray: '5, 10'
                }).addTo(baseRouteLayer);
            }

            // 預設聚焦於第一個章節
            if (currentChaptersList.length > 0) {
                setActiveChapter(document.querySelector('.chapter'));
                transitionToChapter(0);
            }

            // 監聽右側文章滾動，自動觸發小狐狸移動與地圖飛行
            observer = new IntersectionObserver((entries) => {
                if (isClickScrolling) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chapter = entry.target;
                        const newIdx = parseInt(chapter.getAttribute('data-index'), 10);
                        setActiveChapter(chapter);
                        if (!isNaN(newIdx)) transitionToChapter(newIdx);
                    }
                });
            }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });

            document.querySelectorAll('.chapter').forEach(chapter => observer.observe(chapter));
            initVideoAutoplay();
        }
    </script>
</body>
</html>
