                        ✨ 目前尚無公開的行程天數（若正在編輯中，可於網址後方加上 <code>&preview=1</code> 預覽草稿）。
                    </div>
                `;
                document.getElementById('map-stats-pill').textContent = `0 日行跡`;
                return;
            }

            daysToRender.forEach(dayObj => {
                if (!isWholeJournalDraft) {
                    const banner = document.createElement('div');
                    banner.className = 'day-banner';
                    const fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';
                    const draftBadgeHTML = (isPreviewMode && dayObj._isDraft) ? `<span class="draft-preview-badge">📝 草稿預覽</span>` : '';
                    banner.innerHTML = `
                        <div class="day-banner-header">
                            <div class="day-badge">${dayObj.day}</div>
                            ${fieldTestBadgeHTML}
                            ${draftBadgeHTML}
                        </div>
                        <h1>${dayObj.dayTitle || dayObj.day}</h1>
                    `;
                    contentDiv.appendChild(banner);
                }

                let dayTotalTransitMins = 0;
                let dayTotalTransitCost = 0;
                const dayItinCardsHTML = [];
                const cleanSpotNames = [];

                (dayObj.chapters || []).forEach((ch, idxInDay) => {
                    const chIndex = currentChaptersList.length;
                    currentChaptersList.push(ch);

                    const prevCh = idxInDay > 0 ? dayObj.chapters[idxInDay - 1] : null;
                    const meta = classifyChapterMeta(ch, idxInDay, prevCh);

                    if (meta.stampChar === '住') hotelCount++;
                    else spotCount++;

                    cleanSpotNames.push(meta.pureName);

                    // 1. 建立圖文遊記章節卡片（非整本草稿時才建立）
                    let section = null;
                    if (!isWholeJournalDraft) {
                        section = document.createElement('section');
                        section.className = `chapter ${chIndex === 0 ? 'active' : ''}`;
                        section.id = `section-${ch.id}`;
                        section.setAttribute('data-index', chIndex);
                        const chDraftTag = (isPreviewMode && ch._isDraft) ? `<span style="font-size:0.75rem; background:#B84A39; color:#fff; padding:2px 8px; border-radius:8px; margin-left:8px; vertical-align:middle;">📝 草稿</span>` : '';
                        section.innerHTML = `
                            <h2>${ch.title}${chDraftTag}</h2>
                            ${buildMediaHTML(ch, chIndex)}
                            <div class="chapter-body">${ch.content || ''}</div>
                            ${buildAffiliateHTML(ch)}
                        `;
                        contentDiv.appendChild(section);
                    }

                    // 2. 累積交通時間與花費 (排除長途國際班機時間，呈現當日區域移動)
                    if (meta.transitInfo && idxInDay > 0 && meta.transitInfo.mode !== 'flight') {
                        dayTotalTransitMins += meta.transitInfo.mins;
                        dayTotalTransitCost += meta.transitInfo.cost;
                        dayItinCardsHTML.push(`
                            <div class="itin-transit-row">
                                <div class="itin-transit-left">
                                    <span class="itin-transit-icon">${meta.transitInfo.icon}</span>
                                    <span>${meta.transitInfo.modeName}｜${meta.transitInfo.routeText}</span>
                                </div>
                                <div class="itin-transit-right">
                                    ${meta.transitInfo.mins} 分 &nbsp; ${currentCurrencySymbol}${meta.transitInfo.cost.toLocaleString()}
                                </div>
                            </div>
                        `);
                    }

                    const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meta.pureName)}&query_place_id=${ch.lat},${ch.lng}`;
                    const isFirstOpen = idxInDay === 0 ? 'open' : '';
                    const jumpToJournalBtnHTML = !isWholeJournalDraft
                        ? `<button type="button" class="spot-pill-btn loc" onclick="jumpToJournalChapter(${chIndex}, 'section-${ch.id}')">📖 閱讀實拍遊記與照片</button>`
                        : '';

                    dayItinCardsHTML.push(`
                        <div class="spot-intro-card ${isFirstOpen}" id="itin-card-${ch.id}">
                            <div class="spot-card-header" onclick="this.parentElement.classList.toggle('open'); focusSpotOnMap(${chIndex});">
                                <div class="spot-header-left">
                                    <span class="spot-time-box">${meta.timeStr}</span>
                                    <span class="spot-cat-pill">${meta.categoryLabel}</span>
                                    <span class="spot-title-text">${meta.pureName}</span>
                                </div>
                                <span class="spot-toggle-arrow">▶</span>
                            </div>
                            <div class="spot-card-body">
                                <div class="spot-sub-block intro-block">
                                    <div class="spot-sub-title"><span>📘 景點介紹</span></div>
                                    <p class="spot-sub-text">${meta.introText}</p>
                                </div>
                                <div class="spot-sub-block note-block">
                                    <div class="spot-sub-title"><span>⚠️ 注意事項＆攻略備註</span></div>
                                    <p class="spot-sub-text">${meta.noteText}</p>
                                </div>
                                <div class="spot-action-pills">
                                    <a href="${gmapUrl}" target="_blank" rel="noopener" class="spot-pill-btn">🗺️ Google 地圖導航</a>
                                    <button type="button" class="spot-pill-btn loc" onclick="focusSpotOnMap(${chIndex})">📍 定位至左側地圖</button>
                                    ${jumpToJournalBtnHTML}
                                </div>
                                ${buildAffiliateHTML(ch)}
                            </div>
                        </div>
                    `);

                    if (ch.lat && ch.lng) {
                        simpleLatLngs.push([ch.lat, ch.lng]);
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);

                        marker.bindTooltip(`${dayObj.day}｜${meta.pureName}`, {
                            direction: 'top',
                            offset: [0, -10],
                            className: 'marker-tooltip'
                        });

                        marker.on('click', () => {
                            isClickScrolling = true;
                            clearTimeout(scrollUnlockTimer);
                            if (section) setActiveChapter(section, marker);
                            transitionToChapter(chIndex);

                            const journalView = document.getElementById('view-journal');
                            if (journalView.classList.contains('active') && section) {
                                const topNav = document.querySelector('.top-nav');
                                const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                                const targetY = window.pageYOffset + section.getBoundingClientRect().top - navBottom - 20;
                                window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                            } else {
                                const itinCard = document.getElementById(`itin-card-${ch.id}`);
                                if (itinCard) {
                                    itinCard.classList.add('open');
                                    itinCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }
                            scrollUnlockTimer = setTimeout(() => { isClickScrolling = false; }, 950);
                        });

                        if (section) chapterMarkers.set(section, marker);

                        const stampIcon = L.divIcon({
                            className: 'stamp-marker',
                            html: `<div class="stamp-box ${meta.stampClass}">${meta.stampChar}</div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        });
                        const stampMarker = L.marker([ch.lat, ch.lng], { icon: stampIcon }).addTo(exploreStampsLayer);
                        stampMarker.bindTooltip(`[${meta.stampChar}] ${meta.pureName}`, {
                            direction: 'top',
                            offset: [0, -12],
                            className: 'marker-tooltip'
                        });
                        stampMarker.on('click', () => marker.fire('click'));
                    }
                });

                const hours = Math.floor(dayTotalTransitMins / 60);
                const mins = dayTotalTransitMins % 60;
                const timeSumStr = hours > 0 ? `${hours} 時 ${mins} 分` : `${mins} 分`;

                const dayItinBlock = document.createElement('div');
                dayItinBlock.className = 'itinerary-day-block';
                dayItinBlock.innerHTML = `
                    <div class="itin-day-header">
                        <h3 class="itin-day-title">${dayObj.day}｜${dayObj.dayTitle || ''}</h3>
                        <div class="itin-day-sub">
                            <span>📅 ${ cleanSpotNames.slice(0, 4).join(' · ') }</span>
                        </div>
                    </div>
                    <div class="itin-summary-box">
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">當日區域移動時間</div>
                            <div class="itin-sum-val">${timeSumStr}</div>
                        </div>
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">預估區域交通花費</div>
                            <div class="itin-sum-val cost">${currentCurrencySymbol}${dayTotalTransitCost.toLocaleString()}</div>
                        </div>
                    </div>
                    ${dayItinCardsHTML.join('')}
                `;
                itinDiv.appendChild(dayItinBlock);
            });

            document.getElementById('map-stats-pill').textContent = `${daysToRender.length} 日行跡・${spotCount} 處尋訪・${hotelCount} 處住宿點`;

            if (simpleLatLngs.length > 1) {
                L.polyline(simpleLatLngs, {
                    color: '#C4A99E', weight: 2, opacity: 0.45, dashArray: '5, 10'
                }).addTo(baseRouteLayer);
            }

            if (currentChaptersList.length > 0) {
                const firstSec = document.querySelector('.chapter');
                if (firstSec) setActiveChapter(firstSec);
                transitionToChapter(0);
            }

            if (!isWholeJournalDraft) {
                observer = new IntersectionObserver((entries) => {
                    if (isClickScrolling) return;
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const chapter = entry.target;
                            const newIdx = parseInt(chapter.getAttribute('data-index'), 10);
                            setActiveChapter(chapter);
                            if (!isNaN(newIdx)) transitionToChapter(newIdx);
                        }
                    });
                }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });

                document.querySelectorAll('.chapter').forEach(chapter => observer.observe(chapter));
                initVideoAutoplay();
            }
        }

        /* ==============================================================
           8. 📡 資訊情報引擎 (讀取 itinerary/*.json 的 urgentNews 與 endDate)
           ============================================================== */
        function isTripAlreadyEnded() {
            if (!currentTripEndDate) return false;
            const end = new Date(`${currentTripEndDate}T23:59:59`);
            return new Date() > end;
        }

        async function refreshInfoStation(isManualClick = false) {
            const ended = isTripAlreadyEnded();
            const refreshBtn = document.getElementById('btn-refresh-info');
            const liveDot = document.getElementById('info-live-dot');
            const connLabel = document.getElementById('info-conn-label');
            const updateTimeEl = document.getElementById('info-update-time');
            const archiveBadge = document.getElementById('clip-archive-badge');

            const mainTitle = rawItineraryData.tripTitle || rawJournalData.tripTitle || '旅途';
            document.getElementById('info-trip-code').textContent = `${tripId.toUpperCase()} ・ 旅の速報`;
            document.getElementById('info-station-title').textContent = `${mainTitle.split('｜').pop().trim()}情報手帳`;

            if (ended) {
                liveDot.classList.add('ended');
                connLabel.textContent = '歷史封存';
                updateTimeEl.textContent = `本趟旅程已於 ${currentTripEndDate} 結束（停止即時更新）`;
                refreshBtn.textContent = '🏁 旅程已結束';
                refreshBtn.disabled = true;
                if (archiveBadge) archiveBadge.textContent = `🔒 已於 ${currentTripEndDate} 封存，停止新增剪報`;
            } else {
                liveDot.classList.remove('ended');
                connLabel.textContent = '即時連線';
                refreshBtn.disabled = false;
                if (refreshBtn && isManualClick) refreshBtn.textContent = '↻ 連線更新中...';
                const now = new Date();
                let timeStr = '';
                try {
                    timeStr = new Intl.DateTimeFormat('zh-TW', {
                        timeZone: currentTripTimezone,
                        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
                    }).format(now);
                } catch (e) {
                    timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
                }
                updateTimeEl.textContent = `更新：當地時間 ${timeStr}`;
                if (archiveBadge) archiveBadge.textContent = `🟢 旅途累積模式（自動過濾重複快訊）`;
            }

            const dayRepresentativeCoords = normalizedDays.map((d, idx) => {
                const validChs = (d.chapters || []).filter(c => c.lat && c.lng && !(c.lat < 25.5 && c.lat > 21.5 && c.lng > 119.5 && c.lng < 122.5));
                const picked = validChs[Math.floor(validChs.length / 2)] || d.chapters?.[0] || { lat: 35.6895, lng: 139.6917 };
                const stdRegion = d.region || '主要旅遊地區';
                const shortArea = stdRegion.replace('地區', '');
                return {
                    dayKey: d.day,
                    dayCode: `D${String(idx + 1).padStart(2, '0')}`,
                    dayTitle: d.dayTitle || d.day,
                    stdRegion: stdRegion,
                    locName: shortArea,
                    lat: Number(picked.lat).toFixed(3),
                    lng: Number(picked.lng).toFixed(3)
                };
            });

            await Promise.all(dayRepresentativeCoords.map(async (item) => {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lng}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
                    const res = await fetch(url);
                    const wData = await res.json();
                    if (wData && wData.current) {
                        const maxT = Math.round(wData.daily?.temperature_2m_max?.[0] ?? wData.current.temperature_2m);
                        const minT = Math.round(wData.daily?.temperature_2m_min?.[0] ?? wData.current.temperature_2m - 4);
                        const rainProb = wData.daily?.precipitation_probability_max?.[0] ?? 10;
                        const wind = Math.round(wData.current.wind_speed_10m || 8);
                        liveWeatherByDay[item.dayCode] = { ...item, maxT, minT, rainProb, wind };
                    }
                } catch (e) {
                    liveWeatherByDay[item.dayCode] = { ...item, maxT: 15, minT: 8, rainProb: 20, wind: 10 };
                }
            }));

            // 1. 渲染 30 秒情報速讀
            const d1W = liveWeatherByDay['D01'] || { locName: '首站', maxT: 12, minT: 4, rainProb: 20, wind: 10 };
            const d2W = liveWeatherByDay['D02'] || d1W;
            const newsPool = Array.isArray(rawItineraryData.urgentNews) ? rawItineraryData.urgentNews : [];

            const quickItemsHTML = [
                `<li><span>☀️</span><div><strong>【${d1W.locName} D01 即時氣象】</strong>氣溫 ${d1W.maxT}~${d1W.minT}°C，降雨/降雪機率 ${d1W.rainProb}%，最大風速 ${d1W.wind} km/h。</div></li>`,
                `<li><span>🌬️</span><div><strong>【${d2W.locName} D02 風速與戶外監測】</strong>氣溫 ${d2W.maxT}~${d2W.minT}°C，目前風速 ${d2W.wind} km/h（若有纜車或遊船行程請留意強風停駛基準）。</div></li>`
            ];

            newsPool.slice(0, 3).forEach(n => {
                quickItemsHTML.push(`<li><span>🚨</span><div><strong>${n.title}：</strong>${n.desc}</div></li>`);
            });

            document.getElementById('info-quick-five').innerHTML = quickItemsHTML.join('');

            // 2. 渲染每日行程天氣與風速影響雷達
            const radarGrid = document.getElementById('info-radar-grid');
            radarGrid.innerHTML = dayRepresentativeCoords.map(item => {
                const w = liveWeatherByDay[item.dayCode] || { maxT: 12, minT: 5, rainProb: 20, wind: 10 };
                const isWarn = w.wind >= 20 || w.rainProb >= 60 || w.minT <= 0;
                const statusText = isWarn
                    ? `⚠️ ${w.maxT}~${w.minT}°C｜風速 ${w.wind}km/h`
                    : `☀️ ${w.maxT}~${w.minT}°C｜風速 ${w.wind}km/h`;

                const weatherChannelUrl = `https://weather.com/zh-TW/weather/today/l/${item.lat},${item.lng}`;
                const windyUrl = `https://www.windy.com/${item.lat}/${item.lng}?wind,${item.lat},${item.lng},11`;

                return `
                    <div class="radar-cell ${isWarn ? 'warn' : ''}">
                        <a href="${weatherChannelUrl}" target="_blank" rel="noopener" class="radar-main-link" title="點擊開啟 The Weather Channel 預報">
                            <div class="radar-day-num">${item.dayCode}・${item.locName}</div>
                            <div class="radar-day-status">${statusText}</div>
                        </a>
                        <div class="radar-ext-links">
                            <a href="${weatherChannelUrl}" target="_blank" rel="noopener" class="radar-ext-a">🌤️ Weather</a>
                            <a href="${windyUrl}" target="_blank" rel="noopener" class="radar-ext-a">🌬️ Windy</a>
                        </div>
                    </div>
                `;
            }).join('');

            // 3. 累積式情報剪報
            await updateAndRenderCumulativeClippings(dayRepresentativeCoords, ended);

            if (refreshBtn && isManualClick && !ended) {
                refreshBtn.textContent = '✔ 已更新最新情報';
                setTimeout(() => { refreshBtn.textContent = '↻ 重新整理'; }, 1800);
            }
        }

        async function updateAndRenderCumulativeClippings(dayCoords, isEnded) {
            const storageKey = `flaneur_clippings_archive_v4_${tripId}`;
            let savedArchive = [];
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) savedArchive = JSON.parse(raw);
            } catch (e) {}

            const baseNewsFromItin = Array.isArray(rawItineraryData.urgentNews) ? rawItineraryData.urgentNews : [];
            if (savedArchive.length === 0 && baseNewsFromItin.length > 0) {
                savedArchive = [...baseNewsFromItin];
            } else if (baseNewsFromItin.length > 0) {
                const existingIds = new Set(savedArchive.map(i => i.id));
                baseNewsFromItin.forEach(item => {
                    if (!existingIds.has(item.id)) savedArchive.push(item);
                });
            }

            if (!isEnded) {
                const existingIds = new Set(savedArchive.map(item => item.id));
                dayCoords.forEach(item => {
                    const w = liveWeatherByDay[item.dayCode];
                    if (!w) return;
                    const alertId = `weather-alert-${item.stdRegion}-${w.maxT}-${w.minT}`;
                    if (!existingIds.has(alertId)) {
                        const isSevere = w.wind >= 18 || w.rainProb >= 60 || w.minT <= 0;
                        savedArchive.unshift({
                            id: alertId,
                            category: '天氣',
                            region: item.stdRegion,
                            urgent: isSevere,
                            tag: `${item.dayCode} 即時氣象快訊`,
                            title: `【${item.stdRegion}氣象速報】今日氣溫 ${w.maxT}~${w.minT}°C・降雨/雪機率 ${w.rainProb}%・最大風速 ${w.wind} km/h`,
                            desc: isSevere
                                ? `⚠️ 監測到低溫或較強陣風，前往戶外景區與搭乘跨區交通請留意最新運行狀態。`
                                : `目前 ${item.stdRegion} 氣候穩定，適合按原訂計畫展開戶外行程。`
                        });
                        existingIds.add(alertId);
                    }
                });
                try {
                    localStorage.setItem(storageKey, JSON.stringify(savedArchive.slice(0, 35)));
                } catch (e) {}
            }

            allInfoClippings = savedArchive;

            const regionSet = new Set();
            normalizedDays.forEach(d => { if (d.region) regionSet.add(d.region); });
            savedArchive.forEach(i => { if (i.region) regionSet.add(i.region); });

            const regSelect = document.getElementById('clip-region-select');
            regSelect.innerHTML = `<option value="ALL">全部地區</option>` +
                Array.from(regionSet).map(r => `<option value="${r}">${r}</option>`).join('');

            filterInfoClippings();
        }

        function filterInfoClippings() {
            const reg = document.getElementById('clip-region-select').value;
            const kw = (document.getElementById('clip-search-input').value || '').trim().toLowerCase();

            const filtered = allInfoClippings.filter(item => {
                const matchCat = currentClipCategory === 'ALL' || item.category === currentClipCategory;
                const matchReg = reg === 'ALL' || item.region === reg;
                const matchKw = !kw || item.title.toLowerCase().includes(kw) || item.desc.toLowerCase().includes(kw);
                return matchCat && matchReg && matchKw;
            });

            const listEl = document.getElementById('info-clippings-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 24px; color:#718096; font-size:0.88rem;">目前沒有符合篩選條件的快訊剪報</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="clip-item ${item.urgent ? 'urgent' : ''}">
                    <div class="clip-item-top">
                        <span>
                            ${item.urgent ? '<span class="clip-urgent-badge">🚨 緊急注意</span> ' : ''}
                            📌 分類：${item.category} ｜ 地區：<strong>${item.region}</strong>
                        </span>
                        <span>${item.tag || ''}</span>
                    </div>
                    <div class="clip-item-title">${item.title}</div>
                    <div class="clip-item-desc">${item.desc}</div>
                </div>
            `).join('');
        }

        document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentClipCategory = btn.getAttribute('data-cat');
                filterInfoClippings();
            });
        });

        /* ==============================================================
           9. 🎫 票券蒐集引擎 (全面讀取 itinerary/*.json 並支援同名連續住宿自動合併)
           ============================================================== */
        function toggleAllTicketsInPanel(panelId, expand) {
            const container = document.getElementById(panelId);
            if (!container) return;
            container.querySelectorAll('.collapsible-ticket-card').forEach(card => {
                card.classList.toggle('open', expand);
            });
        }

        function filterExpenseItems(cat, btnEl) {
            document.querySelectorAll('.expense-filter-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            const listEl = document.getElementById('expense-items-container');
            if (!listEl) return;

            const filtered = cat === 'ALL'
                ? allExpenseDetails
                : allExpenseDetails.filter(item => item.category === cat);

            listEl.innerHTML = filtered.map(item => `
                <div class="expense-item-row">
                    <div class="expense-item-left">
                        <span class="expense-cat-tag ${item.category}">${item.categoryIcon} ${item.category}</span>
                        ${item.day ? `<span class="expense-day-tag">${item.day}</span>` : ''}
                        <span class="expense-item-title">${item.title}</span>
                    </div>
                    <div class="expense-item-amount">${currentCurrencySymbol}${Number(item.amount).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function renderPackAndBudgetViews() {
            const transportTickets = [];
            const rawHotelEntries = [];
            const transits = [];
            const foods = [];
            const autoExpenses = [];
            let totalSpotCount = 0;

            // 1. 讀取 itinerary/*.json 的 hotelVouchers
            const hvSource = Array.isArray(rawItineraryData.hotelVouchers) ? rawItineraryData.hotelVouchers : [];
            hvSource.forEach((hv, idx) => {
                const nameClean = (hv.hotelName || '').trim();
                rawHotelEntries.push({
                    key: nameClean.split('(')[0].trim(),
                    officialName: nameClean,
                    dayStart: hv.checkIn || `Day 0${idx + 1}`,
                    dayEnd: hv.checkOut || '',
                    nights: Number(hv.nights) || 1,
                    bookingId: hv.bookingId || `HTL-0${idx + 1}`,
                    roomType: hv.roomType || '標準雙人房',
                    mealPlan: hv.mealPlan || '依訂單方案為準',
                    address: hv.address || '',
                    estNightCost: Number(hv.estNightCost) || 6500
                });
            });

            // 2. 掃描所有章節站點，萃取重要交通票券、舟車段次與佳餚清單
            normalizedDays.forEach((dayObj) => {
                (dayObj.chapters || []).forEach((ch, cIdx) => {
                    totalSpotCount++;
                    const prevCh = cIdx > 0 ? dayObj.chapters[cIdx - 1] : null;
                    const meta = classifyChapterMeta(ch, cIdx, prevCh);

                    if (meta.stampChar === '驛' || /機場|Skyliner|新幹線|翼號|纜車|遊船|狐狸村|動物園|鐵塔/i.test(meta.pureName)) {
                        const isFlight = /機場/i.test(meta.pureName) && /航班|起飛|KHH|NRT/i.test(`${meta.pureName} ${meta.transitInfo?.seatType || ''}`);
                        transportTickets.push({
                            day: dayObj.day,
                            type: isFlight ? 'flight' : (meta.stampChar === '驛' ? 'transit' : 'spot'),
                            leftLabel: isFlight ? '飛' : (meta.stampChar === '驛' ? '座' : '券'),
                            title: meta.transitInfo ? meta.transitInfo.routeText : meta.pureName,
                            seatType: meta.transitInfo ? meta.transitInfo.seatType : meta.categoryLabel,
                            alignedClock: meta.timeStr,
                            timeRange: meta.transitInfo ? meta.transitInfo.timeRange : meta.timeStr,
                            timetableUrl: meta.transitInfo ? meta.transitInfo.timetableUrl : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meta.pureName)}`,
                            timetableLabel: meta.transitInfo ? meta.transitInfo.timetableLabel : '查看時刻表與官網',
                            note: meta.noteText
                        });
                    }

                    if (meta.transitInfo && (meta.transitInfo.cost > 0 || meta.transitInfo.mode !== 'walk')) {
                        transits.push({
                            day: dayObj.day,
                            ...meta.transitInfo
                        });

                        if (meta.transitInfo.cost > 0) {
                            autoExpenses.push({
                                category: '交通',
                                categoryIcon: '🚄',
                                day: dayObj.day,
                                title: `車資｜${meta.transitInfo.routeText}`,
                                amount: meta.transitInfo.cost
                            });
                        }
                    }

                    if (meta.isFoodSpot) {
                        const isCustomReview = Boolean(ch.foodReview && !ch.foodReview.includes('【AI 美味預覽'));
                        foods.push({
                            day: dayObj.day,
                            time: meta.timeStr,
                            pureRestaurantName: meta.pureName,
                            foodReview: meta.foodReview,
                            foodReviewIsCustom: isCustomReview,
                            foodPolicy: meta.foodPolicy
                        });
                    }
                });
            });

            // 3. 同名且日期相連之飯店自動合併成單一住宿憑證
            const mergedHotels = [];
            rawHotelEntries.forEach(entry => {
                const last = mergedHotels[mergedHotels.length - 1];
                if (last && last.key === entry.key && (!last.dayEnd || last.dayEnd === entry.dayStart)) {
                    last.totalNights += entry.nights;
                    last.dayEnd = entry.dayEnd;
                    if (entry.bookingId && !last.bookingIds.includes(entry.bookingId)) {
                        last.bookingIds.push(entry.bookingId);
                    }
                } else {
                    mergedHotels.push({
                        ...entry,
                        totalNights: entry.nights,
                        bookingIds: [entry.bookingId]
                    });
                }
            });

            // 4. 渲染「🎫 票券住宿憑證」
            const vContainer = document.getElementById('pack-vouchers');
            const hotelsHTML = mergedHotels.map(h => `
                <div class="collapsible-ticket-card">
                    <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                        <div class="ticket-left-strip hotel">
                            <span style="font-size:0.7rem; opacity:0.85;">${h.dayStart}</span>
                            <strong style="font-size:1rem;">宿</strong>
                        </div>
                        <div class="ticket-head-main">
                            <div>
                                <div class="ticket-head-title">🏨 ${h.officialName}</div>
                                <div class="ticket-head-sub">入住區間：${h.dayStart} ➔ ${h.dayEnd}（連續住宿已自動彙整）</div>
                            </div>
                            <div class="ticket-head-right">
                                <span class="ticket-time-pill reserved">🌙 連續 ${h.totalNights} 晚</span>
                                <span class="ticket-arrow">▶</span>
                            </div>
                        </div>
                    </div>
                    <div class="ticket-detail-body">
                        <div class="hotel-voucher-paper">
                            <div class="hv-top-banner">
                                <span>HOTEL CONFIRMATION VOUCHER ・ 住宿確認憑證</span>
                                <span class="hv-stamp-confirmed">✔ CONFIRMED 已確認</span>
                            </div>
                            <div class="hv-Check-grid">
                                <div>
                                    <div class="hv-check-label">CHECK-IN 入住時間</div>
                                    <div class="hv-check-val">${h.dayStart} · 15:00 後</div>
                                </div>
                                <div class="hv-nights-pill">共 ${h.totalNights} 晚</div>
                                <div>
                                    <div class="hv-check-label">CHECK-OUT 退房時間</div>
                                    <div class="hv-check-val">${h.dayEnd} · 11:00 前</div>
                                </div>
                            </div>
                            <table class="hv-info-table">
                                <tr><th>飯店名稱</th><td><strong>${h.officialName}</strong></td></tr>
                                <tr><th>彙整訂單編號</th><td>${h.bookingIds.join(' ／ ')}（共 ${h.bookingIds.length} 筆訂單彙整）</td></tr>
                                <tr><th>預訂房型</th><td>${h.roomType}</td></tr>
                                <tr><th>專案與設施</th><td>${h.mealPlan}</td></tr>
                                <tr><th>地址與交通</th><td>${h.address}</td></tr>
                            </table>
                            <div class="hv-barcode-bar">
                                <div class="css-barcode" title="憑證條碼"></div>
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.officialName)}" target="_blank" rel="noopener" class="timetable-link-btn">🗺️ 開啟飯店 Google 地圖 ↗</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            const transportVouchersHTML = transportTickets.map(t => `
                <div class="collapsible-ticket-card">
                    <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                        <div class="ticket-left-strip ${t.type}">
                            <span style="font-size:0.7rem; opacity:0.85;">${t.day}</span>
                            <strong style="font-size:1rem;">${t.leftLabel}</strong>
                        </div>
                        <div class="ticket-head-main">
                            <div>
                                <div class="ticket-head-title">${t.title}</div>
                                <div class="ticket-head-sub">${t.seatType}</div>
                            </div>
                            <div class="ticket-head-right">
                                <span class="ticket-time-pill">${t.alignedClock}</span>
                                <span class="ticket-arrow">▶</span>
                            </div>
                        </div>
                    </div>
                    <div class="ticket-detail-body">
                        <div style="font-size:0.86rem; line-height:1.65; color:var(--text-dark); margin-bottom:10px;">
                            <div><strong>🕒 航班／班次時刻：</strong>${t.timeRange}</div>
                            <div><strong>💺 席次／票種性質：</strong>${t.seatType}</div>
                            ${t.note ? `<div style="margin-top:6px; padding:8px 12px; background:#FFF9F2; border-left:3px solid #D97724; border-radius:6px; white-space:pre-line;"><strong>⚠️ 乘車／兌票注意：</strong>\n${t.note}</div>` : ''}
                        </div>
                        <div style="display:flex; justify-content:flex-end;">
                            <a href="${t.timetableUrl}" target="_blank" rel="noopener" class="timetable-link-btn">🕒 ${t.timetableLabel} ↗</a>
                        </div>
                    </div>
                </div>
            `).join('');

            vContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>💡 點擊任一項目可展開完整憑證與時刻表（同名連續住宿已自動合併）：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-vouchers', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-vouchers', false)">全部收合</button>
                    </div>
                </div>
                <h4 style="margin: 12px 0 8px; color: var(--accent-brown-dark); font-size:0.92rem;">🏨 連續住宿確認憑證（共 ${mergedHotels.length} 間飯店）</h4>
                ${hotelsHTML}
                <h4 style="margin: 20px 0 8px; color: var(--accent-brown-dark); font-size:0.92rem;">✈️ 航班・對號列車・重要票券（共 ${transportTickets.length} 項）</h4>
                ${transportVouchersHTML}
            `;

            // 5. 渲染「🚄 交通班次時刻」
            const tContainer = document.getElementById('pack-transit');
            tContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>呈現「起始站 →（中間轉乘）→ 目的站」與相近發車時刻（點擊展開時刻表連結）：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-transit', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-transit', false)">全部收合</button>
                    </div>
                </div>
                ${transits.map(t => `
                    <div class="collapsible-ticket-card">
                        <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                            <div class="ticket-left-strip transit">
                                <span style="font-size:0.7rem;">${t.day}</span>
                                <strong style="font-size:1.1rem;">${t.icon}</strong>
                            </div>
                            <div class="ticket-head-main">
                                <div>
                                    <div class="ticket-head-title">${t.routeText}</div>
                                    <div class="ticket-head-sub">${t.modeName} ・ ${t.seatType}</div>
                                </div>
                                <div class="ticket-head-right">
                                    <span class="ticket-time-pill">${t.alignedClock}（約 ${t.mins}分）</span>
                                    <span class="ticket-arrow">▶</span>
                                </div>
                            </div>
                        </div>
                        <div class="ticket-detail-body">
                            <div style="font-size:0.86rem; line-height:1.65; margin-bottom:10px;">
                                <div><strong>📍 完整起訖與轉乘動線：</strong>${t.routeText}</div>
                                <div><strong>🕒 班次時刻說明：</strong>${t.timeRange}</div>
                                <div><strong>💺 座位性質：</strong>${t.seatType}</div>
                                <div><strong>💰 預估單程車資：</strong>${currentCurrencySymbol}${t.cost.toLocaleString()}</div>
                            </div>
                            <div style="display:flex; justify-content:flex-end;">
                                <a href="${t.timetableUrl}" target="_blank" rel="noopener" class="timetable-link-btn">🕒 ${t.timetableLabel} ↗</a>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;

            // 6. 渲染「💰 旅途預算花費」
            const bContainer = document.getElementById('pack-budget');
            const rawExpenseList = Array.isArray(rawItineraryData.expenseItems) && rawItineraryData.expenseItems.length > 0
                ? rawItineraryData.expenseItems
                : autoExpenses;

            allExpenseDetails = rawExpenseList.map(item => ({
                category: item.category || '交通',
                categoryIcon: item.category === '住宿' ? '🏨' : (item.category === '餐飲' ? '🍽️' : (item.category === '門票' ? '🎟️' : '🚄')),
                day: item.day || '',
                title: item.title,
                amount: Number(item.amount) || 0
            }));

            const sumByCat = { 交通: 0, 住宿: 0, 餐飲: 0, 門票: 0 };
            allExpenseDetails.forEach(item => {
                if (sumByCat[item.category] !== undefined) sumByCat[item.category] += item.amount;
                else sumByCat['交通'] += item.amount;
            });

            const totalEstimated = Object.values(sumByCat).reduce((a, b) => a + b, 0);
            const budgetCap = Number(rawItineraryData.budgetTotal) || Math.max(160000, Math.ceil(totalEstimated * 1.15 / 10000) * 10000);

            const catSummaryRows = [
                { name: '🚄 交通車資（航班／新幹線／JR／巴士）', amount: sumByCat['交通'] },
                { name: '🏨 住宿預估（各飯店連續住宿合計）', amount: sumByCat['住宿'] },
                { name: '🍽️ 餐飲預估（特色正餐與在地美食）', amount: sumByCat['餐飲'] },
                { name: '🎟️ 門票與體驗（纜車／遊船／園區門票）', amount: sumByCat['門票'] }
            ];

            bContainer.innerHTML = `
                <div class="budget-card">
                    <div style="display:flex; justify-content:space-between; align-items:baseline;">
                        <div>
                            <div style="font-size:0.78rem; color:var(--text-light);">旅途行跡統計</div>
                            <div style="font-size:1.5rem; font-weight:700; color:#3B4D54;">${normalizedDays.length} 天 ・ ${totalSpotCount} 處打卡</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:0.78rem; color:var(--text-light);">旅途預估總花費 (${currentCurrencyCode})</div>
                            <div style="font-size:1.3rem; font-weight:700; color:#B84A39;">${currentCurrencySymbol}${totalEstimated.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="budget-bar-wrap">
                        <div class="budget-bar-fill" style="width: ${Math.min(100, Math.round((totalEstimated / budgetCap) * 100))}%;"></div>
                    </div>
                    <div style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 16px;">
                        預估預算上限：${currentCurrencySymbol}${budgetCap.toLocaleString()} ｜ 預留彈性空間：${currentCurrencySymbol}${Math.max(0, budgetCap - totalEstimated).toLocaleString()}
                    </div>
                    ${catSummaryRows.map(cat => {
                        const pct = totalEstimated > 0 ? Math.round((cat.amount / totalEstimated) * 100) : 0;
                        return `
                            <div class="budget-cat-row">
                                <div class="budget-cat-top">
                                    <span>${cat.name}</span>
                                    <span>${currentCurrencySymbol}${cat.amount.toLocaleString()} (${pct}%)</span>
                                </div>
                                <div class="budget-bar-wrap" style="height:6px; margin:4px 0;">
                                    <div class="budget-bar-fill" style="width:${pct}%; background:#C4A99E;"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="expense-detail-panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                        <h4 style="margin:0; font-size:0.98rem; color:#3B4D54;">📋 預估花費細項明細（共 ${allExpenseDetails.length} 筆）</h4>
                        <span style="font-size:0.76rem; color:var(--text-light);">＊可於 /admin/ 後台「行程規劃」直接修改細項金額</span>
                    </div>
                    <div class="expense-filter-bar">
                        <button type="button" class="expense-filter-btn active" onclick="filterExpenseItems('ALL', this)">全部細項 (${allExpenseDetails.length})</button>
                        <button type="button" class="expense-filter-btn" onclick="filterExpenseItems('交通', this)">🚄 交通車資</button>
                        <button type="button" class="expense-filter-btn" onclick="filterExpenseItems('住宿', this)">🏨 住宿費用</button>
                        <button type="button" class="expense-filter-btn" onclick="filterExpenseItems('餐飲', this)">🍽️ 餐飲預估</button>
                        <button type="button" class="expense-filter-btn" onclick="filterExpenseItems('門票', this)">🎟️ 門票體驗</button>
                    </div>
                    <div id="expense-items-container"></div>
                </div>
            `;
            filterExpenseItems('ALL', bContainer.querySelector('.expense-filter-btn'));

            // 7. 渲染「🍱 在地美食紀錄」
            const fContainer = document.getElementById('pack-food');
            fContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>旅途美食清單：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-food', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-food', false)">全部收合</button>
                    </div>
                </div>
                ${foods.map((f, i) => `
                    <div class="collapsible-ticket-card ${i < 2 ? 'open' : ''}">
                        <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                            <div class="ticket-left-strip spot">
                                <span style="font-size:0.7rem;">${f.day}</span>
                                <strong style="font-size:0.95rem;">#${i + 1}</strong>
                            </div>
                            <div class="ticket-head-main">
                                <div>
                                    <div class="ticket-head-title">🍱 ${f.pureRestaurantName}</div>
                                    <div class="ticket-head-sub">預計用餐時段：${f.time}</div>
                                </div>
                                <div class="ticket-head-right">
                                    <span class="ticket-time-pill">${f.foodReviewIsCustom ? '✨ 已更新實測' : '🤖 AI 預覽'}</span>
                                    <span class="ticket-arrow">▶</span>
                                </div>
                            </div>
                        </div>
                        <div class="ticket-detail-body">
                            <div class="food-review-box">
                                <div style="font-weight:700; margin-bottom:4px; color:#1E40AF;">
                                    📘 美味紀錄 ${f.foodReviewIsCustom ? '（✏️ 後台實測更新）' : '（🤖 預設 AI 招牌菜色預覽・用餐後可從後台更新）'}
                                </div>
                                <div style="white-space:pre-line;">${f.foodReview}</div>
                            </div>
                            <div class="food-policy-box">
                                <div style="font-weight:700; margin-bottom:4px; color:#22543D;">
                                    ⚠️ 用餐／預約注意（🌐 網路查詢公告規定・低消與行業潛規則）
                                </div>
                                <div style="white-space:pre-line;">${f.foodPolicy}</div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }
    </script>
</body>
</html>
