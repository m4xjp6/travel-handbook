<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* === 1. 全域色彩變數與基礎頁面設定 === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-yellow: #FFE599;     /* 標題底線亮黃色 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕 */
            --accent-pink: #E5D1C7;       /* 藕粉底色 */
            --accent-sage: #D8E2D5;       /* 鼠尾草綠 */
            --text-dark: #4A4A4A;         /* 主要深灰文字 */
            --text-light: #7A7A7A;        /* 內文淺灰文字 */
            --border-soft: rgba(196, 169, 158, 0.32);
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* === 2. 左右雙欄主版面配置 (左地圖 50% / 右內容 50%) === */
        .container { display: flex; width: 100%; }
        #map-container {
            position: sticky;
            top: 0;
            width: 50vw;
            height: 100vh;
            background-color: var(--accent-pink);
        }
        #map { width: 100%; height: 100%; }
        #right-panel { width: 50vw; box-sizing: border-box; }

        .map-mode-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(6px);
            padding: 5px 8px;
            border-radius: 24px;
            border: 1.5px solid var(--border-soft);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }
        .map-mode-btn {
            font-family: inherit;
            border: none;
            background: transparent;
            color: var(--text-dark);
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .map-mode-btn.active {
            background: var(--accent-brown-dark);
            color: white;
        }
        .map-stats-pill {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 800;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-brown-dark);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            pointer-events: none;
        }

        /* === 3. 右側頂部常駐導覽列、四大模式切換與天數切換按鈕 === */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 247, 0.96);
            backdrop-filter: blur(8px);
            padding: 14px 36px 12px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-brown-dark);
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .trip-main-title {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent-brown-dark);
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 頂部四大功能模式列（順序：行程安排 > 資訊情報 > 票券蒐集 > 圖文遊記） */
        .view-mode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .view-mode-btn {
            font-family: inherit;
            background: transparent;
            color: var(--text-dark);
            border: 1.5px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .view-mode-btn:hover {
            color: var(--accent-brown-dark);
            border-color: var(--border-soft);
        }
        .view-mode-btn.active {
            background: var(--accent-brown);
            color: white;
            border-color: var(--accent-brown);
            box-shadow: 0 3px 9px rgba(196, 169, 158, 0.4);
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .day-tab {
            border: 1px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 5px 13px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-tab:hover { background: var(--accent-pink); color: white; }
        .day-tab.active {
            background: var(--accent-brown-dark);
            border-color: var(--accent-brown-dark);
            color: white;
            box-shadow: 0 2px 8px rgba(166, 137, 124, 0.35);
        }

        /* === 4. 視角容器與圖文遊記樣式 === */
        .view-section {
            display: none;
            padding: 26px 36px 60px;
        }
        .view-section.active {
            display: block;
        }

        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 14px 0 26px;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .day-banner .day-badge,
        .day-banner .field-test-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.28);
            color: white;
            padding: 4px 12px;
            height: 24px;
            box-sizing: border-box;
            border-radius: 12px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            font-weight: bold;
            line-height: 1;
        }
        .day-banner h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .chapter {
            min-height: 65vh;
            margin-bottom: 45px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15);
            position: relative;
            transition: opacity 0.4s ease;
            opacity: 0.35;
        }
        .chapter.active { opacity: 1; }
        .chapter h2 {
            color: var(--accent-brown);
            font-size: 1.3rem;
            margin-top: 0;
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 10px;
            display: inline-block;
        }
        .chapter-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1rem;
            letter-spacing: 0.04em;
            white-space: pre-line;
        }
        .photo-placeholder {
            width: 100%;
            min-height: 220px;
            background-color: var(--accent-pink);
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            overflow: hidden;
        }

        /* === 5. 多媒體畫廊與燈箱 === */
        .media-gallery {
            margin: 20px 0;
            display: grid;
            gap: 10px;
            width: 100%;
        }
        .media-gallery.layout-single,
        .media-gallery.layout-stack { grid-template-columns: 1fr; }
        .media-gallery.layout-single .media-item { max-height: 440px; }
        .media-gallery.layout-auto-2,
        .media-gallery.layout-grid-equal { grid-template-columns: repeat(2, 1fr); }
        .media-gallery.layout-auto-3,
        .media-gallery.layout-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .media-gallery.layout-auto-4,
        .media-gallery.layout-grid-4 { grid-template-columns: repeat(4, 1fr); }
        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        .media-gallery.layout-grid-1-2-1 { grid-template-columns: 1fr 2fr 1fr; }
        .media-gallery.layout-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .media-gallery.layout-carousel .media-item {
            flex: 0 0 82%;
            scroll-snap-align: center;
        }
        .media-item {
            position: relative;
            min-width: 0;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f5efe6;
            height: 260px;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .media-item img:hover,
        .media-item video:hover { transform: scale(1.02); }
        .media-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.65));
            color: #fff;
            font-size: 0.78rem;
            padding: 16px 10px 6px;
            pointer-events: none;
        }
        .replay-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 5;
        }
        .replay-btn:hover { background: rgba(0, 0, 0, 0.8); }

        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
            touch-action: pan-y;
        }
        #lightbox-overlay img,
        #lightbox-overlay video {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            object-fit: contain;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
            backdrop-filter: blur(4px);
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }
        .lightbox-nav:hover {
            background: rgba(196, 169, 158, 0.85);
            transform: translateY(-50%) scale(1.08);
        }
        .lightbox-nav.prev { left: 24px; }
        .lightbox-nav.next { right: 24px; }
        .lightbox-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10001;
            white-space: nowrap;
        }

        /* === 6. 內文重點提示框與預訂按鈕 === */
        .callout-box {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #333;
            white-space: normal;
        }
        .callout-icon { font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
        .callout-content { flex-grow: 1; }
        .callout-title { font-weight: bold; margin-bottom: 4px; }
        .callout-tip { background-color: #fdf6ec; border-left: 4px solid #e6a23c; }
        .callout-tip .callout-title { color: #b88230; }
        .callout-sci { background-color: #f0f9eb; border-left: 4px solid #67c23a; }
        .callout-sci .callout-title { color: #529b2e; }
        .callout-info { background-color: #eef4ff; border-left: 4px solid #3b82f6; }
        .callout-info .callout-title { color: #2563eb; }
        .callout-story { background-color: #f6f2ff; border-left: 4px solid #8b5cf6; }
        .callout-story .callout-title { color: #6d28d9; }
        .callout-warning { background-color: #fff1f2; border-left: 4px solid #f43f5e; }
        .callout-warning .callout-title { color: #be123c; }

        .affiliate-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed rgba(196, 169, 158, 0.35);
        }
        .affiliate-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background-color: #f7f1ed;
            color: var(--accent-brown-dark);
            border: 1px solid #d8c3b8;
            border-radius: 24px;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(196, 169, 158, 0.15);
        }
        .affiliate-btn:hover {
            background-color: var(--accent-brown);
            color: #ffffff;
            border-color: var(--accent-brown);
            transform: translateY(-2px);
        }
        .affiliate-btn .arrow-icon { font-size: 0.85em; opacity: 0.85; }

        /* ==============================================================
           7. 模組一：📅 行程安排 (分離「📘 景點介紹」與「⚠️ 注意事項」)
           ============================================================== */
        .itinerary-day-block { margin-bottom: 38px; }
        .itin-day-header { margin-bottom: 14px; }
        .itin-day-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.32rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 6px 0;
        }
        .itin-day-sub {
            font-size: 0.88rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .itin-summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #F4EFE6;
            border: 1.5px solid #D8C8B8;
            border-radius: 14px;
            padding: 14px 10px;
            margin: 14px 0 18px;
            text-align: center;
        }
        .itin-sum-col:first-child { border-right: 1px solid #DFD3C5; }
        .itin-sum-label { font-size: 0.78rem; color: var(--text-light); margin-bottom: 4px; }
        .itin-sum-val {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #2C3E50;
        }
        .itin-sum-val.cost { color: #B84A39; }

        .itin-transit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 6px 0;
            font-size: 0.84rem;
            color: var(--text-light);
            border-bottom: 1px dotted rgba(196, 169, 158, 0.45);
        }
        .itin-transit-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .itin-transit-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #EFE7DA;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .itin-transit-right {
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .spot-intro-card {
            background: white;
            border: 1.5px solid #8E7F76;
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(196, 169, 158, 0.12);
            transition: box-shadow 0.2s;
        }
        .spot-intro-card:hover {
            box-shadow: 0 5px 16px rgba(196, 169, 158, 0.24);
        }
        .spot-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            gap: 10px;
        }
        .spot-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .spot-time-box {
            background: #F4EFE6;
            border: 1.5px solid #6E6259;
            color: #3A322D;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.92rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 10px;
            letter-spacing: 0.03em;
        }
        .spot-cat-pill {
            background: #F5E6D3;
            color: #9C6B3B;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
        }
        .spot-title-text {
            font-size: 1.02rem;
            font-weight: 700;
            color: #2B2B2B;
        }
        .spot-toggle-arrow {
            color: #8E7F76;
            font-size: 0.85rem;
            transition: transform 0.25s ease;
        }
        .spot-intro-card.open .spot-toggle-arrow {
            transform: rotate(90deg);
        }
        .spot-card-body {
            display: none;
            padding: 0 18px 16px;
            border-top: 1px dashed #E5DEC9;
        }
        .spot-intro-card.open .spot-card-body {
            display: block;
        }

        /* 分離標註：📘 景點介紹 vs ⚠️ 注意事項 */
        .spot-sub-block {
            margin-top: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.68;
        }
        .spot-sub-block.intro-block {
            background: #F9F6F0;
            border-left: 3.5px solid #4A7C59;
            color: var(--text-dark);
        }
        .spot-sub-block.note-block {
            background: #FFF9F2;
            border-left: 3.5px solid #D97724;
            color: #5C4028;
        }
        .spot-sub-title {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .spot-sub-block.intro-block .spot-sub-title { color: #3B6E4C; }
        .spot-sub-block.note-block .spot-sub-title { color: #B85D14; }
        .spot-sub-text {
            white-space: pre-line;
            margin: 0;
        }

        .spot-action-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .spot-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #C9D6DF;
            background: #F0F5F9;
            color: #3A506B;
            transition: all 0.2s;
        }
        .spot-pill-btn.loc {
            background: #F4EFE6;
            border-color: #D8C8B8;
            color: #6E5A4F;
        }
        .spot-pill-btn:hover {
            transform: translateY(-1px);
            filter: brightness(0.96);
        }

        /* ==============================================================
           8. 模組二：📡 資訊情報 (結束自動停止更新、連動 Weather/Windy、緊急新聞快訊)
           ============================================================== */
        .info-station-header {
            background: linear-gradient(135deg, #EBF3F9 0%, #F5F9FC 100%);
            border: 1.5px solid #C5D9E8;
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 20px;
        }
        .info-tag-pill {
            display: inline-block;
            background: white;
            border: 1px solid #B8CFE0;
            color: #3B5975;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .info-station-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: #23394D;
            margin: 0 0 6px 0;
        }
        .info-station-sub {
            font-size: 0.86rem;
            color: #546E85;
            margin: 0 0 14px 0;
        }
        .info-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(184, 207, 224, 0.5);
            font-size: 0.82rem;
            color: #46637A;
        }
        .info-live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #38A169;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.2);
        }
        .info-live-dot.ended {
            background: #A0AEC0;
            box-shadow: none;
        }
        .info-refresh-btn {
            font-family: inherit;
            background: white;
            color: #2B4C6F;
            border: 1.5px solid #B0C7D9;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .info-refresh-btn:hover:not(:disabled) {
            background: #2B4C6F;
            color: white;
        }
        .info-refresh-btn:disabled {
            background: #EDF2F7;
            color: #718096;
            border-color: #CBD5E0;
            cursor: not-allowed;
        }

        .info-card-panel {
            background: white;
            border: 1.5px solid #D5E3ED;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(59, 89, 117, 0.06);
        }
        .info-panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #23394D;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .quick-read-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .quick-read-list li {
            padding: 10px 0;
            border-bottom: 1px dashed #E2ECF2;
            font-size: 0.9rem;
            line-height: 1.55;
            color: #2D3748;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .quick-read-list li:last-child { border-bottom: none; }

        /* 每日行程天氣與風速影響雷達（點擊直連真實氣象網站 Weather.com & Windy） */
        .radar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .radar-cell {
            background: #F8FBFD;
            border: 1px solid #D5E3ED;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }
        .radar-cell:hover {
            border-color: #7FA6C4;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(59, 89, 117, 0.1);
        }
        .radar-main-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .radar-day-num {
            font-weight: 700;
            font-size: 0.88rem;
            color: #23394D;
            margin-bottom: 3px;
        }
        .radar-day-status {
            font-size: 0.76rem;
            color: #647F94;
            line-height: 1.35;
        }
        .radar-cell.warn {
            background: #FFFDF5;
            border-color: #F6AD55;
        }
        .radar-cell.warn .radar-day-status {
            color: #C05621;
            font-weight: 600;
        }
        .radar-ext-links {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding-top: 5px;
            border-top: 1px dashed #E2ECF2;
        }
        .radar-ext-a {
            font-size: 0.7rem;
            font-weight: 600;
            color: #2B6CB0;
            background: #EBF8FF;
            padding: 2px 7px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .radar-ext-a:hover {
            background: #BEE3F8;
        }

        /* 情報剪報篩選與緊急快訊列表 */
        .clip-filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .clip-pill {
            border: 1px solid #C5D9E8;
            background: white;
            color: #46637A;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .clip-pill.active {
            background: #4A7696;
            border-color: #4A7696;
            color: white;
        }
        .clip-search-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        .clip-input, .clip-select {
            font-family: inherit;
            border: 1px solid #C5D9E8;
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 0.84rem;
            color: #23394D;
            background: #F8FBFD;
        }
        .clip-item {
            padding: 12px 14px;
            border-radius: 12px;
            background: #F8FBFD;
            border: 1px solid #E2ECF2;
            margin-bottom: 8px;
        }
        .clip-item.urgent {
            background: #FFFDF9;
            border-left: 4px solid #DD6B20;
        }
        .clip-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #647F94;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .clip-urgent-badge {
            background: #FEEBC8;
            color: #9C4221;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 6px;
            font-size: 0.72rem;
        }
        .clip-item-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #23394D;
            margin-bottom: 4px;
        }
        .clip-item-desc {
            font-size: 0.83rem;
            color: #4A5568;
            line-height: 1.5;
        }

        /* ==============================================================
           9. 模組三：🎫 票券蒐集 (全面可收合手風琴、擬真住宿憑證、時刻表連結)
           ============================================================== */
        .pack-sub-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #F3ECE3;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 16px;
        }
        .pack-sub-btn {
            font-family: inherit;
            border: none;
            background: transparent;
            color: var(--text-dark);
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
        }
        .pack-sub-btn.active {
            background: #3B4D54;
            color: white;
        }
        .pack-panel { display: none; }
        .pack-panel.active { display: block; }

        .pack-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.84rem;
            color: var(--text-light);
            flex-wrap: wrap;
            gap: 8px;
        }
        .pack-toggle-all-btn {
            font-family: inherit;
            background: white;
            border: 1px solid var(--accent-brown);
            color: var(--accent-brown-dark);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }
        .pack-toggle-all-btn:hover {
            background: var(--accent-pink);
            color: white;
        }

        /* 可收合票券與憑證手風琴外框 */
        .collapsible-ticket-card {
            background: white;
            border-radius: 14px;
            border: 1.5px solid var(--border-soft);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 9px rgba(196, 169, 158, 0.1);
            transition: box-shadow 0.2s;
        }
        .collapsible-ticket-card:hover {
            box-shadow: 0 4px 14px rgba(196, 169, 158, 0.22);
        }
        .ticket-summary-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            min-height: 56px;
        }
        .ticket-left-strip {
            width: 56px;
            align-self: stretch;
            background: #3B4D54;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            flex-shrink: 0;
        }
        .ticket-left-strip.hotel { background: #5B4B49; }
        .ticket-left-strip.spot { background: #8C4A32; }
        .ticket-left-strip.transit { background: #6E5A4F; }

        .ticket-head-main {
            flex: 1;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ticket-head-title {
            font-weight: 700;
            font-size: 0.94rem;
            color: var(--text-dark);
        }
        .ticket-head-sub {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-top: 2px;
        }
        .ticket-head-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ticket-time-pill {
            background: #F4EFE6;
            border: 1px solid #D8C8B8;
            color: #5A463C;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .ticket-time-pill.reserved {
            background: #EBF5EE;
            border-color: #A3C9AE;
            color: #2F6B43;
        }
        .ticket-arrow {
            color: var(--accent-brown-dark);
            font-size: 0.8rem;
            transition: transform 0.25s;
            padding-right: 4px;
        }
        .collapsible-ticket-card.open .ticket-arrow {
            transform: rotate(90deg);
        }
        .ticket-detail-body {
            display: none;
            padding: 14px 16px 16px;
            background: #FCFBF9;
            border-top: 1.5px dashed #E2D9CE;
        }
        .collapsible-ticket-card.open .ticket-detail-body {
            display: block;
        }

        /* 擬真飯店住宿確認憑證樣式 (Hotel Confirmation Voucher) */
        .hotel-voucher-paper {
            background: #FFFFFF;
            border: 1.5px solid #C8B6A6;
            border-radius: 12px;
            overflow: hidden;
        }
        .hv-top-banner {
            background: linear-gradient(135deg, #4A3E3B 0%, #6E5D58 100%);
            color: #F7EFE8;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
        }
        .hv-stamp-confirmed {
            border: 1.5px solid #9AE6B4;
            color: #9AE6B4;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.72rem;
        }
        .hv-Check-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: #F8F4EE;
            padding: 12px 16px;
            border-bottom: 1px solid #EAE0D5;
            text-align: center;
            gap: 8px;
        }
        .hv-check-label { font-size: 0.72rem; color: #8C7A6B; font-weight: 600; }
        .hv-check-val { font-family: 'Noto Serif TC', serif; font-size: 0.96rem; font-weight: 700; color: #3A2E2A; margin-top: 2px; }
        .hv-nights-pill {
            background: #5B4B49;
            color: white;
            padding: 4px 11px;
            border-radius: 16px;
            font-size: 0.76rem;
            font-weight: 700;
        }
        .hv-info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .hv-info-table th, .hv-info-table td {
            padding: 8px 14px;
            border-bottom: 1px solid #F0EAE2;
            text-align: left;
        }
        .hv-info-table th {
            width: 28%;
            color: #8C7A6B;
            font-weight: 600;
            background: #FDFBF9;
        }
        .hv-barcode-bar {
            padding: 10px 16px;
            background: #FAF6F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .css-barcode {
            height: 24px;
            width: 140px;
            background: repeating-linear-gradient(90deg, #3A2E2A 0px, #3A2E2A 2px, transparent 2px, transparent 5px, #3A2E2A 5px, #3A2E2A 6px, transparent 6px, transparent 9px);
            opacity: 0.75;
        }

        /* 時刻表與票券行動按鈕 */
        .timetable-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #EDF6F9;
            color: #1D5B79;
            border: 1px solid #B6D7E8;
            padding: 6px 13px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }
        .timetable-link-btn:hover {
            background: #1D5B79;
            color: white;
        }

        .budget-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-soft);
            margin-bottom: 16px;
        }
        .budget-bar-wrap {
            height: 8px;
            background: #EFEAE4;
            border-radius: 6px;
            overflow: hidden;
            margin: 8px 0 14px;
        }
        .budget-bar-fill {
            height: 100%;
            background: #3B4D54;
            border-radius: 6px;
        }
        .budget-cat-row { margin-bottom: 12px; }
        .budget-cat-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        /* === 10. 地圖標記、尋訪方章、路線方向箭頭與專屬旅程頭貼角色 === */
        .custom-marker { background: transparent; border: none; }
        .custom-marker .marker-dot {
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            background-color: var(--accent-brown);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .custom-marker:hover .marker-dot,
        .custom-marker.active .marker-dot {
            background-color: var(--accent-brown-dark);
            transform: scale(1.35);
            box-shadow: 0 0 0 4px rgba(255, 229, 153, 0.7), 0 3px 8px rgba(0,0,0,0.3);
        }

        .stamp-marker { background: transparent; border: none; }
        .stamp-box {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: #3B4D54;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'Noto Serif TC', serif;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.28);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .stamp-box.food { background: #9C4A32; }
        .stamp-box.hotel { background: #5B6E58; }
        .stamp-box.transit { background: #7A6258; }
        .stamp-box:hover { transform: scale(1.2); }

        .route-arrow-icon { background: transparent; border: none; pointer-events: none; }
        .route-arrow-inner {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-brown-dark);
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
            text-shadow: 0 0 3px #fff, 0 0 3px #fff;
        }

        .fox-traveler-icon { background: transparent; border: none; z-index: 2000 !important; pointer-events: none; }
        .fox-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2.5px solid var(--accent-brown-dark);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(166, 137, 124, 0.55);
            font-size: 20px;
            overflow: hidden;
            transition: transform 0.15s ease;
        }
        .fox-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fox-wrapper.walking { animation: foxWalkBounce 0.32s infinite alternate ease-in-out; }
        @keyframes foxWalkBounce {
            0% { margin-top: 0px; }
            100% { margin-top: -6px; }
        }

        .marker-tooltip {
            background: rgba(74, 74, 74, 0.92);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .marker-tooltip::before { border-top-color: rgba(74, 74, 74, 0.92) !important; }

        /* === 11. 手機版 RWD 響應式配置 === */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map-container { width: 100vw; height: 38vh; position: sticky; top: 0; z-index: 200; }
            #right-panel { width: 100vw; }
            .top-nav { top: 38vh; padding: 10px 16px; }
            .view-section { padding: 18px 16px 50px; }
            .chapter { min-height: auto; margin-bottom: 30px; padding: 22px 18px; }
            .media-gallery:not(.layout-single):not(.layout-stack):not(.layout-carousel) {
                grid-template-columns: repeat(2, 1fr);
            }
            .media-item { height: 180px; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.1rem; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            .affiliate-btn { width: 100%; justify-content: center; box-sizing: border-box; }
            .radar-grid { grid-template-columns: repeat(2, 1fr); }
            .clip-search-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側常駐地圖區 -->
        <div id="map-container">
            <div class="map-stats-pill" id="map-stats-pill">讀取行跡中...</div>
            <div class="map-mode-overlay">
                <button type="button" class="map-mode-btn active" id="btn-map-route" onclick="switchMapDisplayMode('route')">🗺️ 路線</button>
                <button type="button" class="map-mode-btn" id="btn-map-explore" onclick="switchMapDisplayMode('explore')">🧭 尋訪</button>
            </div>
            <div id="map"></div>
        </div>

        <!-- 右側導覽列與四大視角內容區 -->
        <div id="right-panel">
            <div class="top-nav">
                <div class="nav-header">
                    <a href="index.html" class="back-link">&lt; 書櫃</a>
                    <h2 class="trip-main-title" id="trip-title">讀取中...</h2>
                </div>

                <!-- 頂部四大模式切換列（順序：行程安排 > 資訊情報 > 票券蒐集 > 圖文遊記） -->
                <div class="view-mode-bar">
                    <button type="button" class="view-mode-btn active" data-view="view-itinerary" onclick="switchRightView('view-itinerary')">📅 行程安排</button>
                    <button type="button" class="view-mode-btn" data-view="view-info" onclick="switchRightView('view-info')">📡 資訊情報</button>
                    <button type="button" class="view-mode-btn" data-view="view-pack" onclick="switchRightView('view-pack')">🎫 票券蒐集</button>
                    <button type="button" class="view-mode-btn" data-view="view-journal" onclick="switchRightView('view-journal')">📖 圖文遊記</button>
                </div>

                <!-- 天數篩選列 -->
                <div class="day-tabs" id="day-tabs"></div>
            </div>

            <!-- 視角 1 (預設開啟)：📅 行程安排 -->
            <div id="view-itinerary" class="view-section active">
                <div id="itinerary-content"></div>
            </div>

            <!-- 視角 2：📡 資訊情報 -->
            <div id="view-info" class="view-section">
                <div class="info-station-header">
                    <span class="info-tag-pill" id="info-trip-code">TRIP LIVE ・ 旅の速報</span>
                    <h2 class="info-station-title" id="info-station-title">旅途即時情報手帳</h2>
                    <p class="info-station-sub">掌握出發前與旅途中的即時天氣、JR/巴士運行快訊、防災預警與重要新聞。</p>
                    <div class="info-status-bar">
                        <span><span class="info-live-dot" id="info-live-dot"></span><span id="info-conn-label">即時連線</span> ｜ <span id="info-update-time">更新：讀取中...</span></span>
                        <button type="button" class="info-refresh-btn" id="btn-refresh-info" onclick="refreshInfoStation(true)">↻ 重新整理</button>
                    </div>
                </div>

                <!-- 30 秒情報速讀 -->
                <div class="info-card-panel">
                    <h3 class="info-panel-title">⚡ 30 秒情報速讀：出發前與旅途中先看這五件事</h3>
                    <ul class="quick-read-list" id="info-quick-five"></ul>
                </div>

                <!-- 每日行程天氣與風速影響雷達 (點擊直連 Weather.com / Windy) -->
                <div class="info-card-panel">
                    <h3 class="info-panel-title">
                        <span>🧭 每日行程天氣與風速影響雷達</span>

                <div class="info-card-panel">

                        <input type="text" id="clip-search-input" class="clip-input" placeholder="🔍 搜尋關鍵字（如：新幹線、大雪、延誤...）" oninput="filterInfoClippings()">

            <div id="view-pack" class="view-section">
                <div class="pack-sub-tabs">
                    <button type="button" class="pack-sub-btn active" onclick="switchPackSubTab('pack-vouchers', this)">🎫 票券與住宿憑證</button>
                    <button type="button" class="pack-sub-btn" onclick="switchPackSubTab('pack-transit', this)">🚄 交通時刻與段次</button>
                    <button type="button" class="pack-sub-btn" onclick="switchPackSubTab('pack-budget', this)">💰 旅途盤纏帳目</button>
                    <button type="button" class="pack-sub-btn" onclick="switchPackSubTab('pack-food', this)">🍱 佳餚美食紀錄</button>
                </div>

                <div id="pack-vouchers" class="pack-panel active"></div>
                <div id="pack-transit" class="pack-panel"></div>
                <div id="pack-budget" class="pack-panel"></div>
                <div id="pack-food" class="pack-panel"></div>

            <!-- 視角 4：📖 圖文遊記 -->

    <!-- 點圖/點影片放大預覽燈箱 -->
    <div id="lightbox-overlay" onclick="handleOverlayClick()">
        <button type="button" class="lightbox-nav prev" id="lightbox-prev" onclick="event.stopPropagation(); stepLightbox(-1)">❮</button>
        <img id="lightbox-img" src="" alt="放大預覽" onclick="event.stopPropagation()">
        <video id="lightbox-video" src="" controls loop playsinline onclick="event.stopPropagation()" style="display: none;"></video>
        <button type="button" class="lightbox-nav next" id="lightbox-next" onclick="event.stopPropagation(); stepLightbox(1)">❯</button>
        <div id="lightbox-info" class="lightbox-info"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* === 1. 全域狀態變數與不同旅程專屬頭貼設定 === */
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('trip') || 'tohoku_2026';

        // 不同旅程的預設專屬頭貼與預設結束日期（亦可直接在 JSON 最外層設定 "avatar" 與 "endDate" 覆蓋）
        const TRIP_PRESETS = {
            tohoku_2026: {
                avatar: '🦊',          // 日本東北：小狐狸
                endDate: '2026-01-17'  // 已結束的旅程會自動停止更新情報站並封存剪報
            },
            malaysia_2027: {
                avatar: '🦁',          // 南洋星馬：魚尾獅
                endDate: '2027-04-17'
            }
        };

        let rawTripData = {};
        let currentTripAvatar = TRIP_PRESETS[tripId]?.avatar || '✈️';
        let currentTripEndDate = TRIP_PRESETS[tripId]?.endDate || null;

        let map = null;
        let baseRouteLayer = null;
        let activeRouteLayer = null;
        let markersLayer = null;
        let exploreStampsLayer = null;
        let currentMapMode = 'route';
        let currentDayFilter = 'ALL';

        let foxMarker = null;
        let foxAnimFrame = null;
        let observer = null;
        let videoObserver = null;
        let normalizedDays = [];
        let currentChaptersList = [];
        let currentActiveIndex = 0;

        let lightboxItems = [];
        let lightboxIndex = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let justSwiped = false;

        const segmentCoordsCache = {};
        const chapterMarkers = new Map();
        let isClickScrolling = false;
        let scrollUnlockTimer = null;

        let liveWeatherByDay = {};
        let allInfoClippings = [];
        let currentClipCategory = 'ALL';

        const CURVE_MODES = {
            flight: 0.22,
            hsr: 0.12,
            boat: 0.12,
            train: 0.08,
            metro: 0.05,
            ropeway: 0.04
        };

        /* === 2. 讀取旅程 JSON 資料並初始化所有模組 === */
        fetch(`data/${tripId}.json?t=${Date.now()}`, { cache: 'no-store' })
            .then(res => {
                if (!res.ok) throw new Error('找不到該旅程的資料檔');
                return res.json();
            })
            .then(data => {
                rawTripData = data;
                document.title = data.tripTitle || '電子旅行手帳';
                document.getElementById('trip-title').textContent = data.tripTitle || '';

                // 1. 決定該旅程專屬地圖移動頭貼 (支援 JSON 的 avatar 欄位或 TRIP_PRESETS)
                if (data.avatar && data.avatar.trim() !== '') {
                    currentTripAvatar = data.avatar.trim();
                } else if (TRIP_PRESETS[tripId]?.avatar) {
                    currentTripAvatar = TRIP_PRESETS[tripId].avatar;
                }

                // 2. 決定該旅程結束日期 (用來控制情報站是否顯示「旅程已結束」與停止新增剪報)
                if (data.endDate) {
                    currentTripEndDate = data.endDate;
                } else if (Array.isArray(data.days) && data.days.length > 0) {
                    const lastDayDate = data.days[data.days.length - 1].date;
                    if (lastDayDate) currentTripEndDate = lastDayDate;
                }

                if (Array.isArray(data.days) && data.days.length > 0) {
                    normalizedDays = data.days;
                } else if (Array.isArray(data.chapters)) {
                    const grouped = {};
                    data.chapters.forEach(ch => {
                        const d = ch.day || 'Day 01';
                        if (!grouped[d]) {
                            grouped[d] = { day: d, dayTitle: ch.dayTitle || '', isFieldTest: ch.isFieldTest || false, chapters: [] };
                        }
                        grouped[d].chapters.push(ch);
                    });
                    normalizedDays = Object.values(grouped);
                }

                initMap(normalizedDays);
                buildDayTabs();
                renderDay('ALL');
                renderPackAndBudgetViews();
                refreshInfoStation(false);
            })
            .catch(error => {
                document.getElementById('itinerary-content').innerHTML = `<h2>糟糕，讀取失敗！</h2><p>${error.message}</p>`;
            });

        /* === 3. 右側四大視角切換與左側地圖「路線／尋訪」切換 === */
        function switchRightView(viewId) {
            document.querySelectorAll('.view-mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-view') === viewId);
            });
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.toggle('active', sec.id === viewId);
            });
            const dayTabsEl = document.getElementById('day-tabs');
            dayTabsEl.style.display = (viewId === 'view-journal' || viewId === 'view-itinerary') ? 'flex' : 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchPackSubTab(panelId, btnEl) {
            document.querySelectorAll('.pack-sub-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            document.querySelectorAll('.pack-panel').forEach(p => {
                p.classList.toggle('active', p.id === panelId);
            });
        }

        function switchMapDisplayMode(mode) {
            currentMapMode = mode;
            document.getElementById('btn-map-route').classList.toggle('active', mode === 'route');
            document.getElementById('btn-map-explore').classList.toggle('active', mode === 'explore');

            if (mode === 'explore') {
                map.removeLayer(baseRouteLayer);
                map.removeLayer(activeRouteLayer);
                map.removeLayer(markersLayer);
                if (foxMarker) foxMarker.setOpacity(0);
                exploreStampsLayer.addTo(map);
            } else {
                map.removeLayer(exploreStampsLayer);
                baseRouteLayer.addTo(map);
                activeRouteLayer.addTo(map);
                markersLayer.addTo(map);
                if (foxMarker) foxMarker.setOpacity(1);
            }
        }

        /* === 4. 初始化 Leaflet 地圖與專屬頭貼產生器 === */
        function initMap(daysData) {
            const firstCh = daysData?.[0]?.chapters?.[0];
            const startLat = firstCh?.lat || 35.6895;
            const startLng = firstCh?.lng || 139.6917;
            const startZoom = firstCh?.zoom || 7;

            map = L.map('map', { zoomControl: false }).setView([startLat, startLng], startZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            baseRouteLayer = L.layerGroup().addTo(map);
            activeRouteLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            exploreStampsLayer = L.layerGroup();
        }

        function buildAvatarInnerHTML(avatarVal) {
            if (isMediaFile(avatarVal)) {
                return `<img src="${normalizeMediaSrc(avatarVal)}" alt="旅人頭貼">`;
            }
            return avatarVal || '🦊';
        }

        /* === 5. 距離計算、交通方式判別與路線座標產生 === */
        function getDistanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function resolveTransportMode(currCh, distKm) {
            const raw = (currCh.transport || '').toString().trim().toLowerCase();
            const modeAliases = {
                flight: ['flight', 'airplane', 'plane', '飛機', '航班'],
                hsr: ['hsr', 'shinkansen', '高鐵', '新幹線'],
                train: ['train', 'jr', '火車', '台鐵'],
                metro: ['metro', 'mrt', 'subway', '捷運', '地鐵'],
                boat: ['boat', 'ferry', '遊船', '渡輪'],
                ropeway: ['ropeway', 'cable_car', '纜車'],
                walk: ['walk', 'foot', '步行', '散步'],
                drive: ['drive', 'car', '自駕', '計程車'],
                bus: ['bus', '巴士', '公車']
            };
            for (const [stdMode, aliases] of Object.entries(modeAliases)) {
                if (aliases.includes(raw)) return stdMode;
            }

            const text = `${currCh.title || ''} ${currCh.content || ''}`;
            if (distKm > 250 || /直飛|航班|班機|起飛|降落/.test(text)) return 'flight';
            if (/遊船|觀光船|渡輪|乘船/.test(text)) return 'boat';
            if (/纜車|山頂站/.test(currCh.title || '')) return 'ropeway';
            if (/新幹線|高鐵/.test(currCh.title || '')) return 'hsr';
            if (/JR|仙石線|奧羽本線|電鐵|Skyliner|火車|台鐵/i.test(currCh.title || '')) return 'train';
            if (/地鐵|捷運|Metro/i.test(currCh.title || '')) return 'metro';
            return distKm <= 3.5 ? 'walk' : 'bus';
        }

        function generateCurve(start, end, curvature = 0.15, segments = 32) {
            const [lat1, lng1] = start, [lat2, lng2] = end;
            const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
            const ctrlLat = midLat - (lng2 - lng1) * curvature;
            const ctrlLng = midLng + (lat2 - lat1) * curvature;

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) ** 2 * lat1 + 2 * (1 - t) * t * ctrlLat + t ** 2 * lat2;
                const lng = (1 - t) ** 2 * lng1 + 2 * (1 - t) * t * ctrlLng + t ** 2 * lng2;
                points.push([Number(lat.toFixed(5)), Number(lng.toFixed(5))]);
            }
            return points;
        }

        async function getDetailedPath(prevCh, currCh) {
            const cacheKey = `auto_v1_${prevCh.id}_to_${currCh.id}`;
            if (segmentCoordsCache[cacheKey]) return segmentCoordsCache[cacheKey];

            const start = [prevCh.lat, prevCh.lng];
            const end = [currCh.lat, currCh.lng];
            const distKm = getDistanceKm(prevCh.lat, prevCh.lng, currCh.lat, currCh.lng);
            const mode = resolveTransportMode(currCh, distKm);

            if (CURVE_MODES[mode] !== undefined || distKm > 250) {
                const curv = CURVE_MODES[mode] ?? 0.22;
                const arcCoords = generateCurve(start, end, curv, 36);
                segmentCoordsCache[cacheKey] = arcCoords;
                return arcCoords;
            }

            const saved = localStorage.getItem(cacheKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                segmentCoordsCache[cacheKey] = parsed;
                return parsed;
            }

            try {
                const profile = mode === 'walk' ? 'foot' : 'driving';
                const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${prevCh.lng},${prevCh.lat};${currCh.lng},${currCh.lat}?overview=full&geometries=geojson`;
                const res = await fetch(osrmUrl);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes?.length > 0) {
                    const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    segmentCoordsCache[cacheKey] = roadCoords;
                    try { localStorage.setItem(cacheKey, JSON.stringify(roadCoords)); } catch (e) {}
                    return roadCoords;
                }
            } catch (e) {}

            const fallbackCoords = generateCurve(start, end, 0.05, 24);
            segmentCoordsCache[cacheKey] = fallbackCoords;
            return fallbackCoords;
        }

        /* === 6. 繪製當前移動路線與旅人頭貼移動動畫 === */
        function drawActiveArrowRoute(coords) {
            activeRouteLayer.clearLayers();
            if (!coords || coords.length < 2) return;

            L.polyline(coords, {
                color: '#a6897c', weight: 3.5, opacity: 0.9, dashArray: '6, 8'
            }).addTo(activeRouteLayer);

            const arrowCount = Math.min(7, Math.max(2, Math.floor(coords.length / 6)));
            for (let k = 1; k <= arrowCount; k++) {
                const idx = Math.min(coords.length - 1, Math.floor((k / (arrowCount + 1)) * coords.length));
                const p1 = coords[idx - 1], p2 = coords[idx];
                if (!p1 || !p2) continue;

                const angleDeg = Math.atan2(p2[0] - p1[0], p2[1] - p1[1]) * (180 / Math.PI);
                const arrowIcon = L.divIcon({
                    className: 'route-arrow-icon',
                    html: `<div class="route-arrow-inner" style="transform: rotate(${-angleDeg}deg);">❯</div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });
                L.marker([(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2], {
                    icon: arrowIcon, interactive: false
                }).addTo(activeRouteLayer);
            }
        }

        function animateFoxAlongPath(coords, targetZoom) {
            if (foxAnimFrame) cancelAnimationFrame(foxAnimFrame);
            if (!coords || coords.length === 0) return;

            if (!foxMarker) {
                const foxIcon = L.divIcon({
                    className: 'fox-traveler-icon',
                    html: `<div class="fox-wrapper" id="fox-avatar">${buildAvatarInnerHTML(currentTripAvatar)}</div>`,
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                foxMarker = L.marker(coords[0], { icon: foxIcon, zIndexOffset: 2000 }).addTo(map);
            } else {
                foxMarker.setLatLng(coords[0]);
            }

            if (coords.length === 1) {
                map.flyTo(coords[0], targetZoom || 14, { animate: true, duration: 1.2 });
                return;
            }

            const cumDist = [0];
            let totalDist = 0;
            for (let i = 1; i < coords.length; i++) {
                totalDist += Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]);
                cumDist.push(totalDist);
            }

            if (totalDist === 0) {
                foxMarker.setLatLng(coords[coords.length - 1]);
                map.flyTo(coords[coords.length - 1], targetZoom || 14, { animate: true, duration: 1.0 });
                return;
            }

            map.flyToBounds(L.latLngBounds(coords), { padding: [70, 70], maxZoom: targetZoom || 15, animate: true, duration: 0.7 });

            const foxEl = document.getElementById('fox-avatar');
            if (foxEl) foxEl.classList.add('walking');

            const duration = 1900;
            const startTime = performance.now();

            function step(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                const targetD = eased * totalDist;

                let segIdx = 0;
                while (segIdx < cumDist.length - 2 && cumDist[segIdx + 1] < targetD) segIdx++;

                const segStartD = cumDist[segIdx];
                const segLen = cumDist[segIdx + 1] - segStartD;
                const ratio = segLen > 0 ? (targetD - segStartD) / segLen : 0;

                const p1 = coords[segIdx], p2 = coords[segIdx + 1];
                foxMarker.setLatLng([
                    p1[0] + (p2[0] - p1[0]) * ratio,
                    p1[1] + (p2[1] - p1[1]) * ratio
                ]);

                const avatar = document.getElementById('fox-avatar');
                if (avatar && Math.abs(p2[1] - p1[1]) > 0.00001) {
                    avatar.style.transform = `scaleX(${(p2[1] - p1[1]) < 0 ? 1 : -1})`;
                }

                if (progress < 1) {
                    foxAnimFrame = requestAnimationFrame(step);
                } else {
                    if (avatar) avatar.classList.remove('walking');
                    map.flyTo(coords[coords.length - 1], targetZoom || 15, { animate: true, duration: 0.9 });
                }
            }

            foxAnimFrame = requestAnimationFrame(step);
        }

        async function transitionToChapter(newIndex) {
            const targetCh = currentChaptersList[newIndex];
            if (!targetCh?.lat || !targetCh?.lng) return;

            if (newIndex !== currentActiveIndex && Math.abs(newIndex - currentActiveIndex) === 1) {
                const fromCh = currentChaptersList[currentActiveIndex];
                const isForward = newIndex > currentActiveIndex;
                const rawPath = await getDetailedPath(isForward ? fromCh : targetCh, isForward ? targetCh : fromCh);
                const moveCoords = isForward ? rawPath : [...rawPath].reverse();

                drawActiveArrowRoute(moveCoords);
                animateFoxAlongPath(moveCoords, targetCh.zoom || 14);
            } else {
                activeRouteLayer.clearLayers();
                if (newIndex > 0) {
                    const prevCh = currentChaptersList[newIndex - 1];
                    const pathCoords = await getDetailedPath(prevCh, targetCh);
                    drawActiveArrowRoute(pathCoords);
                }
                animateFoxAlongPath([[targetCh.lat, targetCh.lng]], targetCh.zoom || 14);
            }

            currentActiveIndex = newIndex;
        }

        /* === 7. 天數導覽列建立與切換 (Day Tabs) === */
        function buildDayTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            const tabs = [
                { key: 'ALL', label: '全部天數' },
                ...normalizedDays.map(d => ({ key: d.day, label: d.day }))
            ];

            tabs.forEach((tab, idx) => {
                const btn = document.createElement('button');
                btn.className = `day-tab ${idx === 0 ? 'active' : ''}`;
                btn.textContent = tab.label;
                btn.onclick = () => {
                    document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDayFilter = tab.key;
                    renderDay(tab.key);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                tabsContainer.appendChild(btn);
            });
        }

        /* === 8. 多媒體畫廊、預訂按鈕與燈箱功能 === */
        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            const clean = str.trim();
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|heic|mp4|mov|m4v|webm)$/i.test(clean) ||
                   clean.includes('media/') || clean.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|m4v|webm)$/i.test((str || '').trim());
        }

        function normalizeMediaSrc(rawSrc) {
            let s = (rawSrc || '').trim().replace(/^\/+/, '');
            if (!s) return '';
            if (!s.includes('/') && !s.startsWith('http')) {
                return `media/${tripId}/${s}`;
            }
            return s;
        }

        function buildMediaHTML(ch, chIndex) {
            const items = [];
            if (isMediaFile(ch.mediaPlaceholder)) {
                items.push({ src: normalizeMediaSrc(ch.mediaPlaceholder), caption: '' });
            }
            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const rawSrc = typeof item === 'string' ? item : (item?.src || item?.file || item?.url || '');
                    const caption = typeof item === 'object' && item?.caption ? item.caption : '';
                    if (isMediaFile(rawSrc)) {
                        items.push({ src: normalizeMediaSrc(rawSrc), caption });
                    }
                });
            }
            ch._mediaItems = items;

            if (items.length === 0) {
                return ch.mediaPlaceholder ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>` : '';
            }

            const layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length <= 4) layoutClass = `layout-auto-${items.length}`;
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map((item, itemIdx) => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata" onclick="openLightbox(${chIndex}, ${itemIdx})"></video>
                            <button type="button" class="replay-btn" onclick="event.stopPropagation(); replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>`;
                }
                return `
                    <div class="media-item">
                        <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox(${chIndex}, ${itemIdx})">
                        ${captionHTML}
                    </div>`;
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        function buildAffiliateHTML(ch) {
            const links = [];
            if (ch.affiliateUrl && ch.affiliateUrl.trim() !== '') {
                links.push({
                    text: (ch.affiliateText && ch.affiliateText.trim() !== '')
                        ? ch.affiliateText.trim()
                        : '🔗 查看同款行程與最新優惠',
                    url: ch.affiliateUrl.trim()
                });
            }
            if (Array.isArray(ch.affiliateLinks)) {
                ch.affiliateLinks.forEach(item => {
                    if (item && item.url && item.url.trim() !== '') {
                        links.push({
                            text: (item.text && item.text.trim() !== '')
                                ? item.text.trim()
                                : '🔗 查看同款行程與最新優惠',
                            url: item.url.trim()
                        });
                    }
                });
            }
            if (links.length === 0) return '';

            const buttonsHTML = links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener sponsored" class="affiliate-btn">
                    <span>${link.text}</span>
                    <span class="arrow-icon">↗</span>
                </a>
            `).join('');

            return `<div class="affiliate-container">${buttonsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) { video.currentTime = 0; video.play(); }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.45 });

            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        function openLightbox(chIndex, itemIdx = 0) {
            const ch = currentChaptersList[chIndex];
            if (!ch || !Array.isArray(ch._mediaItems) || ch._mediaItems.length === 0) return;
            lightboxItems = ch._mediaItems;
            lightboxIndex = itemIdx;
            updateLightboxContent();
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        function updateLightboxContent() {
            const item = lightboxItems[lightboxIndex];
            if (!item) return;

            const imgEl = document.getElementById('lightbox-img');
            const videoEl = document.getElementById('lightbox-video');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            const infoEl = document.getElementById('lightbox-info');

            const hasMultiple = lightboxItems.length > 1;
            prevBtn.style.display = hasMultiple ? 'flex' : 'none';
            nextBtn.style.display = hasMultiple ? 'flex' : 'none';

            const countText = `${lightboxIndex + 1} / ${lightboxItems.length}`;
            infoEl.textContent = item.caption ? `${countText} ｜ ${item.caption}` : countText;
            infoEl.style.display = (hasMultiple || item.caption) ? 'block' : 'none';

            if (isVideoFile(item.src)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = 'block';
                videoEl.src = item.src;
                videoEl.currentTime = 0;
                videoEl.play().catch(() => {});
            } else {
                videoEl.pause();
                videoEl.style.display = 'none';
                videoEl.src = '';
                imgEl.style.display = 'block';
                imgEl.src = item.src;
            }
        }

        function stepLightbox(dir) {
            if (lightboxItems.length <= 1) return;
            lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
            updateLightboxContent();
        }

        function handleOverlayClick() {
            if (justSwiped) return;
            closeLightbox();
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightbox-overlay');
            const videoEl = document.getElementById('lightbox-video');
            videoEl.pause();
            videoEl.src = '';
            overlay.style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('lightbox-overlay');
            if (!overlay || overlay.style.display !== 'flex') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepLightbox(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
            else if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
        });

        const lightboxOverlayEl = document.getElementById('lightbox-overlay');
        lightboxOverlayEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        lightboxOverlayEl.addEventListener('touchend', (e) => {
            if (lightboxItems.length <= 1 || e.changedTouches.length === 0) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
                justSwiped = true;
                setTimeout(() => { justSwiped = false; }, 300);
                if (dx < 0) stepLightbox(1);
                else stepLightbox(-1);
            }
        }, { passive: true });

        /* ==============================================================
           9. 輔助解析器：自動拆解「景點介紹」與「注意事項」、標準地區與官方時刻表
           ============================================================== */
        function stripHtmlText(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return (div.textContent || div.innerText || '').trim();
        }

        // 將章節內容智慧拆解為「📘 景點介紹 (introText)」與「⚠️ 注意事項 (noteText)」
        function extractIntroAndNote(ch) {
            let introText = (ch.intro || '').trim();
            let noteText = (ch.note || '').trim();

            if (!introText || !noteText) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = ch.content || '';

                // 抓取所有 callout-box 提示框作為「注意事項」
                const callouts = tempDiv.querySelectorAll('.callout-box');
                const extractedNotes = [];
                callouts.forEach(box => {
                    const titleEl = box.querySelector('.callout-title');
                    const titleStr = titleEl ? `【${titleEl.textContent.trim()}】` : '';
                    if (titleEl) titleEl.remove();
                    const iconEl = box.querySelector('.callout-icon');
                    if (iconEl) iconEl.remove();
                    const bodyStr = (box.textContent || '').trim().replace(/\s+/g, ' ');
                    if (titleStr || bodyStr) {
                        extractedNotes.push(`${titleStr}${bodyStr}`);
                    }
                    box.remove();
                });

                const mainParagraphText = (tempDiv.textContent || '').trim();
                if (!introText) introText = mainParagraphText || stripHtmlText(ch.content || '');
                if (!noteText && extractedNotes.length > 0) {
                    noteText = extractedNotes.join('\n\n');
                }
            }

            return { introText, noteText };
        }

        // 依經緯度與內容歸納「標準大地區名稱」（避免情報剪報下拉選單出現景點或車站名）
        function resolveStandardRegion(lat, lng, text = '') {
            if (lat < 26) return '台灣（出發地）';
            if (lat < 36.5 || /東京|成田|上野|谷中|日暮里|淺草|Skyliner/i.test(text)) return '東京・關東地區';
            if (/銀山|大石田|藏王溫泉|藏王纜車|山寺|立石寺|山形|音茶屋|五十番/i.test(text) || (lng < 140.55 && lat >= 37.8)) {
                return '山形地區';
            }
            if (/仙台|松島|狐狸村|瑞巖寺|円通院|五大堂|瑞鳳殿|大崎八幡宮|白石/i.test(text) || lat >= 37.8) {
                return '宮城・仙台地區';
            }
            if (lat >= 1 && lat <= 7) return '星馬地區';
            return '日本東北地區';
        }

        // 自動匹配各大交通工具的官方時刻表網址與對號座時間資訊
        function resolveTransitTimetableInfo(ch, mode, defaultTimeStr) {
            const title = ch.title || '';
            const content = stripHtmlText(ch.content || '');
            const full = `${title} ${content}`;

            let timeRange = ch.flightTime || ch.scheduleTime || defaultTimeStr;
            let seatType = ch.seatType || '';
            let timetableUrl = ch.timetableUrl || '';
            let timetableLabel = '查看官方時刻表';

            if (/小港機場|FD234|直飛成田/i.test(full)) {
                timeRange = ch.flightTime || '08:05 高雄起飛 ➔ 12:30 成田抵達 (AirAsia FD234)';
                seatType = '✈️ 國際航班（指定劃位）';
                timetableUrl = timetableUrl || 'https://www.kia.gov.tw/InstantScheduleC001110.aspx';
                timetableLabel = '小港機場航班時刻表';
            } else if (/Skyliner/i.test(full)) {
                timeRange = ch.scheduleTime || (/返回機場|賦歸/i.test(full) ? '10:00 京成上野發 ➔ 10:41 成田機場著' : '13:00 成田機場發 ➔ 13:41 京成上野著');
                seatType = '💺 全車對號指定席 (Skyliner)';
                timetableUrl = timetableUrl || 'https://www.keisei.co.jp/keisei/tetudou/skyliner/tc/traffic/skyliner.php';
                timetableLabel = '京成 Skyliner 官方時刻表';
            } else if (/新幹線|翼號|Tsubasa/i.test(full)) {
                timeRange = ch.scheduleTime || '16:06 上野發 ➔ 18:43 山形著 (山形新幹線 翼號)';
                seatType = '💺 對號指定席 (JR 新幹線)';
                timetableUrl = timetableUrl || 'https://www.jreast-timetable.jp/';
                timetableLabel = 'JR 東日本新幹線時刻表';
            } else if (/山交巴士|藏王纜車/i.test(full)) {
