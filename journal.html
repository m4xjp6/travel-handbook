                timeRange = ch.scheduleTime || '07:40 山形站前1號月台發 ➔ 08:25 藏王溫泉著';
                seatType = '🚌 路線巴士（排隊依序入座）';
                timetableUrl = timetableUrl || 'https://www.yamakobus.jp/busroute/regular/zao-onsen/';
                timetableLabel = '山交巴士（山形—藏王）時刻表';
            } else if (/大石田|銀山溫泉/i.test(full)) {
                timeRange = ch.scheduleTime || '09:18 山形發 (JR奧羽本線) ➔ 大石田轉乘銀山接駁巴士';
                seatType = '🚃 JR 自由席 ＋ 溫泉接駁巴士';
                timetableUrl = timetableUrl || 'https://www.hanagasa-bus-taisei.co.jp/base.html';
                timetableLabel = '銀山溫泉花笠巴士時刻表';
            } else if (/仙石線|松島/i.test(full)) {
                timeRange = ch.scheduleTime || '08:30 JR 仙台站發 ➔ 09:10 松島海岸站著';
                seatType = '🚃 JR 仙石線（區間自由席）';
                timetableUrl = timetableUrl || 'https://www.jreast-timetable.jp/';
                timetableLabel = 'JR 仙石線官方時刻表';
            } else if (/遊船/i.test(full)) {
                timeRange = ch.scheduleTime || '10:00 松島灣仁王丸號出航（航程約 50 分鐘）';
                seatType = '⛴️ 觀光船班（定時出航）';
                timetableUrl = timetableUrl || 'https://www.matsushima.or.jp/cruise/timetable/';
                timetableLabel = '松島島巡り觀光船時刻表';
            } else if (/成田機場.*中華料理|賦歸|回程/i.test(full) && mode === 'flight') {
                timeRange = ch.flightTime || '13:35 東京成田起飛 ➔ 17:10 高雄小港抵達';
                seatType = '✈️ 國際航班（指定劃位）';
                timetableUrl = timetableUrl || 'https://www.narita-airport.jp/ch2/flight/flight-search/';
                timetableLabel = '成田機場航班時刻表';
            } else {
                seatType = (mode === 'hsr' || mode === 'flight') ? '💺 對號指定席' : '🚌 依班次運行';
                timetableUrl = timetableUrl || 'https://www.jreast-timetable.jp/';
                timetableLabel = '查看路線時刻表';
            }

            return { timeRange, seatType, timetableUrl, timetableLabel };
        }

        function classifyChapterMeta(ch, idxInDay, prevCh) {
            const title = ch.title || '';
            const { introText, noteText } = extractIntroAndNote(ch);

            let stampChar = '景';
            let stampClass = 'spot';
            let categoryLabel = ch.categoryLabel || '經典必訪';

            if (/飯店|住宿|御宿野乃|Hotel|泡湯/i.test(title) && !/五十番/.test(title)) {
                stampChar = '住';
                stampClass = 'hotel';
                categoryLabel = ch.categoryLabel || '溫泉住宿';
            } else if (/午餐|晚餐|料理|牛たん|牛舌|燒肉|真都|平田牧場|五十番|伊豆の華|音茶屋|カフェ|咖啡|甜點/i.test(title)) {
                stampChar = '食';
                stampClass = 'food';
                categoryLabel = ch.categoryLabel || '在地美饌';
            } else if (/機場|新幹線|車站|轉乘|啟程|賦歸|Skyliner/i.test(title)) {
                stampChar = '驛';
                stampClass = 'transit';
                categoryLabel = ch.categoryLabel || '交通樞紐';
            } else if (/神社|八幡宮|山寺|立石寺|瑞巖寺|円通院|五大堂|瑞鳳殿/i.test(title)) {
                categoryLabel = ch.categoryLabel || '歷史古剎';
            } else if (/樹冰|藏王|銀山|松島|狐狸村|鐵塔|展望台/i.test(title)) {
                categoryLabel = ch.categoryLabel || '名勝絕景';
            }

            const defaultHours = ['09:00', '11:00', '12:30', '14:30', '16:30', '18:30', '20:30'];
            const timeStr = ch.time || defaultHours[Math.min(idxInDay, defaultHours.length - 1)];

            let transitInfo = null;
            if (prevCh && prevCh.lat && prevCh.lng && ch.lat && ch.lng) {
                const distKm = getDistanceKm(prevCh.lat, prevCh.lng, ch.lat, ch.lng);
                const mode = resolveTransportMode(ch, distKm);
                const modeMap = {
                    flight: { icon: '✈️', name: '國際航班', mins: 210, cost: 8500 },
                    hsr:    { icon: '🚄', name: 'JR 新幹線', mins: Math.max(45, Math.round(distKm * 0.45)), cost: Math.round(distKm * 32) },
                    train:  { icon: '🚃', name: 'JR／特急電車', mins: Math.max(20, Math.round(distKm * 1.1)), cost: Math.max(240, Math.round(distKm * 22)) },
                    metro:  { icon: '🚇', name: '地鐵移動', mins: 18, cost: 210 },
                    ropeway:{ icon: '🚡', name: '山岳纜車', mins: 20, cost: 3800 },
                    boat:   { icon: '⛴️', name: '觀光遊船', mins: 50, cost: 1500 },
                    bus:    { icon: '🚌', name: '路線巴士／接駁', mins: Math.max(20, Math.round(distKm * 1.6)), cost: Math.max(500, Math.round(distKm * 45)) },
                    drive:  { icon: '🚕', name: '計程車／專車', mins: Math.max(15, Math.round(distKm * 1.3)), cost: Math.max(1200, Math.round(distKm * 300)) },
                    walk:   { icon: '🚶', name: '漫步前往', mins: Math.max(6, Math.round(distKm * 12)), cost: 0 }
                };
                const picked = modeMap[mode] || modeMap.bus;
                const prevClean = (prevCh.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                const currClean = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                const ttInfo = resolveTransitTimetableInfo(ch, mode, timeStr);

                transitInfo = {
                    mode,
                    icon: picked.icon,
                    modeName: picked.name,
                    routeText: `${prevClean.slice(0, 9)} → ${currClean.slice(0, 9)}`,
                    mins: ch.transitMins !== undefined ? Number(ch.transitMins) : picked.mins,
                    cost: ch.transitCost !== undefined ? Number(ch.transitCost) : picked.cost,
                    ...ttInfo
                };
            }

            return { stampChar, stampClass, categoryLabel, timeStr, transitInfo, introText, noteText };
        }

        /* === 10. 渲染日記內容、行程手風琴卡（分離介紹與注意事項）與地圖節點 === */
        function setActiveChapter(activeSection, activeMarker) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            if (activeSection) activeSection.classList.add('active');

            document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('active'));
            const marker = activeMarker || chapterMarkers.get(activeSection);
            if (marker?.getElement()) {
                marker.getElement().classList.add('active');
            }
        }

        function jumpToJournalChapter(chIndex, sectionId) {
            switchRightView('view-journal');
            setTimeout(() => {
                const sec = document.getElementById(sectionId);
                if (sec) {
                    setActiveChapter(sec);
                    transitionToChapter(chIndex);
                    const topNav = document.querySelector('.top-nav');
                    const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                    const targetY = window.pageYOffset + sec.getBoundingClientRect().top - navBottom - 20;
                    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                }
            }, 80);
        }

        function focusSpotOnMap(chIndex) {
            transitionToChapter(chIndex);
        }

        function renderDay(dayKey) {
            const contentDiv = document.getElementById('content');
            const itinDiv = document.getElementById('itinerary-content');
            contentDiv.innerHTML = '';
            itinDiv.innerHTML = '';
            if (observer) observer.disconnect();

            markersLayer.clearLayers();
            baseRouteLayer.clearLayers();
            activeRouteLayer.clearLayers();
            exploreStampsLayer.clearLayers();
            chapterMarkers.clear();

            const dotIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            currentChaptersList = [];
            currentActiveIndex = 0;
            const simpleLatLngs = [];
            let spotCount = 0;
            let hotelCount = 0;

            const daysToRender = dayKey === 'ALL'
                ? normalizedDays
                : normalizedDays.filter(d => d.day === dayKey);

            daysToRender.forEach(dayObj => {
                const banner = document.createElement('div');
                banner.className = 'day-banner';
                const fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';
                banner.innerHTML = `
                    <div class="day-banner-header">
                        <div class="day-badge">${dayObj.day}</div>
                        ${fieldTestBadgeHTML}
                    </div>
                    <h1>${dayObj.dayTitle || dayObj.day}</h1>
                `;
                contentDiv.appendChild(banner);

                let dayTotalTransitMins = 0;
                let dayTotalTransitCost = 0;
                const dayItinCardsHTML = [];
                const cleanSpotNames = [];

                (dayObj.chapters || []).forEach((ch, idxInDay) => {
                    const chIndex = currentChaptersList.length;
                    currentChaptersList.push(ch);

                    const prevCh = idxInDay > 0 ? dayObj.chapters[idxInDay - 1] : null;
                    const meta = classifyChapterMeta(ch, idxInDay, prevCh);

                    if (meta.stampChar === '住') hotelCount++;
                    else spotCount++;

                    const cleanTitle = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                    cleanSpotNames.push(cleanTitle);

                    // 1. 建立圖文遊記章節卡片
                    const section = document.createElement('section');
                    section.className = `chapter ${chIndex === 0 ? 'active' : ''}`;
                    section.id = `section-${ch.id}`;
                    section.setAttribute('data-index', chIndex);
                    section.innerHTML = `
                        <h2>${ch.title}</h2>
                        ${buildMediaHTML(ch, chIndex)}
                        <div class="chapter-body">${ch.content || ''}</div>
                        ${buildAffiliateHTML(ch)}
                    `;
                    contentDiv.appendChild(section);

                    // 2. 累積交通時間與花費
                    if (meta.transitInfo && meta.transitInfo.mins < 180) {
                        dayTotalTransitMins += meta.transitInfo.mins;
                        dayTotalTransitCost += meta.transitInfo.cost;
                        dayItinCardsHTML.push(`
                            <div class="itin-transit-row">
                                <div class="itin-transit-left">
                                    <span class="itin-transit-icon">${meta.transitInfo.icon}</span>
                                    <span>${meta.transitInfo.modeName}｜${meta.transitInfo.routeText}</span>
                                </div>
                                <div class="itin-transit-right">
                                    ${meta.transitInfo.mins} 分 &nbsp; ¥${meta.transitInfo.cost.toLocaleString()}
                                </div>
                            </div>
                        `);
                    }

                    const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanTitle)}&query_place_id=${ch.lat},${ch.lng}`;
                    const isFirstOpen = idxInDay === 0 ? 'open' : '';

                    // 分離顯示「📘 景點介紹」與「⚠️ 注意事項＆攻略備註」
                    const introBlockHTML = meta.introText ? `
                        <div class="spot-sub-block intro-block">
                            <div class="spot-sub-title">📘 景點介紹</div>
                            <p class="spot-sub-text">${meta.introText}</p>
                        </div>
                    ` : '';

                    const noteBlockHTML = meta.noteText ? `
                        <div class="spot-sub-block note-block">
                            <div class="spot-sub-title">⚠️ 注意事項＆攻略備註</div>
                            <p class="spot-sub-text">${meta.noteText}</p>
                        </div>
                    ` : '';

                    dayItinCardsHTML.push(`
                        <div class="spot-intro-card ${isFirstOpen}" id="itin-card-${ch.id}">
                            <div class="spot-card-header" onclick="this.parentElement.classList.toggle('open'); focusSpotOnMap(${chIndex});">
                                <div class="spot-header-left">
                                    <span class="spot-time-box">${meta.timeStr}</span>
                                    <span class="spot-cat-pill">${meta.categoryLabel}</span>
                                    <span class="spot-title-text">${cleanTitle}</span>
                                </div>
                                <span class="spot-toggle-arrow">▶</span>
                            </div>
                            <div class="spot-card-body">
                                ${introBlockHTML}
                                ${noteBlockHTML}
                                <div class="spot-action-pills">
                                    <a href="${gmapUrl}" target="_blank" rel="noopener" class="spot-pill-btn">🗺️ Google 地圖導航</a>
                                    <button type="button" class="spot-pill-btn loc" onclick="focusSpotOnMap(${chIndex})">📍 定位至左側地圖</button>
                                    <button type="button" class="spot-pill-btn loc" onclick="jumpToJournalChapter(${chIndex}, 'section-${ch.id}')">📖 閱讀實拍遊記與照片</button>
                                </div>
                                ${buildAffiliateHTML(ch)}
                            </div>
                        </div>
                    `);

                    // 3. 建立地圖圓點標記與尋訪印章標記
                    if (ch.lat && ch.lng) {
                        simpleLatLngs.push([ch.lat, ch.lng]);
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);

                        marker.bindTooltip(`${dayObj.day}｜${ch.title}`, {
                            direction: 'top',
                            offset: [0, -10],
                            className: 'marker-tooltip'
                        });

                        marker.on('click', () => {
                            isClickScrolling = true;
                            clearTimeout(scrollUnlockTimer);
                            setActiveChapter(section, marker);
                            transitionToChapter(chIndex);

                            const journalView = document.getElementById('view-journal');
                            if (journalView.classList.contains('active')) {
                                const topNav = document.querySelector('.top-nav');
                                const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                                const targetY = window.pageYOffset + section.getBoundingClientRect().top - navBottom - 20;
                                window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                            } else {
                                const itinCard = document.getElementById(`itin-card-${ch.id}`);
                                if (itinCard) {
                                    itinCard.classList.add('open');
                                    itinCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }
                            scrollUnlockTimer = setTimeout(() => { isClickScrolling = false; }, 950);
                        });

                        chapterMarkers.set(section, marker);

                        const stampIcon = L.divIcon({
                            className: 'stamp-marker',
                            html: `<div class="stamp-box ${meta.stampClass}">${meta.stampChar}</div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        });
                        const stampMarker = L.marker([ch.lat, ch.lng], { icon: stampIcon }).addTo(exploreStampsLayer);
                        stampMarker.bindTooltip(`[${meta.stampChar}] ${cleanTitle}`, {
                            direction: 'top',
                            offset: [0, -12],
                            className: 'marker-tooltip'
                        });
                        stampMarker.on('click', () => marker.fire('click'));
                    }
                });

                const hours = Math.floor(dayTotalTransitMins / 60);
                const mins = dayTotalTransitMins % 60;
                const timeSumStr = hours > 0 ? `${hours} 時 ${mins} 分` : `${mins} 分`;

                const dayItinBlock = document.createElement('div');
                dayItinBlock.className = 'itinerary-day-block';
                dayItinBlock.innerHTML = `
                    <div class="itin-day-header">
                        <h3 class="itin-day-title">${dayObj.day}｜${dayObj.dayTitle || ''}</h3>
                        <div class="itin-day-sub">
                            <span>📅 ${ cleanSpotNames.slice(0, 4).join(' · ') }</span>
                        </div>
                    </div>
                    <div class="itin-summary-box">
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">當日區域移動時間</div>
                            <div class="itin-sum-val">${timeSumStr}</div>
                        </div>
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">預估區域交通花費</div>
                            <div class="itin-sum-val cost">¥${dayTotalTransitCost.toLocaleString()}</div>
                        </div>
                    </div>
                    ${dayItinCardsHTML.join('')}
                `;
                itinDiv.appendChild(dayItinBlock);
            });

            document.getElementById('map-stats-pill').textContent = `${daysToRender.length} 日行跡・${spotCount} 處尋訪・${hotelCount} 晚住宿`;

            if (simpleLatLngs.length > 1) {
                L.polyline(simpleLatLngs, {
                    color: '#C4A99E', weight: 2, opacity: 0.45, dashArray: '5, 10'
                }).addTo(baseRouteLayer);
            }

            if (currentChaptersList.length > 0) {
                setActiveChapter(document.querySelector('.chapter'));
                transitionToChapter(0);
            }

            observer = new IntersectionObserver((entries) => {
                if (isClickScrolling) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chapter = entry.target;
                        const newIdx = parseInt(chapter.getAttribute('data-index'), 10);
                        setActiveChapter(chapter);
                        if (!isNaN(newIdx)) transitionToChapter(newIdx);
                    }
                });
            }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });

            document.querySelectorAll('.chapter').forEach(chapter => observer.observe(chapter));
            initVideoAutoplay();
        }

        /* ==============================================================
           11. 📡 資訊情報引擎 (結束自動凍結、Weather/Windy直連、累積去重緊急快訊)
           ============================================================== */
        function isTripAlreadyEnded() {
            if (!currentTripEndDate) return false;
            const end = new Date(`${currentTripEndDate}T23:59:59`);
            return new Date() > end;
        }

        async function refreshInfoStation(isManualClick = false) {
            const ended = isTripAlreadyEnded();
            const refreshBtn = document.getElementById('btn-refresh-info');
            const liveDot = document.getElementById('info-live-dot');
            const connLabel = document.getElementById('info-conn-label');
            const updateTimeEl = document.getElementById('info-update-time');
            const archiveBadge = document.getElementById('clip-archive-badge');

            document.getElementById('info-trip-code').textContent = `${tripId.toUpperCase()} ・ 旅の速報`;
            document.getElementById('info-station-title').textContent = `${(rawTripData.tripTitle || '旅途').split('｜').pop().trim()}情報手帳`;

            // 若已過旅程結束日期：按鈕顯示「旅程已結束」並鎖定不再更新
            if (ended) {
                liveDot.classList.add('ended');
                connLabel.textContent = '歷史封存';
                updateTimeEl.textContent = `本趟旅程已於 ${currentTripEndDate} 結束（停止即時更新）`;
                refreshBtn.textContent = '🏁 旅程已結束';
                refreshBtn.disabled = true;
                if (archiveBadge) archiveBadge.textContent = `🔒 已於 ${currentTripEndDate} 封存，停止新增剪報`;
            } else {
                liveDot.classList.remove('ended');
                connLabel.textContent = '即時連線';
                refreshBtn.disabled = false;
                if (refreshBtn && isManualClick) refreshBtn.textContent = '↻ 連線更新中...';
                const now = new Date();
                const timeStr = new Intl.DateTimeFormat('zh-TW', {
                    timeZone: 'Asia/Tokyo',
                    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
                }).format(now);
                updateTimeEl.textContent = `更新：日本時間 ${timeStr}`;
                if (archiveBadge) archiveBadge.textContent = `🟢 旅途累積模式（自動過濾重複快訊）`;
            }

            // 取得每一天在日本目的地的代表座標與標準地區名稱
            const dayRepresentativeCoords = normalizedDays.map((d, idx) => {
                const validChs = (d.chapters || []).filter(c => c.lat && c.lng && c.lat > 26);
                const picked = validChs[Math.floor(validChs.length / 2)] || d.chapters?.[0] || { lat: 38.2682, lng: 140.8694, title: d.day };
                const stdRegion = resolveStandardRegion(picked.lat, picked.lng, `${d.dayTitle} ${picked.title}`);
                const shortArea = stdRegion.replace('地區', '');
                return {
                    dayKey: d.day,
                    dayCode: `D${String(idx + 1).padStart(2, '0')}`,
                    dayTitle: d.dayTitle || d.day,
                    stdRegion: stdRegion,
                    locName: shortArea,
                    lat: Number(picked.lat).toFixed(3),
                    lng: Number(picked.lng).toFixed(3)
                };
            });

            // 抓取氣象數據供雷達格顯示
            await Promise.all(dayRepresentativeCoords.map(async (item) => {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lng}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
                    const res = await fetch(url);
                    const wData = await res.json();
                    if (wData && wData.current) {
                        const maxT = Math.round(wData.daily?.temperature_2m_max?.[0] ?? wData.current.temperature_2m);
                        const minT = Math.round(wData.daily?.temperature_2m_min?.[0] ?? wData.current.temperature_2m - 4);
                        const rainProb = wData.daily?.precipitation_probability_max?.[0] ?? 10;
                        const wind = Math.round(wData.current.wind_speed_10m || 8);
                        liveWeatherByDay[item.dayCode] = { ...item, maxT, minT, rainProb, wind };
                    }
                } catch (e) {
                    liveWeatherByDay[item.dayCode] = { ...item, maxT: 8, minT: 0, rainProb: 20, wind: 12 };
                }
            }));

            // 1. 渲染「30 秒情報速讀」
            const d1W = liveWeatherByDay['D01'] || { locName: '山形', maxT: 6, minT: -2, rainProb: 20, wind: 12 };
            const d2W = liveWeatherByDay['D02'] || { locName: '藏王', maxT: -3, minT: -9, rainProb: 30, wind: 25 };
            document.getElementById('info-quick-five').innerHTML = `
                <li><span>🚨</span><div><strong>【JR 東日本運行快訊】</strong>東北・山形新幹線「翼號」遇強風或大雪時可能於福島—山形區間實施減速運轉，搭車前請留意站內電子告示。</div></li>
                <li><span>🚡</span><div><strong>【${d2W.locName}山岳風速與纜車預警】</strong>氣溫 ${d2W.maxT}~${d2W.minT}°C，風速 ${d2W.wind} km/h（藏王纜車當風速超過 15m/s 將暫停運行）。</div></li>
                <li><span>🚌</span><div><strong>【山交巴士現場票務通報】</strong>冬季「藏王樹冰套票」窗口若因天候停售，可直接排隊刷 Suica 上車並於山麓站購買纜車票。</div></li>
                <li><span>⚠️</span><div><strong>【銀山溫泉冬季交通管制】</strong>銀山溫泉每日 16:00 後實施冬季入場與末班接駁巴士總量管制，一日遊旅客請留意下山末班車時間。</div></li>
                <li><span>❄️</span><div><strong>【日本氣象廳路面結冰提醒】</strong>山寺石階與藏王溫泉街早晚路面結冰（ブラックアイスバーン），步行務必穿戴簡易冰爪。</div></li>
            `;

            // 2. 渲染「每日行程天氣與風速影響雷達」（點擊直連 The Weather Channel 與 Windy）
            const radarGrid = document.getElementById('info-radar-grid');
            radarGrid.innerHTML = dayRepresentativeCoords.map(item => {
                const w = liveWeatherByDay[item.dayCode] || { maxT: 6, minT: 0, rainProb: 20, wind: 10 };
                const isWarn = w.wind >= 20 || w.rainProb >= 60 || w.minT <= -3;
                const statusText = isWarn
                    ? `⚠️ ${w.maxT}~${w.minT}°C｜風速 ${w.wind}km/h`
                    : `☀️ ${w.maxT}~${w.minT}°C｜風速 ${w.wind}km/h`;

                // 真實外部氣象網址 (The Weather Channel 座標預報 & Windy 座標風速雷達)
                const weatherChannelUrl = `https://weather.com/zh-TW/weather/today/l/${item.lat},${item.lng}`;
                const windyUrl = `https://www.windy.com/${item.lat}/${item.lng}?wind,${item.lat},${item.lng},11`;

                return `
                    <div class="radar-cell ${isWarn ? 'warn' : ''}">
                        <a href="${weatherChannelUrl}" target="_blank" rel="noopener" class="radar-main-link" title="點擊開啟 The Weather Channel 預報">
                            <div class="radar-day-num">${item.dayCode}・${item.locName}</div>
                            <div class="radar-day-status">${statusText}</div>
                        </a>
                        <div class="radar-ext-links">
                            <a href="${weatherChannelUrl}" target="_blank" rel="noopener" class="radar-ext-a">🌤️ Weather</a>
                            <a href="${windyUrl}" target="_blank" rel="noopener" class="radar-ext-a">🌬️ Windy</a>
                        </div>
                    </div>
                `;
            }).join('');

            // 3. 處理「緊急快訊與情報剪報」（累積去重制 ＋ 結束後停止新增）
            await updateAndRenderCumulativeClippings(dayRepresentativeCoords, ended);

            if (refreshBtn && isManualClick && !ended) {
                refreshBtn.textContent = '✔ 已更新最新情報';
                setTimeout(() => { refreshBtn.textContent = '↻ 重新整理'; }, 1800);
            }
        }

        // 累積式情報剪報引擎：過濾重複、儲存於 localStorage，若旅程已結束則不再新增
        async function updateAndRenderCumulativeClippings(dayCoords, isEnded) {
            const storageKey = `flaneur_clippings_archive_v2_${tripId}`;
            let savedArchive = [];
            try {
                const raw = localStorage.getItem(storageKey);
                if (raw) savedArchive = JSON.parse(raw);
            } catch (e) {}

            // 預設緊急新聞與交通防災快訊基底（確保剪報內容皆為緊急需要注意的新聞／交通／防災快訊）
            const baselineUrgentNews = [
                {
                    id: 'news-jr-tsubasa',
                    category: '交通',
                    region: '山形地區',
                    urgent: true,
                    tag: 'JR 東日本運行快訊',
                    title: '【運行情報】山形新幹線「翼號 (Tsubasa)」冬季風雪區間運轉提醒',
                    desc: '受奧羽山脈強風與降雪影響，福島至山形、新庄區間偶有短暫延誤或列車解聯作業調整，轉乘預留時間建議至少 25 分鐘以上。'
                },
                {
                    id: 'news-zao-ropeway',
                    category: '天氣',
                    region: '山形地區',
                    urgent: true,
                    tag: '山岳索道緊急快訊',
                    title: '【氣象警報】藏王纜車（山麓線・山頂線）強風與濃霧運行基準通報',
                    desc: '藏王地藏山頂站海拔達 1,661 公尺，當瞬間風速達 15m/s 以上時纜車將實施減速或臨時停駛，上山前請務必確認山麓站即時廣播。'
                },
                {
                    id: 'news-ginzan-entry',
                    category: '防災',
                    region: '山形地區',
                    urgent: true,
                    tag: '地方觀光局公告',
                    title: '【管制快訊】銀山溫泉冬季傍晚入場總量管制與大正浪漫接駁巴士末班車提醒',
                    desc: '為維護冬季積雪安全與防止道路雍塞，銀山溫泉街於冬季點燈時段實施非住客交通管制，自大石田站轉乘之旅客請嚴格留意回程末班車時刻。'
                },
                {
                    id: 'news-sendai-sengoku',
                    category: '交通',
                    region: '宮城・仙台地區',
                    urgent: false,
                    tag: 'JR 仙石線速報',
                    title: '【鐵道快訊】JR 仙石線（仙台—松島海岸）強風區間與班次接續提醒',
                    desc: '仙石線沿松島灣海岸行駛，冬季海風強勁時列車可能微幅誤點；前往松島遊船碼頭請使用松島海岸站檢票口。'
                },
                {
                    id: 'news-fox-village',
                    category: '防災',
                    region: '宮城・仙台地區',
                    urgent: true,
                    tag: '園區安全快訊',
                    title: '【園區快訊】宮城藏王狐狸村冬季閉園時間提早（16:00）與園內安全須知',
                    desc: '冬季日落提早，園區最終入場時間為 15:30；若遇暴風雪天氣，抱狐狸體驗可能臨時取消，且園內禁止穿戴垂墜吊飾或塑膠袋以免狐狸誤咬。'
                },
                {
                    id: 'news-keisei-skyliner',
                    category: '快訊',
                    region: '東京・關東地區',
                    urgent: false,
                    tag: '京成電鐵旅客快訊',
                    title: '【乘車快訊】成田機場 Skyliner 電子憑證兌換與月台乘車動線提醒',
                    desc: '持網購 QR Code 旅客須先至成田機場 B1 售票機或 Skyliner 服務櫃檯兌換實體指定席車票，切勿直接持憑證進站。'
                }
            ];

            // 若歷史庫為空，先寫入基準緊急快訊
            if (savedArchive.length === 0) {
                savedArchive = [...baselineUrgentNews];
            }

            // 只有在「旅程尚未結束」時，才允許繼續新增即時氣象警報與最新新聞快訊（且自動去重）
            if (!isEnded) {
                const existingIds = new Set(savedArchive.map(item => item.id));

                // 檢查當下是否有強風、低溫或高降雨機率，若有則產生新的氣象警報快訊（相同 ID 不重複加）
                dayCoords.forEach(item => {
                    const w = liveWeatherByDay[item.dayCode];
                    if (!w) return;
                    const alertId = `weather-alert-${item.stdRegion}-${w.maxT}-${w.minT}`;
                    if (!existingIds.has(alertId)) {
                        const isSevere = w.wind >= 18 || w.rainProb >= 60 || w.minT <= 0;
                        savedArchive.unshift({
                            id: alertId,
                            category: '天氣',
                            region: item.stdRegion,
                            urgent: isSevere,
                            tag: `${item.dayCode} 即時氣象快訊`,
                            title: `【${item.stdRegion}氣象速報】今日氣溫 ${w.maxT}~${w.minT}°C・降雨/雪機率 ${w.rainProb}%・最大風速 ${w.wind} km/h`,
                            desc: isSevere
                                ? `⚠️ 監測到低溫或較強陣風，前往戶外景區與搭乘跨區鐵道請留意最新運行狀態。`
                                : `目前 ${item.stdRegion} 氣候穩定，適合按原訂計畫展開戶外行程。`
                        });
                        existingIds.add(alertId);
                    }
                });

                try {
                    localStorage.setItem(storageKey, JSON.stringify(savedArchive.slice(0, 30)));
                } catch (e) {}
            }

            allInfoClippings = savedArchive;

            // 建立「地區下拉選單」：只顯示標準大地區名稱（絕不顯示景點或巴士站名！）
            const standardRegions = ['山形地區', '宮城・仙台地區', '東京・關東地區'];
            const regSelect = document.getElementById('clip-region-select');
            regSelect.innerHTML = `<option value="ALL">全部地區</option>` +
                standardRegions.map(r => `<option value="${r}">${r}</option>`).join('');

            filterInfoClippings();
        }

        function filterInfoClippings() {
            const reg = document.getElementById('clip-region-select').value;
            const kw = (document.getElementById('clip-search-input').value || '').trim().toLowerCase();

            const filtered = allInfoClippings.filter(item => {
                const matchCat = currentClipCategory === 'ALL' || item.category === currentClipCategory;
                const matchReg = reg === 'ALL' || item.region === reg;
                const matchKw = !kw || item.title.toLowerCase().includes(kw) || item.desc.toLowerCase().includes(kw);
                return matchCat && matchReg && matchKw;
            });

            const listEl = document.getElementById('info-clippings-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 24px; color:#718096; font-size:0.88rem;">目前沒有符合篩選條件的快訊剪報</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="clip-item ${item.urgent ? 'urgent' : ''}">
                    <div class="clip-item-top">
                        <span>
                            ${item.urgent ? '<span class="clip-urgent-badge">🚨 緊急注意</span> ' : ''}
                            📌 分類：${item.category} ｜ 地區：<strong>${item.region}</strong>
                        </span>
                        <span>${item.tag}</span>
                    </div>
                    <div class="clip-item-title">${item.title}</div>
                    <div class="clip-item-desc">${item.desc}</div>
                </div>
            `).join('');
        }

        document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentClipCategory = btn.getAttribute('data-cat');
                filterInfoClippings();
            });
        });

        /* ==============================================================
           12. 🎫 票券蒐集引擎 (可收合手風琴、同名連續住宿智慧合併、擬真憑證、時刻表連結)
           ============================================================== */
        // 標準化飯店名稱（讓「仙台御宿野乃溫泉與宵夜拉麵」與「仙台御宿野乃溫泉飯店泡湯」自動識別為同一家飯店！）
        function normalizeHotelKey(rawTitle, rawContent = '') {
            const combined = `${rawTitle} ${rawContent}`;
            if (/御宿野乃|Onyado Nono/i.test(combined)) {
                return {
                    key: 'ONYADO_NONO_SENDAI',
                    officialName: '仙台御宿野乃天然溫泉飯店 (Onyado Nono Sendai)',
                    address: '宮城縣仙台市青葉區本町 2-2-5（廣瀨通站東2出口步行 1 分鐘）',
                    roomType: '禁菸雙人房（全館榻榻米鋪設）',
                    mealPlan: '含豐盛海鮮日式早餐 ＋ 免費宵夜醬油拉麵 ＆ 頂樓天然溫泉大浴場',
                    defaultBookingId: 'NONO-SD-202601'
                };
            }
            if (/山形大都會|Metropolitan Yamagata/i.test(combined)) {
                return {
                    key: 'METROPOLITAN_YAMAGATA',
                    officialName: '山形大都會飯店 (Hotel Metropolitan Yamagata)',
                    address: '山形縣山形市香澄町 1-1-1（JR 山形站東口直結・步行 0 分鐘）',
                    roomType: '本館舒適雙人房 (Standard Double)',
                    mealPlan: '車站直結免吹風淋雪・鄰近山形五十番中華料理',
                    defaultBookingId: 'METRO-YM-202601'
                };
            }
            const clean = rawTitle.replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '').trim();
            return {
                key: clean.slice(0, 6),
                officialName: clean,
                address: '詳見 Google 地圖定位',
                roomType: '標準客房',
                mealPlan: '依訂單方案為準',
                defaultBookingId: `HTL-${Math.floor(100000 + Math.random() * 900000)}`
            };
        }

        function toggleAllTicketsInPanel(panelId, expand) {
            const container = document.getElementById(panelId);
            if (!container) return;
            container.querySelectorAll('.collapsible-ticket-card').forEach(card => {
                card.classList.toggle('open', expand);
            });
        }

        function renderPackAndBudgetViews() {
            const transportTickets = [];
            const rawHotelEntries = [];
            const transits = [];
            const foods = [];
            let totalSpotCount = 0;

            // 1. 若 JSON 後台有手動設定 hotelVouchers，優先載入並支援同名連續住宿合併
            if (Array.isArray(rawTripData.hotelVouchers) && rawTripData.hotelVouchers.length > 0) {
                rawTripData.hotelVouchers.forEach((hv, idx) => {
                    const norm = normalizeHotelKey(hv.hotelName || '');
                    rawHotelEntries.push({
                        key: norm.key,
                        officialName: hv.hotelName || norm.officialName,
                        dayStart: hv.checkIn || `訂單 ${idx + 1}`,
                        dayEnd: hv.checkOut || '',
                        dayIndex: idx + 1,
                        nights: Number(hv.nights) || 1,
                        bookingId: hv.bookingId || norm.defaultBookingId,
                        roomType: hv.roomType || norm.roomType,
                        mealPlan: hv.mealPlan || norm.mealPlan,
                        address: hv.address || norm.address,
                        note: hv.note || ''
                    });
                });
            }

            // 2. 掃描每日章節，萃取航班、對號交通、門票、舟車、佳餚，以及自動偵測住宿
            normalizedDays.forEach((dayObj, dIdx) => {
                const dayNum = dIdx + 1;
                (dayObj.chapters || []).forEach((ch, cIdx) => {
                    totalSpotCount++;
                    const prevCh = cIdx > 0 ? dayObj.chapters[cIdx - 1] : null;
                    const meta = classifyChapterMeta(ch, cIdx, prevCh);
                    const cleanTitle = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                    const plainContent = stripHtmlText(ch.content || '');

                    // (A) 自動偵測住宿（若未在後台手動填 hotelVouchers，則從章節自動抓取並準備合併）
                    if (
                        (!Array.isArray(rawTripData.hotelVouchers) || rawTripData.hotelVouchers.length === 0) &&
                        (meta.stampChar === '住' || /大都會飯店|御宿野乃/i.test(`${cleanTitle} ${plainContent}`))
                    ) {
                        const norm = normalizeHotelKey(cleanTitle, plainContent);
                        rawHotelEntries.push({
                            key: norm.key,
                            officialName: norm.officialName,
                            dayStart: dayObj.day,
                            dayEnd: `Day ${String(dayNum + 1).padStart(2, '0')}`,
                            dayIndex: dayNum,
                            nights: 1,
                            bookingId: `${norm.defaultBookingId}-D${dayNum}`,
                            roomType: norm.roomType,
                            mealPlan: norm.mealPlan,
                            address: norm.address,
                            note: meta.noteText || meta.introText
                        });
                    }

                    // (B) 萃取航班、對號座車票與重要門票
                    if (/機場|Skyliner|新幹線|翼號|山交巴士|藏王纜車|遊船|狐狸村/i.test(cleanTitle)) {
                        const isFlight = /機場/i.test(cleanTitle) && (/出發|起飛|中華料理|賦歸/i.test(cleanTitle));
                        const modeGuess = isFlight ? 'flight' : resolveTransportMode(ch, 50);
                        const tt = resolveTransitTimetableInfo(ch, modeGuess, meta.timeStr);

                        transportTickets.push({
                            day: dayObj.day,
                            type: isFlight ? 'flight' : (/纜車|遊船|狐狸村/.test(cleanTitle) ? 'spot' : 'transit'),
                            leftLabel: isFlight ? '飛' : (/纜車|遊船|狐狸村/.test(cleanTitle) ? '券' : '座'),
                            title: cleanTitle,
                            timeRange: tt.timeRange,
                            seatType: tt.seatType,
                            timetableUrl: tt.timetableUrl,
                            timetableLabel: tt.timetableLabel,
                            intro: meta.introText,
                            note: meta.noteText
                        });
                    }

                    // (C) 萃取舟車段次（全部附上時刻表超連結）
                    if (meta.transitInfo) {
                        transits.push({
                            day: dayObj.day,
                            time: meta.timeStr,
                            ...meta.transitInfo
                        });
                    }

                    // (D) 萃取佳餚清單
                    if (meta.stampChar === '食') {
                        foods.push({
                            day: dayObj.day,
                            time: meta.timeStr,
                            title: cleanTitle,
                            intro: meta.introText,
                            note: meta.noteText
                        });
                    }
                });
            });

            // 3. 執行「同名且連續住宿智慧合併演算法」(Consecutive Hotel Merger)
            const mergedHotels = [];
            rawHotelEntries.forEach(entry => {
                const last = mergedHotels[mergedHotels.length - 1];
                // 只要與上一筆是同一間飯店（key 相同）且天數連續（或同為連續訂單），就自動合併成一張憑證！
                if (last && last.key === entry.key && (entry.dayIndex - last.lastDayIndex <= 2)) {
                    last.totalNights += entry.nights;
                    last.dayEnd = entry.dayEnd || `Day ${String(entry.dayIndex + 1).padStart(2, '0')}`;
                    last.lastDayIndex = entry.dayIndex;
                    if (!last.bookingIds.includes(entry.bookingId)) {
                        last.bookingIds.push(entry.bookingId);
                    }
                } else {
                    mergedHotels.push({
                        ...entry,
                        lastDayIndex: entry.dayIndex,
                        totalNights: entry.nights,
                        bookingIds: [entry.bookingId]
                    });
                }
            });

            // 針對山形大都會飯店（Day 01 入住、Day 03 退房，共 2 晚）自動校正連續晚數顯示
            mergedHotels.forEach((h, i) => {
                if (h.key === 'METROPOLITAN_YAMAGATA' && h.totalNights === 1 && mergedHotels[i + 1]?.dayStart === 'Day 03') {
                    h.totalNights = 2;
                    h.dayEnd = 'Day 03';
                }
            });

            // 4. 渲染「🎫 票券與住宿憑證」（預設全部為縮合狀態，點擊才展開）
            const vContainer = document.getElementById('pack-vouchers');
            const hotelsHTML = mergedHotels.map(h => `
                <div class="collapsible-ticket-card">
                    <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                        <div class="ticket-left-strip hotel">
                            <span style="font-size:0.7rem; opacity:0.85;">${h.dayStart}</span>
                            <strong style="font-size:1rem;">宿</strong>
                        </div>
                        <div class="ticket-head-main">
                            <div>
                                <div class="ticket-head-title">🏨 ${h.officialName}</div>
                                <div class="ticket-head-sub">入住區間：${h.dayStart} ➔ ${h.dayEnd}（已自動彙整連續住宿）</div>
                            </div>
                            <div class="ticket-head-right">
                                <span class="ticket-time-pill reserved">🌙 連續 ${h.totalNights} 晚</span>
                                <span class="ticket-arrow">▶</span>
                            </div>
                        </div>
                    </div>
                    <div class="ticket-detail-body">
                        <div class="hotel-voucher-paper">
                            <div class="hv-top-banner">
                                <span>HOTEL CONFIRMATION VOUCHER ・ 住宿確認憑證</span>
                                <span class="hv-stamp-confirmed">✔ CONFIRMED 已確認</span>
                            </div>
                            <div class="hv-Check-grid">
                                <div>
                                    <div class="hv-check-label">CHECK-IN 入住時間</div>
                                    <div class="hv-check-val">${h.dayStart} · 15:00 後</div>
                                </div>
                                <div class="hv-nights-pill">共 ${h.totalNights} 晚</div>
                                <div>
                                    <div class="hv-check-label">CHECK-OUT 退房時間</div>
                                    <div class="hv-check-val">${h.dayEnd} · 11:00 前</div>
                                </div>
                            </div>
                            <table class="hv-info-table">
                                <tr><th>飯店名稱</th><td><strong>${h.officialName}</strong></td></tr>
                                <tr><th>彙整訂單編號</th><td>${h.bookingIds.join(' ／ ')}（共 ${h.bookingIds.length} 筆連續訂單合併）</td></tr>
                                <tr><th>預訂房型</th><td>${h.roomType}</td></tr>
                                <tr><th>專案與設施</th><td>${h.mealPlan}</td></tr>
                                <tr><th>地址與交通</th><td>${h.address}</td></tr>
                            </table>
                            <div class="hv-barcode-bar">
                                <div class="css-barcode" title="憑證條碼"></div>
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.officialName)}" target="_blank" rel="noopener" class="timetable-link-btn">🗺️ 開啟飯店 Google 地圖 ↗</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            const transportVouchersHTML = transportTickets.map(t => `
                <div class="collapsible-ticket-card">
                    <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                        <div class="ticket-left-strip ${t.type}">
                            <span style="font-size:0.7rem; opacity:0.85;">${t.day}</span>
                            <strong style="font-size:1rem;">${t.leftLabel}</strong>
                        </div>
                        <div class="ticket-head-main">
                            <div>
                                <div class="ticket-head-title">${t.title}</div>
                                <div class="ticket-head-sub">${t.seatType}</div>
                            </div>
                            <div class="ticket-head-right">
                                <span class="ticket-time-pill">${t.timeRange.split('(')[0].trim()}</span>
                                <span class="ticket-arrow">▶</span>
                            </div>
                        </div>
                    </div>
                    <div class="ticket-detail-body">
                        <div style="font-size:0.86rem; line-height:1.65; color:var(--text-dark); margin-bottom:10px;">
                            <div><strong>🕒 航班／發車時間：</strong>${t.timeRange}</div>
                            <div><strong>💺 席次／票種性質：</strong>${t.seatType}</div>
                            ${t.note ? `<div style="margin-top:6px; padding:8px 12px; background:#FFF9F2; border-left:3px solid #D97724; border-radius:6px;"><strong>⚠️ 乘車／兌票注意：</strong>${t.note}</div>` : ''}
                        </div>
                        <div style="display:flex; justify-content:flex-end;">
                            <a href="${t.timetableUrl}" target="_blank" rel="noopener" class="timetable-link-btn">🕒 ${t.timetableLabel} ↗</a>
                        </div>
                    </div>
                </div>
            `).join('');

            vContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>💡 點擊任一項目可展開完整憑證與時刻表（同名連續住宿已自動合併）：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-vouchers', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-vouchers', false)">全部收合</button>
                    </div>
                </div>
                <h4 style="margin: 12px 0 8px; color: var(--accent-brown-dark); font-size:0.92rem;">🏨 連續住宿確認憑證（共 ${mergedHotels.length} 間飯店）</h4>
                ${hotelsHTML}
                <h4 style="margin: 20px 0 8px; color: var(--accent-brown-dark); font-size:0.92rem;">✈️ 航班・對號列車・重要票券（共 ${transportTickets.length} 項）</h4>
                ${transportVouchersHTML}
            `;

            // 5. 渲染「🚄 交通時刻與段次」（全部可收合＋附時刻表超連結）
            const tContainer = document.getElementById('pack-transit');
            tContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>飛機、新幹線對號座與路線巴士段次（點擊展開官方時刻表連結）：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-transit', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-transit', false)">全部收合</button>
                    </div>
                </div>
                ${transits.map(t => `
                    <div class="collapsible-ticket-card">
                        <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                            <div class="ticket-left-strip transit">
                                <span style="font-size:0.7rem;">${t.day}</span>
                                <strong style="font-size:1.1rem;">${t.icon}</strong>
                            </div>
                            <div class="ticket-head-main">
                                <div>
                                    <div class="ticket-head-title">${t.routeText}</div>
                                    <div class="ticket-head-sub">${t.modeName} ・ ${t.seatType}</div>
                                </div>
                                <div class="ticket-head-right">
                                    <span class="ticket-time-pill">${t.time}（約 ${t.mins}分）</span>
                                    <span class="ticket-arrow">▶</span>
                                </div>
                            </div>
                        </div>
                        <div class="ticket-detail-body">
                            <div style="font-size:0.86rem; line-height:1.65; margin-bottom:10px;">
                                <div><strong>🕒 班次時間與區間：</strong>${t.timeRange}</div>
                                <div><strong>💺 座位性質：</strong>${t.seatType}</div>
                                <div><strong>💰 預估車資：</strong>¥${t.cost.toLocaleString()}</div>
                            </div>
                            <div style="display:flex; justify-content:flex-end;">
                                <a href="${t.timetableUrl}" target="_blank" rel="noopener" class="timetable-link-btn">🕒 ${t.timetableLabel} ↗</a>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;

            // 6. 渲染「💰 旅途盤纏帳目」
            const bContainer = document.getElementById('pack-budget');
            const bData = rawTripData.budget || {
                currency: 'JPY',
                total: 160000,
                categories: [
                    { name: '交通（新幹線／Skyliner／巴士／纜車）', amount: 48500, pct: 38 },
                    { name: '住宿（山形大都會 2 晚＋仙台御宿野乃 4 晚等）', amount: 45000, pct: 35 },
                    { name: '餐飲（A5仙台牛／閣牛舌／平田牧場／五十番）', amount: 24800, pct: 19 },
                    { name: '門票與體驗（狐狸村／松島遊船／円通院念珠）', amount: 9800, pct: 8 }
                ]
            };
            const spent = bData.categories.reduce((acc, c) => acc + c.amount, 0);
            bContainer.innerHTML = `
                <div class="budget-card">
                    <div style="display:flex; justify-content:space-between; align-items:baseline;">
                        <div>
                            <div style="font-size:0.78rem; color:var(--text-light);">旅途行跡統計</div>
                            <div style="font-size:1.5rem; font-weight:700; color:#3B4D54;">${normalizedDays.length} 天 ・ ${totalSpotCount} 處打卡</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:0.78rem; color:var(--text-light);">預估總花費 (${bData.currency})</div>
                            <div style="font-size:1.25rem; font-weight:700; color:#B84A39;">¥${spent.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="budget-bar-wrap">
                        <div class="budget-bar-fill" style="width: ${Math.min(100, Math.round((spent / bData.total) * 100))}%;"></div>
                    </div>
                    <div style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 16px;">
                        預算上限：¥${bData.total.toLocaleString()} ｜ 剩餘彈性預算：¥${Math.max(0, bData.total - spent).toLocaleString()}
                    </div>
                    ${bData.categories.map(cat => `
                        <div class="budget-cat-row">
                            <div class="budget-cat-top">
                                <span>${cat.name}</span>
                                <span>¥${cat.amount.toLocaleString()}</span>
                            </div>
                            <div class="budget-bar-wrap" style="height:6px; margin:4px 0;">
                                <div class="budget-bar-fill" style="width:${cat.pct}%; background:#C4A99E;"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // 7. 渲染「🍱 佳餚美食紀錄」（同樣改為可收合手風琴）
            const fContainer = document.getElementById('pack-food');
            fContainer.innerHTML = `
                <div class="pack-toolbar">
                    <span>旅途中品嚐過的好味道（點擊展開餐廳介紹與注意事項）：</span>
                    <div>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-food', true)">全部展開</button>
                        <button type="button" class="pack-toggle-all-btn" onclick="toggleAllTicketsInPanel('pack-food', false)">全部收合</button>
                    </div>
                </div>
                ${foods.map((f, i) => `
                    <div class="collapsible-ticket-card">
                        <div class="ticket-summary-head" onclick="this.parentElement.classList.toggle('open')">
                            <div class="ticket-left-strip spot">
                                <span style="font-size:0.7rem;">${f.day}</span>
                                <strong style="font-size:0.95rem;">#${i + 1}</strong>
                            </div>
                            <div class="ticket-head-main">
                                <div>
                                    <div class="ticket-head-title">🍱 ${f.title}</div>
                                    <div class="ticket-head-sub">用餐時段：${f.time}</div>
                                </div>
                                <div class="ticket-head-right">
                                    <span class="ticket-arrow">▶</span>
                                </div>
                            </div>
                        </div>
                        <div class="ticket-detail-body">
                            <div style="font-size:0.86rem; line-height:1.65;">
                                <div><strong>📘 美味紀錄：</strong>${f.intro}</div>
                                ${f.note ? `<div style="margin-top:6px; padding:8px 12px; background:#FFF9F2; border-left:3px solid #D97724; border-radius:6px;"><strong>⚠️ 用餐／預約注意：</strong>${f.note}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }
    </script>
</body>
</html>
