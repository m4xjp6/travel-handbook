<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #FDFBF7;
            --accent-yellow: #FFE599;
            --accent-brown: #C4A99E;
            --accent-brown-dark: #a6897c;
            --accent-pink: #E5D1C7;
            --text-dark: #4A4A4A;
            --text-light: #7A7A7A;
        }
        body, html { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-dark); height: 100%; }
        .container { display: flex; width: 100%; }
        
        /* 左側地圖區塊 */
        #map-container { position: sticky; top: 0; width: 50vw; height: 100vh; background-color: var(--accent-pink); }
        #map { width: 100%; height: 100%; }
        
        /* 右側內容區塊 */
        #right-panel { width: 50vw; box-sizing: border-box; }
        
        /* 頂部常駐：返回首頁與天數切換導覽列 */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            padding: 16px 40px 12px 40px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-brown-dark);
            font-size: 0.9rem;
            font-weight: bold;
        }
        .trip-main-title {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent-brown-dark);
        }
        
        /* 天數按鈕列 (Day Tabs) */
        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .day-tab {
            border: 1px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-tab:hover {
            background: var(--accent-pink);
            color: white;
        }
        .day-tab.active {
            background: var(--accent-brown);
            color: white;
            box-shadow: 0 2px 8px rgba(196, 169, 158, 0.4);
        }

        /* 文章內容容器 */
        #content { padding: 30px 40px 60px 40px; }

        /* 每日大標題橫幅：統一兩個半透明膠囊標籤的尺寸與格式 */
        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0 30px 0;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .day-banner .day-badge,
        .day-banner .field-test-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.28);
            color: white;
            padding: 4px 12px;
            height: 24px;
            box-sizing: border-box;
            border-radius: 12px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            font-weight: bold;
            line-height: 1;
        }
        .day-banner h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
        }

        /* 單一章節卡片 */
        .chapter { min-height: 65vh; margin-bottom: 45px; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15); position: relative; transition: opacity 0.4s ease; opacity: 0.35; }
        .chapter.active { opacity: 1; }
        .chapter h2 { color: var(--accent-brown); font-size: 1.3rem; margin-top: 0; border-bottom: 2px solid var(--accent-yellow); padding-bottom: 10px; display: inline-block; }
        .chapter-body { line-height: 1.8; color: var(--text-light); font-size: 1rem; letter-spacing: 0.04em; white-space: pre-line; }
        .photo-placeholder { width: 100%; min-height: 220px; background-color: var(--accent-pink); border-radius: 8px; margin: 20px 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.9rem; letter-spacing: 0.1em; overflow: hidden; }
        .photo-placeholder img { width: 100%; height: auto; display: block; object-fit: cover; }

        /* === 網頁版（電腦版）：多媒體畫廊容器與版面配置 === */
        .media-gallery {
            margin: 20px 0;
            display: grid;
            gap: 10px;
            width: 100%;
        }
        /* 單張或垂直堆疊：100% 滿版 */
        .media-gallery.layout-single,
        .media-gallery.layout-stack {
            grid-template-columns: 1fr;
        }
        /* 網頁版：自動依張數等比平分寬度 (2張=50%/50%、3張=33%/33%/33%、4張=25%/25%/25%/25%) */
        .media-gallery.layout-grid-equal,
        .media-gallery.layout-auto-2,
        .media-gallery.layout-auto-3,
        .media-gallery.layout-auto-4 {
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        }
        
        /* 固定 3 等份（每張固定佔 33.3%，就算只放 1~2 張也是 33.3%） */
        .media-gallery.layout-grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        
        /* 固定 4 等份（每張固定佔 25%，就算只放 1~3 張也是 25%） */
        .media-gallery.layout-grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        
        /* 雜誌風一寬一窄 */
        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        .media-gallery.layout-grid-1-2-1 { grid-template-columns: 1fr 2fr 1fr; }

        /* IG 風橫向滑動輪播 */
        .media-gallery.layout-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .media-gallery.layout-carousel .media-item {
            flex: 0 0 82%;
            scroll-snap-align: center;
        }

        /* 單一媒體項目外觀 */
        .media-item {
            position: relative;
            min-width: 0;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f5efe6;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            height: 100%;
            max-height: 460px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        /* 網頁版並排時：全部固定為同一高度 (260px) */
        .layout-grid-2-1 .media-item,
        .layout-grid-1-2 .media-item,
        .layout-grid-equal .media-item,
        .layout-auto-2 .media-item,
        .layout-auto-3 .media-item,
        .layout-auto-4 .media-item {
            height: 260px;
        }

        .media-caption {
            font-size: 0.8rem;
            color: var(--text-light);
            text-align: center;
            padding: 6px 8px;
            background: #faf7f2;
        }

        /* 影片重播按鈕 */
        .replay-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(74, 74, 74, 0.75);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
            z-index: 5;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .replay-btn:hover { background: var(--accent-brown); }

        /* 點圖放大燈箱 (Lightbox) */
        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }
        #lightbox-overlay img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 8px;
            object-fit: contain;
        }

        /* 內建：四色重點底色框 (Callout Box) */
        .callout-box { display: flex; align-items: flex-start; padding: 14px 18px; border-radius: 8px; margin: 16px 0; font-size: 0.92rem; line-height: 1.6; color: #333; white-space: normal; }
        .callout-icon { font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
        .callout-content { flex-grow: 1; }
        .callout-title { font-weight: bold; margin-bottom: 4px; }
        .callout-warning { background-color: #fdf6ec; border-left: 4px solid #e6a23c; }
        .callout-warning .callout-title { color: #b88230; }
        .callout-tip { background-color: #f0f9eb; border-left: 4px solid #67c23a; }
        .callout-tip .callout-title { color: #529b2e; }
        .callout-info { background-color: #eef4ff; border-left: 4px solid #3b82f6; }
        .callout-info .callout-title { color: #2563eb; }

        /* 地圖標記與互動樣式（外層定位、內層圓點，徹底解決 Zoom 偏移問題） */
        .custom-marker {
            background: transparent;
            border: none;
        }
        .custom-marker .marker-dot {
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            background-color: var(--accent-brown);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .custom-marker:hover .marker-dot,
        .custom-marker.active .marker-dot {
            background-color: var(--accent-brown-dark);
            transform: scale(1.35);
            box-shadow: 0 0 0 4px rgba(255, 229, 153, 0.7), 0 3px 8px rgba(0,0,0,0.3);
        }
        .custom-marker:hover,
        .custom-marker.active {
            z-index: 999 !important;
        }
        .marker-tooltip {
            background: rgba(74, 74, 74, 0.92);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .marker-tooltip::before {
            border-top-color: rgba(74, 74, 74, 0.92) !important;
        }

        /* === 手機版：一排最多放 2 張照片 === */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map-container { width: 100vw; height: 38vh; position: sticky; top: 0; z-index: 200; }
            #right-panel { width: 100vw; }
            .top-nav { top: 38vh; padding: 12px 20px; }
            #content { padding: 20px; }
            .chapter { min-height: auto; margin-bottom: 30px; }

            .media-gallery.layout-grid-equal,
            .media-gallery.layout-auto-2,
            .media-gallery.layout-auto-3,
            .media-gallery.layout-auto-4,
            .media-gallery.layout-grid-2-1,
            .media-gallery.layout-grid-4,
            .media-gallery.layout-grid-1-2-1,
            .media-gallery.layout-grid-1-2 {
                grid-template-columns: repeat(2, 1fr);
            }

            .layout-grid-2-1 .media-item,
            .layout-grid-1-2 .media-item,
            .layout-grid-equal .media-item,
            .layout-auto-2 .media-item,
            .layout-auto-3 .media-item,
            .layout-auto-4 .media-item {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側地圖 -->
        <div id="map-container"><div id="map"></div></div>
        
        <!-- 右側導覽列與日記內容 -->
        <div id="right-panel">
            <div class="top-nav">
                <div class="nav-header">
                    <a href="index.html" class="back-link">&lt; 書櫃</a>
                    <h2 class="trip-main-title" id="trip-title">讀取中...</h2>
                </div>
                <div class="day-tabs" id="day-tabs"></div>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('trip') || 'tohoku_2026';

        let map = null;
        let markersLayer = null;
        let routeLayerGroup = null;
        let observer = null;
        let videoObserver = null;
        let normalizedDays = [];

        // 儲存從 timeline/tohoku_2026.json 解析出的歷史軌跡資料
        let timelinePoints = [];      // 依時間排序的純座標陣列 [[lat, lng], ...]
        let timelineChapterMap = {};  // 若檔案內已按章節 ID 分類 {"d1-ch2": [[lat, lng], ...]}
        let timelineSearchCursor = 0; // 記錄目前比對到的時間軸索引，確保依行程順序往後找

        let chapterMarkers = new Map();
        let isClickScrolling = false;
        let scrollUnlockTimer = null;

        // 同步讀取 data/tohoku_2026.json 與 timeline/tohoku_2026.json
        Promise.all([
            fetch(`data/${tripId}.json`).then(res => {
                if (!res.ok) throw new Error('找不到該旅程的資料檔');
                return res.json();
            }),
            fetch(`timeline/${tripId}.json`)
                .then(res => res.ok ? res.json() : null)
                .catch(() => null) // 若尚未上傳 timeline 檔案則自動略過，不影響網頁運作
        ])
        .then(([data, rawTimeline]) => {
            document.title = data.tripTitle || '電子旅行手帳';
            document.getElementById('trip-title').textContent = data.tripTitle || '';

            // 解析 Google 時間軸檔案
            if (rawTimeline) {
                parseTimelineFile(rawTimeline);
            }

            if (Array.isArray(data.days) && data.days.length > 0) {
                normalizedDays = data.days;
            } else if (Array.isArray(data.chapters)) {
                const grouped = {};
                data.chapters.forEach(ch => {
                    const d = ch.day || 'Day 01';
                    if (!grouped[d]) grouped[d] = { day: d, dayTitle: ch.dayTitle || '', isFieldTest: ch.isFieldTest || false, chapters: [] };
                    grouped[d].chapters.push(ch);
                });
                normalizedDays = Object.values(grouped);
            }

            initMap();
            buildDayTabs();
            renderDay('ALL');
        })
        .catch(error => {
            document.getElementById('content').innerHTML = `<h2>糟糕，讀取失敗！</h2><p>${error.message}</p>`;
        });

        /**
         * 自動解析 timeline/tohoku_2026.json（相容 Google Maps 匯出格式與自訂格式）
         */
        function parseTimelineFile(raw) {
            timelinePoints = [];
            timelineChapterMap = {};

            // 格式 A：如果是已經按章節 ID 分好的物件，例如 { "d2-ch1": [[38.1, 140.3], ...] }
            if (!Array.isArray(raw) && !raw.semanticSegments && !raw.timelineObjects && !raw.locations && !raw.features) {
                timelineChapterMap = raw;
                return;
            }

            // 格式 B：手機新版 Google Maps 匯出的 Timeline.json (semanticSegments)
            if (Array.isArray(raw.semanticSegments)) {
                const temp = [];
                raw.semanticSegments.forEach(seg => {
                    if (Array.isArray(seg.timelinePath)) {
                        seg.timelinePath.forEach(pt => {
                            const coord = parseLatLngString(pt.point);
                            if (coord) {
                                temp.push({
                                    time: pt.time ? new Date(pt.time).getTime() : 0,
                                    coord
                                });
                            }
                        });
                    }
                });
                temp.sort((a, b) => a.time - b.time);
                timelinePoints = temp.map(item => item.coord);
                return;
            }

            // 格式 C：GeoJSON 格式
            if (raw.features && Array.isArray(raw.features)) {
                raw.features.forEach(f => {
                    if (f.geometry && f.geometry.type === 'LineString') {
                        f.geometry.coordinates.forEach(c => timelinePoints.push([c[1], c[0]]));
                    }
                });
                return;
            }

            // 格式 D：純座標陣列 [[lat, lng], ...]
            if (Array.isArray(raw)) {
                timelinePoints = raw;
            }
        }

        // 解析 Google 時間軸字串 (相容 Android "38.3721°, 141.0595°" 與 iOS "geo:38.3721,141.0595")
        function parseLatLngString(str) {
            if (!str || typeof str !== 'string') return null;
            const cleaned = str.replace('geo:', '').replace(/°/g, '').trim();
            const parts = cleaned.split(',').map(s => parseFloat(s.trim()));
            if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                return [Number(parts[0].toFixed(5)), Number(parts[1].toFixed(5))];
            }
            return null;
        }

        // 計算兩個經緯度之間的直線距離（單位：公里）
        function getDistanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        /**
         * 從單一 timelinePoints 陣列中，自動擷取「從 prevCh 到 currCh」的真實 GPS 軌跡段
         */
        function extractTimelineSegment(prevCh, currCh) {
            // 1. 若檔案內有明確指定該章節 ID 的軌跡
            if (timelineChapterMap[currCh.id] && timelineChapterMap[currCh.id].length > 1) {
                return timelineChapterMap[currCh.id];
            }

            if (timelinePoints.length < 2) return null;

            const thresholdKm = 1.2; // 判定「抵達景點附近」的半徑容許值（1.2 公里內）
            let startIdx = -1;
            let bestStartDist = Infinity;

            // 從上次找到的游標位置往後搜尋起點 (prevCh)
            for (let i = timelineSearchCursor; i < timelinePoints.length; i++) {
                const [lat, lng] = timelinePoints[i];
                const dist = getDistanceKm(prevCh.lat, prevCh.lng, lat, lng);
                if (dist <= thresholdKm) {
                    if (dist < bestStartDist) {
                        bestStartDist = dist;
                        startIdx = i;
                    }
                } else if (startIdx !== -1 && i - startIdx > 15) {
                    // 已經離開起點範圍，停止尋找起點
                    break;
                }
            }

            // 若從游標找不到，嘗試從頭搜尋一次（以防使用者單獨切換某一天 Tab）
            if (startIdx === -1) {
                for (let i = 0; i < timelinePoints.length; i++) {
                    const [lat, lng] = timelinePoints[i];
                    const dist = getDistanceKm(prevCh.lat, prevCh.lng, lat, lng);
                    if (dist <= thresholdKm && dist < bestStartDist) {
                        bestStartDist = dist;
                        startIdx = i;
                    }
                }
            }

            if (startIdx === -1) return null;

            // 從起點往後搜尋終點 (currCh)，最多往後找 800 個定位點避免跨天誤判
            let endIdx = -1;
            let bestEndDist = Infinity;
            const maxLookAhead = Math.min(timelinePoints.length, startIdx + 800);

            for (let j = startIdx + 1; j < maxLookAhead; j++) {
                const [lat, lng] = timelinePoints[j];
                const dist = getDistanceKm(currCh.lat, currCh.lng, lat, lng);
                if (dist <= thresholdKm) {
                    if (dist < bestEndDist) {
                        bestEndDist = dist;
                        endIdx = j;
                    }
                } else if (endIdx !== -1 && j - endIdx > 10) {
                    break;
                }
            }

            if (endIdx !== -1 && endIdx > startIdx) {
                timelineSearchCursor = endIdx; // 更新游標給下一章節使用
                const sliced = timelinePoints.slice(startIdx, endIdx + 1);
                // 將首尾座標與章節圓點精準接合
                return [[prevCh.lat, prevCh.lng], ...sliced, [currCh.lat, currCh.lng]];
            }

            return null;
        }

        function initMap(daysData) {
            // 自動抓取該旅程第一個章節的座標作為初始視角（若無資料則預設停在台灣）
            let startLat = 23.6978, startLng = 120.9605, startZoom = 7;
            if (daysData && daysData.length > 0 && daysData[0].chapters && daysData[0].chapters.length > 0) {
                const firstCh = daysData[0].chapters[0];
                if (firstCh.lat && firstCh.lng) {
                    startLat = firstCh.lat;
                    startLng = firstCh.lng;
                    startZoom = firstCh.zoom || 13;
                }
            }

            map = L.map('map', { zoomControl: false }).setView([startLat, startLng], startZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);
            routeLayerGroup = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        function buildDayTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'day-tab active';
            allBtn.textContent = '全部天數';
            allBtn.onclick = () => selectTab('ALL', allBtn);
            tabsContainer.appendChild(allBtn);

            normalizedDays.forEach(dayObj => {
                const btn = document.createElement('button');
                btn.className = 'day-tab';
                btn.textContent = dayObj.day;
                btn.onclick = () => selectTab(dayObj.day, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function selectTab(dayKey, clickedBtn) {
            document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');
            renderDay(dayKey);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|mp4|mov|webm)$/i.test(str) ||
                   str.includes('media/') ||
                   str.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|webm)$/i.test(str);
        }

        function buildMediaHTML(ch) {
            const items = [];

            if (isMediaFile(ch.mediaPlaceholder)) {
                items.push({ src: ch.mediaPlaceholder, caption: '' });
            }

            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const src = typeof item === 'string' ? item : item.src;
                    const caption = typeof item === 'object' && item.caption ? item.caption : '';
                    if (isMediaFile(src)) {
                        items.push({ src, caption });
                    }
                });
            }

            if (items.length === 0) {
                return ch.mediaPlaceholder
                    ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>`
                    : '';
            }

            let layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length === 2) layoutClass = 'layout-auto-2';
                else if (items.length === 3) layoutClass = 'layout-auto-3';
                else if (items.length === 4) layoutClass = 'layout-auto-4';
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map(item => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata"></video>
                            <button type="button" class="replay-btn" onclick="replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>
                    `;
                } else {
                    return `
                        <div class="media-item">
                            <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox('${item.src}')">
                            ${captionHTML}
                        </div>
                    `;
                }
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) {
                video.currentTime = 0;
                video.play();
            }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.45 });

            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        function openLightbox(src) {
            let overlay = document.getElementById('lightbox-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'lightbox-overlay';
                overlay.onclick = () => overlay.style.display = 'none';
                overlay.innerHTML = '<img id="lightbox-img" src="" alt="放大預覽">';
                document.body.appendChild(overlay);
            }
            document.getElementById('lightbox-img').src = src;
            overlay.style.display = 'flex';
        }

        function setActiveChapter(activeSection, activeMarker) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            if (activeSection) activeSection.classList.add('active');

            document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('active'));
            const marker = activeMarker || chapterMarkers.get(activeSection);
            if (marker && marker.getElement()) {
                marker.getElement().classList.add('active');
            }
        }

        function renderDay(dayKey) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            if (observer) observer.disconnect();

            markersLayer.clearLayers();
            routeLayerGroup.clearLayers();
            chapterMarkers.clear();
            timelineSearchCursor = 0; // 重置時間軸搜尋游標

            const dotIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            let chaptersList = [];

            const daysToRender = dayKey === 'ALL'
                ? normalizedDays
                : normalizedDays.filter(d => d.day === dayKey);

            daysToRender.forEach(dayObj => {
                const banner = document.createElement('div');
                banner.className = 'day-banner';
                
                let fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';

                banner.innerHTML = `
                    <div class="day-banner-header">
                        <div class="day-badge">${dayObj.day}</div>
                        ${fieldTestBadgeHTML}
                    </div>
                    <h1>${dayObj.dayTitle || dayObj.day}</h1>
                `;
                contentDiv.appendChild(banner);

                (dayObj.chapters || []).forEach((ch) => {
                    chaptersList.push(ch);
                    const section = document.createElement('section');
                    section.className = `chapter ${chaptersList.length === 1 ? 'active' : ''}`;
                    section.id = `section-${ch.id}`;
                    section.setAttribute('data-id', ch.id);
                    section.setAttribute('data-lat', ch.lat);
                    section.setAttribute('data-lng', ch.lng);
                    section.setAttribute('data-zoom', ch.zoom || 13);

                    let mediaHTML = buildMediaHTML(ch);

                    section.innerHTML = `
                        <h2>${ch.title}</h2>
                        ${mediaHTML}
                        <div class="chapter-body">${ch.content || ''}</div>
                    `;
                    contentDiv.appendChild(section);

                    if (ch.lat && ch.lng) {
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);

                        marker.bindTooltip(`${dayObj.day}｜${ch.title}`, {
                            direction: 'top',
                            offset: [0, -10],
                            className: 'marker-tooltip'
                        });

                        marker.on('click', () => {
                            isClickScrolling = true;
                            clearTimeout(scrollUnlockTimer);

                            setActiveChapter(section, marker);
                            map.flyTo([ch.lat, ch.lng], ch.zoom || 13, { animate: true, duration: 1.2 });

                            const topNav = document.querySelector('.top-nav');
                            const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                            const targetY = window.pageYOffset + section.getBoundingClientRect().top - navBottom - 20;

                            window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });

                            scrollUnlockTimer = setTimeout(() => {
                                isClickScrolling = false;
                            }, 900);
                        });

                        chapterMarkers.set(section, marker);

                        if (chaptersList.length === 1 && marker.getElement()) {
                            marker.getElement().classList.add('active');
                        }
                    }
                });
            });

            if (chaptersList.length > 0) {
                map.flyTo([chaptersList[0].lat, chaptersList[0].lng], chaptersList[0].zoom || 13, { animate: true, duration: 1.2 });
                drawHybridRoutes(chaptersList);
            }

            observer = new IntersectionObserver((entries) => {
                if (isClickScrolling) return;

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chapter = entry.target;
                        const targetLat = parseFloat(chapter.getAttribute('data-lat'));
                        const targetLng = parseFloat(chapter.getAttribute('data-lng'));
                        const targetZoom = parseInt(chapter.getAttribute('data-zoom'));

                        setActiveChapter(chapter);

                        if (!isNaN(targetLat) && !isNaN(targetLng)) {
                            map.flyTo([targetLat, targetLng], targetZoom, { animate: true, duration: 1.5 });
                        }
                    }
                });
            }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });

            document.querySelectorAll('.chapter').forEach(chapter => observer.observe(chapter));
            initVideoAutoplay();
        }

        // === 混合式軌跡引擎：1. 單一 Timeline 檔自動擷取 ➔ 2. 依 transport 畫鐵道/弧線/OSRM 道路 ===
        async function drawHybridRoutes(chaptersList) {
            for (let i = 1; i < chaptersList.length; i++) {
                const prevCh = chaptersList[i - 1];
                const currCh = chaptersList[i];
                if (!prevCh.lat || !prevCh.lng || !currCh.lat || !currCh.lng) continue;

                const { coords, isArc } = await getSegmentRoute(prevCh, currCh);

                L.polyline(coords, {
                    color: '#C4A99E',
                    weight: isArc ? 3 : 4,
                    opacity: 0.85,
                    dashArray: isArc ? '6, 8' : null
                }).addTo(routeLayerGroup);
            }
        }

        async function getSegmentRoute(prevCh, currCh) {
            const start = [prevCh.lat, prevCh.lng];
            const end = [currCh.lat, currCh.lng];
            const mode = (currCh.transport || 'walk').toString().trim().toLowerCase();

            // 1. 若章節內有手寫指定 track 陣列
            if (Array.isArray(currCh.track) && currCh.track.length > 1) {
                return { coords: currCh.track, isArc: false };
            }

            // 判斷是否為飛機（飛機開飛航無 GPS，直接使用高空弧線）
            const isFlight = ['flight', 'airplane', 'plane', '飛機', '航班'].includes(mode);

            // 2. 【優先：做法三】從已載入的 timeline/${tripId}.json 自動擷取該段真實軌跡
            if (!isFlight) {
                const matchedTrack = extractTimelineSegment(prevCh, currCh);
                if (matchedTrack && matchedTrack.length > 2) {
                    return { coords: matchedTrack, isArc: false };
                }
            }

            // 3. 【補位：做法二】全球通用交通工具弧度字典（支援英文通用碼、各國別名與中文）
            const curveModes = {
                // ✈️ 飛機 / 航班
                'flight': 0.22, 'airplane': 0.22, 'plane': 0.22, '飛機': 0.22, '航班': 0.22,
                // 🚄 高鐵 / 新幹線 / 各國高速鐵路
                'hsr': 0.12, 'high_speed_rail': 0.12, 'shinkansen': 0.12, 'tgv': 0.12, 'eurostar': 0.12, '高鐵': 0.12, '新幹線': 0.12,
                // 🚆 一般火車 / 台鐵 / JR / 各國國鐵與私鐵
                'train': 0.08, 'railway': 0.08, 'tra': 0.08, 'jr': 0.08, 'ktm': 0.08, '火車': 0.08, '台鐵': 0.08, '鐵道': 0.08,
                // 🚇 捷運 / 地鐵 / 輕軌 / 單軌電車
                'metro': 0.05, 'mrt': 0.05, 'subway': 0.05, 'lrt': 0.05, 'monorail': 0.05, '捷運': 0.05, '地鐵': 0.05, '輕軌': 0.05,
                // 🚡 纜車 / 索道
                'ropeway': 0.04, 'cable_car': 0.04, 'gondola': 0.04, '纜車': 0.04,
                // ⛴️ 遊船 / 渡輪 / 郵輪
                'boat': 0.12, 'ferry': 0.12, 'cruise': 0.12, 'ship': 0.12, '遊船': 0.12, '渡輪': 0.12, '船': 0.12
            };

            const isLongDistance = getDistanceKm(prevCh.lat, prevCh.lng, currCh.lat, currCh.lng) > 250;

            if (curveModes[mode] !== undefined || isLongDistance) {
                const curvature = curveModes[mode] !== undefined ? curveModes[mode] : 0.22;
                return { coords: generateCurve(start, end, curvature), isArc: true };
            }

            // 4. 一般道路模式（步行 walk / 巴士 bus / 自駕 drive / 計程車 taxi）：呼叫 OSRM 計算全球街道
            const isWalk = ['walk', 'foot', '步行', '散步'].includes(mode);
            const profile = isWalk ? 'foot' : 'driving';

            const cacheKey = `route_v4_${prevCh.id}_${currCh.id}_${profile}`;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                return { coords: JSON.parse(cached), isArc: false };
            }

            try {
                const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${prevCh.lng},${prevCh.lat};${currCh.lng},${currCh.lat}?overview=full&geometries=geojson`;
                const res = await fetch(osrmUrl);
                const data = await res.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    localStorage.setItem(cacheKey, JSON.stringify(roadCoords));
                    return { coords: roadCoords, isArc: false };
                }
            } catch (e) {
                console.warn(`OSRM 計算失敗 (${currCh.id})，使用直線替代`);
            }

            return { coords: [start, end], isArc: true };
        }

        function generateCurve(start, end, curvature = 0.15, segments = 32) {
            const [lat1, lng1] = start;
            const [lat2, lng2] = end;
            const midLat = (lat1 + lat2) / 2;
            const midLng = (lng1 + lng2) / 2;
            const dLat = lat2 - lat1;
            const dLng = lng2 - lng1;
            const ctrlLat = midLat - dLng * curvature;
            const ctrlLng = midLng + dLat * curvature;

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * ctrlLat + t * t * lat2;
                const lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * ctrlLng + t * t * lng2;
                points.push([Number(lat.toFixed(5)), Number(lng.toFixed(5))]);
            }
            return points;
        }
    </script>
