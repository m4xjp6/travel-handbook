<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* === 1. 全域色彩變數與基礎頁面設定 === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-yellow: #FFE599;     /* 標題底線亮黃色 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕 */
            --accent-pink: #E5D1C7;       /* 藕粉底色 */
            --accent-sage: #D8E2D5;       /* 鼠尾草綠 */
            --text-dark: #4A4A4A;         /* 主要深灰文字 */
            --text-light: #7A7A7A;        /* 內文淺灰文字 */
            --border-soft: rgba(196, 169, 158, 0.32);
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* === 2. 左右雙欄主版面配置 (左地圖 50% / 右內容 50%) === */
        .container { display: flex; width: 100%; }
        #map-container {
            position: sticky;
            top: 0;
            width: 50vw;
            height: 100vh;
            background-color: var(--accent-pink);
        }
        #map { width: 100%; height: 100%; }
        #right-panel { width: 50vw; box-sizing: border-box; }

        .map-mode-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(6px);
            padding: 5px 8px;
            border-radius: 24px;
            border: 1.5px solid var(--border-soft);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }
        .map-mode-btn {
            font-family: inherit;
            border: none;
            background: transparent;
            color: var(--text-dark);
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .map-mode-btn.active {
            background: var(--accent-brown-dark);
            color: white;
        }
        .map-stats-pill {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 800;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-brown-dark);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            pointer-events: none;
        }

        /* === 3. 右側頂部常駐導覽列、四大模式切換與天數切換按鈕 === */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 247, 0.96);
            backdrop-filter: blur(8px);
            padding: 14px 36px 12px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-brown-dark);
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .trip-main-title {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent-brown-dark);
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 頂部四大功能模式列（順序：行程安排 > 資訊情報 > 票券蒐集 > 圖文遊記，無底框僅選中有底色） */
        .view-mode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .view-mode-btn {
            font-family: inherit;
            background: transparent;
            color: var(--text-dark);
            border: 1.5px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .view-mode-btn:hover {
            color: var(--accent-brown-dark);
            border-color: var(--border-soft);
        }
        .view-mode-btn.active {
            background: var(--accent-brown);
            color: white;
            border-color: var(--accent-brown);
            box-shadow: 0 3px 9px rgba(196, 169, 158, 0.4);
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .day-tab {
            border: 1px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 5px 13px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-tab:hover { background: var(--accent-pink); color: white; }
        .day-tab.active {
            background: var(--accent-brown-dark);
            border-color: var(--accent-brown-dark);
            color: white;
            box-shadow: 0 2px 8px rgba(166, 137, 124, 0.35);
        }

        /* === 4. 視角容器與圖文遊記樣式 === */
        .view-section {
            display: none;
            padding: 26px 36px 60px;
        }
        .view-section.active {
            display: block;
        }

        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 14px 0 26px;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .day-banner .day-badge,
        .day-banner .field-test-badge,
        .day-banner .draft-preview-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.28);
            color: white;
            padding: 4px 12px;
            height: 24px;
            box-sizing: border-box;
            border-radius: 12px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            font-weight: bold;
            line-height: 1;
        }
        .day-banner .draft-preview-badge {
            background: rgba(184, 74, 57, 0.85);
        }
        .day-banner h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .draft-empty-box {
            text-align: center;
            padding: 48px 24px;
            background: white;
            border: 1.5px dashed var(--accent-brown);
            border-radius: 18px;
            color: var(--text-light);
            margin: 20px 0;
            line-height: 1.7;
        }

        .chapter {
            min-height: 65vh;
            margin-bottom: 45px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15);
            position: relative;
            transition: opacity 0.4s ease;
            opacity: 0.35;
        }
        .chapter.active { opacity: 1; }
        .chapter h2 {
            color: var(--accent-brown);
            font-size: 1.3rem;
            margin-top: 0;
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 10px;
            display: inline-block;
        }
        .chapter-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1rem;
            letter-spacing: 0.04em;
            white-space: pre-line;
        }
        .photo-placeholder {
            width: 100%;
            min-height: 220px;
            background-color: var(--accent-pink);
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            overflow: hidden;
        }

        /* === 5. 多媒體畫廊與燈箱 === */
        .media-gallery {
            margin: 20px 0;
            display: grid;
            gap: 10px;
            width: 100%;
        }
        .media-gallery.layout-single,
        .media-gallery.layout-stack { grid-template-columns: 1fr; }
        .media-gallery.layout-single .media-item { max-height: 440px; }
        .media-gallery.layout-auto-2,
        .media-gallery.layout-grid-equal { grid-template-columns: repeat(2, 1fr); }
        .media-gallery.layout-auto-3,
        .media-gallery.layout-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .media-gallery.layout-auto-4,
        .media-gallery.layout-grid-4 { grid-template-columns: repeat(4, 1fr); }
        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        .media-gallery.layout-grid-1-2-1 { grid-template-columns: 1fr 2fr 1fr; }
        .media-gallery.layout-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .media-gallery.layout-carousel .media-item {
            flex: 0 0 82%;
            scroll-snap-align: center;
        }
        .media-item {
            position: relative;
            min-width: 0;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f5efe6;
            height: 260px;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .media-item img:hover,
        .media-item video:hover { transform: scale(1.02); }
        .media-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.65));
            color: #fff;
            font-size: 0.78rem;
            padding: 16px 10px 6px;
            pointer-events: none;
        }
        .replay-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 5;
        }
        .replay-btn:hover { background: rgba(0, 0, 0, 0.8); }

        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
            touch-action: pan-y;
        }
        #lightbox-overlay img,
        #lightbox-overlay video {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            object-fit: contain;
            cursor: default;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
            backdrop-filter: blur(4px);
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }
        .lightbox-nav:hover {
            background: rgba(196, 169, 158, 0.85);
            transform: translateY(-50%) scale(1.08);
        }
        .lightbox-nav.prev { left: 24px; }
        .lightbox-nav.next { right: 24px; }
        .lightbox-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10001;
            white-space: nowrap;
        }

        /* === 6. 內文重點提示框與預訂按鈕 === */
        .callout-box {
            display: flex;
            align-items: flex-start;
            padding: 14px 18px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #333;
            white-space: normal;
        }
        .callout-icon { font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
        .callout-content { flex-grow: 1; }
        .callout-title { font-weight: bold; margin-bottom: 4px; }
        .callout-tip { background-color: #fdf6ec; border-left: 4px solid #e6a23c; }
        .callout-tip .callout-title { color: #b88230; }
        .callout-sci { background-color: #f0f9eb; border-left: 4px solid #67c23a; }
        .callout-sci .callout-title { color: #529b2e; }
        .callout-info { background-color: #eef4ff; border-left: 4px solid #3b82f6; }
        .callout-info .callout-title { color: #2563eb; }
        .callout-story { background-color: #f6f2ff; border-left: 4px solid #8b5cf6; }
        .callout-story .callout-title { color: #6d28d9; }
        .callout-warning { background-color: #fff1f2; border-left: 4px solid #f43f5e; }
        .callout-warning .callout-title { color: #be123c; }

        .affiliate-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed rgba(196, 169, 158, 0.35);
        }
        .affiliate-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background-color: #f7f1ed;
            color: var(--accent-brown-dark);
            border: 1px solid #d8c3b8;
            border-radius: 24px;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(196, 169, 158, 0.15);
        }
        .affiliate-btn:hover {
            background-color: var(--accent-brown);
            color: #ffffff;
            border-color: var(--accent-brown);
            transform: translateY(-2px);
        }
        .affiliate-btn .arrow-icon { font-size: 0.85em; opacity: 0.85; }

        /* ==============================================================
           7. 模組一：📅 行程安排 (分離「📘 景點介紹」與「⚠️ 注意事項」)
           ============================================================== */
        .itinerary-day-block { margin-bottom: 38px; }
        .itin-day-header { margin-bottom: 14px; }
        .itin-day-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.32rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 6px 0;
        }
        .itin-day-sub {
            font-size: 0.88rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .itin-summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #F4EFE6;
            border: 1.5px solid #D8C8B8;
            border-radius: 14px;
            padding: 14px 10px;
            margin: 14px 0 18px;
            text-align: center;
        }
        .itin-sum-col:first-child { border-right: 1px solid #DFD3C5; }
        .itin-sum-label { font-size: 0.78rem; color: var(--text-light); margin-bottom: 4px; }
        .itin-sum-val {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #2C3E50;
        }
        .itin-sum-val.cost { color: #B84A39; }

        .itin-transit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 6px 0;
            font-size: 0.84rem;
            color: var(--text-light);
            border-bottom: 1px dotted rgba(196, 169, 158, 0.45);
        }
        .itin-transit-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .itin-transit-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #EFE7DA;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .itin-transit-right {
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .spot-intro-card {
            background: white;
            border: 1.5px solid #8E7F76;
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(196, 169, 158, 0.12);
            transition: box-shadow 0.2s;
        }
        .spot-intro-card:hover {
            box-shadow: 0 5px 16px rgba(196, 169, 158, 0.24);
        }
        .spot-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            gap: 10px;
        }
        .spot-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .spot-time-box {
            background: #F4EFE6;
            border: 1.5px solid #6E6259;
            color: #3A322D;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.92rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 10px;
            letter-spacing: 0.03em;
        }
        .spot-cat-pill {
            background: #F5E6D3;
            color: #9C6B3B;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
        }
        .spot-title-text {
            font-size: 1.02rem;
            font-weight: 700;
            color: #2B2B2B;
        }
        .spot-toggle-arrow {
            color: #8E7F76;
            font-size: 0.85rem;
            transition: transform 0.25s ease;
        }
        .spot-intro-card.open .spot-toggle-arrow {
            transform: rotate(90deg);
        }
        .spot-card-body {
            display: none;
            padding: 0 18px 16px;
            border-top: 1px dashed #E5DEC9;
        }
        .spot-intro-card.open .spot-card-body {
            display: block;
        }

        .spot-sub-block {
            margin-top: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.68;
        }
        .spot-sub-block.intro-block {
            background: #F9F6F0;
            border-left: 3.5px solid #4A7C59;
            color: var(--text-dark);
        }
        .spot-sub-block.note-block {
            background: #FFF9F2;
            border-left: 3.5px solid #D97724;
            color: #5C4028;
        }
        .spot-sub-title {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
        }
        .spot-sub-block.intro-block .spot-sub-title { color: #3B6E4C; }
        .spot-sub-block.note-block .spot-sub-title { color: #B85D14; }
        .spot-sub-text {
            white-space: pre-line;
            margin: 0;
        }

        .spot-action-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .spot-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #C9D6DF;
            background: #F0F5F9;
            color: #3A506B;
            transition: all 0.2s;
        }
        .spot-pill-btn.loc {
            background: #F4EFE6;
            border-color: #D8C8B8;
            color: #6E5A4F;
        }
        .spot-pill-btn:hover {
            transform: translateY(-1px);
            filter: brightness(0.96);
        }

        /* ==============================================================
           8. 模組二：📡 資訊情報
           ============================================================== */
        .info-station-header {
            background: linear-gradient(135deg, #EBF3F9 0%, #F5F9FC 100%);
            border: 1.5px solid #C5D9E8;
            border-radius: 16px;
            padding: 20px 22px;

    <!-- 點圖/點影片放大預覽燈箱 -->
    <div id="lightbox-overlay" onclick="handleOverlayClick()">
        <button type="button" class="lightbox-nav prev" id="lightbox-prev" onclick="event.stopPropagation(); stepLightbox(-1)">❮</button>
        <img id="lightbox-img" src="" alt="放大預覽" onclick="event.stopPropagation()">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* ==============================================================
           1. 全域狀態與雙檔案動態載入引擎 (data/[tripId].json + itinerary/[tripId].json)
           ============================================================== */
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('trip') || 'tohoku_2026';
        // 作者預覽模式：網址加上 &preview=1 即可預覽標記為 isDraft: true 的草稿天數與章節
        const isPreviewMode = urlParams.get('preview') === '1' || urlParams.get('preview') === 'true';

        let rawJournalData = {};
        let rawItineraryData = {};
        let isWholeJournalDraft = false;
        let currentTripAvatar = '🦊';
        let currentTripEndDate = null;
        let currentTripTimezone = 'Asia/Tokyo';
        let currentCurrencyCode = 'JPY';
        let currentCurrencySymbol = '¥';

        let map = null;
        let baseRouteLayer = null;
        let activeRouteLayer = null;
        let markersLayer = null;
        let exploreStampsLayer = null;
        let currentMapMode = 'route';
        let currentDayFilter = 'ALL';

        let foxMarker = null;
        let foxAnimFrame = null;
        let observer = null;
        let videoObserver = null;
        let normalizedDays = [];
        let currentChaptersList = [];
        let currentActiveIndex = 0;

        let lightboxItems = [];
        let lightboxIndex = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let justSwiped = false;

        const segmentCoordsCache = {};
        const chapterMarkers = new Map();
        let isClickScrolling = false;
        let scrollUnlockTimer = null;

        let liveWeatherByDay = {};
        let allInfoClippings = [];
        let currentClipCategory = 'ALL';
        let allExpenseDetails = [];

        const CURVE_MODES = {
            flight: 0.22,
            hsr: 0.12,
            boat: 0.12,
            train: 0.08,
            metro: 0.05,
            ropeway: 0.04
        };

        // 判斷單一物件（Day 或 Chapter）是否被標記為草稿
        function isItemDraft(obj) {
            if (!obj) return false;
            return obj.isDraft === true || obj.hidden === true || obj.status === 'draft';
        }

        /* ==============================================================
           2. 同步讀取 data/*.json (遊記) 與 itinerary/*.json (行程情報) 並自動縫合
           ============================================================== */
        Promise.all([
            fetch(`data/${tripId}.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
            fetch(`itinerary/${tripId}.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
        ]).then(([journalJson, itinJson]) => {
            if (!journalJson && !itinJson) {
                throw new Error(`找不到 data/${tripId}.json 或 itinerary/${tripId}.json 資料檔`);
            }

            rawJournalData = journalJson || {};
            rawItineraryData = itinJson || {};

            // 檢查整本遊記 (data/[tripId].json) 是否在最外層被設為草稿
            isWholeJournalDraft = !isPreviewMode && (
                !journalJson ||
                rawJournalData.isDraft === true ||
                rawJournalData.hidden === true ||
                rawJournalData.status === 'draft'
            );

            // 1. 讀取全域設定 (優先採用 itinerary/*.json 設定，次之採用 data/*.json)
            const mainTitle = rawItineraryData.tripTitle || rawJournalData.tripTitle || '電子旅行手帳';
            document.title = mainTitle;
            document.getElementById('trip-title').textContent = mainTitle;

            currentTripAvatar = rawItineraryData.avatar || rawJournalData.avatar || (tripId.includes('malaysia') ? '🦁' : '🦊');
            currentTripEndDate = rawItineraryData.endDate || rawJournalData.endDate || null;
            currentTripTimezone = rawItineraryData.timezone || (tripId.includes('malaysia') ? 'Asia/Kuala_Lumpur' : 'Asia/Tokyo');
            currentCurrencyCode = rawItineraryData.currency || rawJournalData.currency || 'JPY';
            currentCurrencySymbol = rawItineraryData.currencySymbol || (currentCurrencyCode === 'TWD' ? 'NT$' : (currentCurrencyCode === 'MYR' ? 'RM' : (currentCurrencyCode === 'SGD' ? 'S$' : '¥')));

            // 2. 建立 itinerary 站點與天數索引表 (優先依 day 名稱與 id 精準對應)
            const itinSpotMapById = new Map();
            const itinDayMapByName = new Map();
            if (Array.isArray(rawItineraryData.days)) {
                rawItineraryData.days.forEach(d => {
                    if (d.day) itinDayMapByName.set(d.day, d);
                    (d.spots || []).forEach(sp => {
                        if (sp.id) itinSpotMapById.set(sp.id, { ...sp, dayRegion: d.region || '' });
                    });
                });
            }

            // 3. 將遊記 days 與行程 spots 無縫合體
            let baseDays = [];
            if (!isWholeJournalDraft && Array.isArray(rawJournalData.days) && rawJournalData.days.length > 0) {
                baseDays = rawJournalData.days;
            } else if (!isWholeJournalDraft && Array.isArray(rawJournalData.chapters)) {
                const grouped = {};
                rawJournalData.chapters.forEach(ch => {
                    const d = ch.day || 'Day 01';
                    if (!grouped[d]) grouped[d] = { day: d, dayTitle: ch.dayTitle || '', isFieldTest: ch.isFieldTest || false, chapters: [] };
                    grouped[d].chapters.push(ch);
                });
                baseDays = Object.values(grouped);
            } else if (Array.isArray(rawItineraryData.days)) {
                // 若 data/*.json 設為整本草稿 (isDraft: true) 或尚未建立，則以 itinerary/*.json 支撐行程安排、資訊情報與票券蒐集
                baseDays = rawItineraryData.days.map(d => ({
                    day: d.day,
                    dayTitle: d.dayTitle || d.region || d.day,
                    isDraft: isItemDraft(d),
                    isFieldTest: false,
                    chapters: (d.spots || []).map(sp => ({
                        id: sp.id,
                        lat: sp.lat || 35.6895,
                        lng: sp.lng || 139.6917,
                        zoom: 14,
                        title: sp.spotName || sp.id,
                        content: sp.intro || '',
                        isDraft: isItemDraft(sp)
                    }))
                }));
            }

            const mergedDays = baseDays.map((dayObj, dIdx) => {
                const itinDayObj = itinDayMapByName.get(dayObj.day) || (Array.isArray(rawItineraryData.days) ? rawItineraryData.days[dIdx] : null);
                const dayRegion = dayObj.region || itinDayObj?.region || '主要旅遊地區';
                const dayDraftFlag = isItemDraft(dayObj) || isItemDraft(itinDayObj);

                const rawChapters = (dayObj.chapters || []).map((ch, cIdx) => {
                    const matchedSpot = itinSpotMapById.get(ch.id) || itinDayObj?.spots?.[cIdx] || {};
                    const chDraftFlag = isItemDraft(ch) || isItemDraft(matchedSpot);
                    return {
                        ...ch,
                        ...matchedSpot,
                        id: ch.id || matchedSpot.id || `d${dIdx + 1}-ch${cIdx + 1}`,
                        lat: ch.lat !== undefined ? ch.lat : matchedSpot.lat,
                        lng: ch.lng !== undefined ? ch.lng : matchedSpot.lng,
                        zoom: ch.zoom || matchedSpot.zoom || 14,
                        title: ch.title || matchedSpot.spotName || '',
                        content: ch.content || matchedSpot.intro || '',
                        dayRegion: dayRegion,
                        _isDraft: chDraftFlag
                    };
                });

                // 過濾掉單一標記為草稿的章節（若開啟 ?preview=1 則保留並標示）
                const visibleChapters = isPreviewMode
                    ? rawChapters
                    : rawChapters.filter(c => !c._isDraft);

                return {
                    ...dayObj,
                    region: dayRegion,
                    _isDraft: dayDraftFlag,
                    chapters: visibleChapters
                };
            });

            // 過濾掉標記為 isDraft: true 的天數（若開啟 ?preview=1 則保留並顯示草稿標籤）
            normalizedDays = isPreviewMode
                ? mergedDays
                : mergedDays.filter(d => !d._isDraft && d.chapters.length > 0);

            initMap(normalizedDays);
            buildDayTabs();
            renderDay('ALL');
            renderPackAndBudgetViews();
            refreshInfoStation(false);

            // 支援網址 ?view= 參數（例如 ?view=itinerary 或 ?view=journal）
            const requestedView = urlParams.get('view');
            if (requestedView) {
                const targetViewId = requestedView.startsWith('view-') ? requestedView : `view-${requestedView}`;
                if (document.getElementById(targetViewId)) {
                    switchRightView(targetViewId);
                }
            }
        }).catch(error => {
            document.getElementById('itinerary-content').innerHTML = `<h2>糟糕，讀取失敗！</h2><p>${error.message}</p>`;
        });

        /* === 3. 視角切換與地圖模式控制 === */
        function switchRightView(viewId) {
            document.querySelectorAll('.view-mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-view') === viewId);
            });
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.toggle('active', sec.id === viewId);
            });
            const dayTabsEl = document.getElementById('day-tabs');
            const showDayTabs = (viewId === 'view-itinerary') || (viewId === 'view-journal' && !isWholeJournalDraft);
            dayTabsEl.style.display = showDayTabs ? 'flex' : 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchPackSubTab(panelId, btnEl) {
            document.querySelectorAll('.pack-sub-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            document.querySelectorAll('.pack-panel').forEach(p => {
                p.classList.toggle('active', p.id === panelId);
            });
        }

        function switchMapDisplayMode(mode) {
            currentMapMode = mode;
            document.getElementById('btn-map-route').classList.toggle('active', mode === 'route');
            document.getElementById('btn-map-explore').classList.toggle('active', mode === 'explore');

            if (mode === 'explore') {
                map.removeLayer(baseRouteLayer);
                map.removeLayer(activeRouteLayer);
                map.removeLayer(markersLayer);
                if (foxMarker) foxMarker.setOpacity(0);
                exploreStampsLayer.addTo(map);
            } else {
                map.removeLayer(exploreStampsLayer);
                baseRouteLayer.addTo(map);
                activeRouteLayer.addTo(map);
                markersLayer.addTo(map);
                if (foxMarker) foxMarker.setOpacity(1);
            }
        }

        /* === 4. 地圖初始化、全球交通模式判別與移動頭貼動畫 === */
        function initMap(daysData) {
            const firstCh = daysData?.[0]?.chapters?.[0];
            const startLat = firstCh?.lat || 35.6895;
            const startLng = firstCh?.lng || 139.6917;
            const startZoom = firstCh?.zoom || 7;

            map = L.map('map', { zoomControl: false }).setView([startLat, startLng], startZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            baseRouteLayer = L.layerGroup().addTo(map);
            activeRouteLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            exploreStampsLayer = L.layerGroup();
        }

        function buildAvatarInnerHTML(avatarVal) {
            if (isMediaFile(avatarVal)) {
                return `<img src="${normalizeMediaSrc(avatarVal)}" alt="旅人頭貼">`;
            }
            return avatarVal || '🦊';
        }

        function getDistanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function resolveTransportMode(currCh, distKm) {
            const raw = (currCh.transport || '').toString().trim().toLowerCase();
            const modeAliases = {
                flight: ['flight', 'airplane', 'plane', '飛機', '航班'],
                hsr: ['hsr', 'shinkansen', '高鐵', '新幹線'],
                train: ['train', 'jr', 'ktm', '火車', '台鐵', '鐵道'],
                metro: ['metro', 'mrt', 'subway', 'lrt', '捷運', '地鐵', '輕軌'],
                boat: ['boat', 'ferry', '遊船', '渡輪'],
                ropeway: ['ropeway', 'cable_car', '纜車'],
                walk: ['walk', 'foot', '步行', '散步'],
                drive: ['drive', 'car', 'taxi', '自駕', '計程車'],
                bus: ['bus', '巴士', '公車', '客運']
            };
            for (const [stdMode, aliases] of Object.entries(modeAliases)) {
                if (aliases.includes(raw)) return stdMode;
            }

            const text = `${currCh.title || ''} ${currCh.spotName || ''} ${currCh.routeFromTo || ''}`;
            if (distKm > 250 || /直飛|航班|班機|起飛|降落/.test(text)) return 'flight';
            if (/遊船|觀光船|渡輪|乘船/.test(text)) return 'boat';
            if (/纜車|山頂站/.test(text)) return 'ropeway';
            if (/新幹線|高鐵/.test(text)) return 'hsr';
            if (/JR|仙石線|奧羽本線|電鐵|Skyliner|火車|台鐵/i.test(text)) return 'train';
            if (/地鐵|捷運|Metro|MRT/i.test(text)) return 'metro';
            return distKm <= 3.5 ? 'walk' : 'bus';
        }

        function generateCurve(start, end, curvature = 0.15, segments = 32) {
            const [lat1, lng1] = start, [lat2, lng2] = end;
            const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
            const ctrlLat = midLat - (lng2 - lng1) * curvature;
            const ctrlLng = midLng + (lat2 - lat1) * curvature;

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) ** 2 * lat1 + 2 * (1 - t) * t * ctrlLat + t ** 2 * lat2;
                const lng = (1 - t) ** 2 * lng1 + 2 * (1 - t) * t * ctrlLng + t ** 2 * lng2;
                points.push([Number(lat.toFixed(5)), Number(lng.toFixed(5))]);
            }
            return points;
        }

        async function getDetailedPath(prevCh, currCh) {
            const cacheKey = `auto_v1_${prevCh.id}_to_${currCh.id}`;
            if (segmentCoordsCache[cacheKey]) return segmentCoordsCache[cacheKey];

            const start = [prevCh.lat, prevCh.lng];
            const end = [currCh.lat, currCh.lng];
            const distKm = getDistanceKm(prevCh.lat, prevCh.lng, currCh.lat, currCh.lng);
            const mode = resolveTransportMode(currCh, distKm);

            if (CURVE_MODES[mode] !== undefined || distKm > 250) {
                const curv = CURVE_MODES[mode] ?? 0.22;
                const arcCoords = generateCurve(start, end, curv, 36);
                segmentCoordsCache[cacheKey] = arcCoords;
                return arcCoords;
            }

            const saved = localStorage.getItem(cacheKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                segmentCoordsCache[cacheKey] = parsed;
                return parsed;
            }

            try {
                const profile = mode === 'walk' ? 'foot' : 'driving';
                const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${prevCh.lng},${prevCh.lat};${currCh.lng},${currCh.lat}?overview=full&geometries=geojson`;
                const res = await fetch(osrmUrl);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes?.length > 0) {
                    const roadCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    segmentCoordsCache[cacheKey] = roadCoords;
                    try { localStorage.setItem(cacheKey, JSON.stringify(roadCoords)); } catch (e) {}
                    return roadCoords;
                }
            } catch (e) {}

            const fallbackCoords = generateCurve(start, end, 0.05, 24);
            segmentCoordsCache[cacheKey] = fallbackCoords;
            return fallbackCoords;
        }

        function drawActiveArrowRoute(coords) {
            activeRouteLayer.clearLayers();
            if (!coords || coords.length < 2) return;

            L.polyline(coords, {
                color: '#a6897c', weight: 3.5, opacity: 0.9, dashArray: '6, 8'
            }).addTo(activeRouteLayer);

            const arrowCount = Math.min(7, Math.max(2, Math.floor(coords.length / 6)));
            for (let k = 1; k <= arrowCount; k++) {
                const idx = Math.min(coords.length - 1, Math.floor((k / (arrowCount + 1)) * coords.length));
                const p1 = coords[idx - 1], p2 = coords[idx];
                if (!p1 || !p2) continue;

                const angleDeg = Math.atan2(p2[0] - p1[0], p2[1] - p1[1]) * (180 / Math.PI);
                const arrowIcon = L.divIcon({
                    className: 'route-arrow-icon',
                    html: `<div class="route-arrow-inner" style="transform: rotate(${-angleDeg}deg);">❯</div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });
                L.marker([(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2], {
                    icon: arrowIcon, interactive: false
                }).addTo(activeRouteLayer);
            }
        }

        function animateFoxAlongPath(coords, targetZoom) {
            if (foxAnimFrame) cancelAnimationFrame(foxAnimFrame);
            if (!coords || coords.length === 0) return;

            if (!foxMarker) {
                const foxIcon = L.divIcon({
                    className: 'fox-traveler-icon',
                    html: `<div class="fox-wrapper" id="fox-avatar">${buildAvatarInnerHTML(currentTripAvatar)}</div>`,
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                foxMarker = L.marker(coords[0], { icon: foxIcon, zIndexOffset: 2000 }).addTo(map);
            } else {
                foxMarker.setLatLng(coords[0]);
            }

            if (coords.length === 1) {
                map.flyTo(coords[0], targetZoom || 14, { animate: true, duration: 1.2 });
                return;
            }

            const cumDist = [0];
            let totalDist = 0;
            for (let i = 1; i < coords.length; i++) {
                totalDist += Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]);
                cumDist.push(totalDist);
            }

            if (totalDist === 0) {
                foxMarker.setLatLng(coords[coords.length - 1]);
                map.flyTo(coords[coords.length - 1], targetZoom || 14, { animate: true, duration: 1.0 });
                return;
            }

            map.flyToBounds(L.latLngBounds(coords), { padding: [70, 70], maxZoom: targetZoom || 15, animate: true, duration: 0.7 });

            const foxEl = document.getElementById('fox-avatar');
            if (foxEl) foxEl.classList.add('walking');

            const duration = 1900;
            const startTime = performance.now();

            function step(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                const targetD = eased * totalDist;

                let segIdx = 0;
                while (segIdx < cumDist.length - 2 && cumDist[segIdx + 1] < targetD) segIdx++;

                const segStartD = cumDist[segIdx];
                const segLen = cumDist[segIdx + 1] - segStartD;
                const ratio = segLen > 0 ? (targetD - segStartD) / segLen : 0;

                const p1 = coords[segIdx], p2 = coords[segIdx + 1];
                foxMarker.setLatLng([
                    p1[0] + (p2[0] - p1[0]) * ratio,
                    p1[1] + (p2[1] - p1[1]) * ratio
                ]);

                const avatar = document.getElementById('fox-avatar');
                if (avatar && Math.abs(p2[1] - p1[1]) > 0.00001) {
                    avatar.style.transform = `scaleX(${(p2[1] - p1[1]) < 0 ? 1 : -1})`;
                }

                if (progress < 1) {
                    foxAnimFrame = requestAnimationFrame(step);
                } else {
                    if (avatar) avatar.classList.remove('walking');
                    map.flyTo(coords[coords.length - 1], targetZoom || 15, { animate: true, duration: 0.9 });
                }
            }

            foxAnimFrame = requestAnimationFrame(step);
        }

        async function transitionToChapter(newIndex) {
            const targetCh = currentChaptersList[newIndex];
            if (!targetCh?.lat || !targetCh?.lng) return;

            if (newIndex !== currentActiveIndex && Math.abs(newIndex - currentActiveIndex) === 1) {
                const fromCh = currentChaptersList[currentActiveIndex];
                const isForward = newIndex > currentActiveIndex;
                const rawPath = await getDetailedPath(isForward ? fromCh : targetCh, isForward ? targetCh : fromCh);
                const moveCoords = isForward ? rawPath : [...rawPath].reverse();

                drawActiveArrowRoute(moveCoords);
                animateFoxAlongPath(moveCoords, targetCh.zoom || 14);
            } else {
                activeRouteLayer.clearLayers();
                if (newIndex > 0) {
                    const prevCh = currentChaptersList[newIndex - 1];
                    const pathCoords = await getDetailedPath(prevCh, targetCh);
                    drawActiveArrowRoute(pathCoords);
                }
                animateFoxAlongPath([[targetCh.lat, targetCh.lng]], targetCh.zoom || 14);
            }

            currentActiveIndex = newIndex;
        }

        /* === 5. 多媒體畫廊、預訂按鈕與燈箱功能 === */
        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            const clean = str.trim();
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|heic|mp4|mov|m4v|webm)$/i.test(clean) ||
                   clean.includes('media/') || clean.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|m4v|webm)$/i.test((str || '').trim());
        }

        function normalizeMediaSrc(rawSrc) {
            let s = (rawSrc || '').trim().replace(/^\/+/, '');
            if (!s) return '';
            if (!s.includes('/') && !s.startsWith('http')) {
                return `media/${tripId}/${s}`;
            }
            return s;
        }

        function buildMediaHTML(ch, chIndex) {
            const items = [];
            if (isMediaFile(ch.mediaPlaceholder)) {
                items.push({ src: normalizeMediaSrc(ch.mediaPlaceholder), caption: '' });
            }
            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const rawSrc = typeof item === 'string' ? item : (item?.src || item?.file || item?.url || '');
                    const caption = typeof item === 'object' && item?.caption ? item.caption : '';
                    if (isMediaFile(rawSrc)) {
                        items.push({ src: normalizeMediaSrc(rawSrc), caption });
                    }
                });
            }
            ch._mediaItems = items;

            if (items.length === 0) {
                return ch.mediaPlaceholder ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>` : '';
            }

            const layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length <= 4) layoutClass = `layout-auto-${items.length}`;
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map((item, itemIdx) => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata" onclick="openLightbox(${chIndex}, ${itemIdx})"></video>
                            <button type="button" class="replay-btn" onclick="event.stopPropagation(); replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>`;
                }
                return `
                    <div class="media-item">
                        <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox(${chIndex}, ${itemIdx})">
                        ${captionHTML}
                    </div>`;
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        function buildAffiliateHTML(ch) {
            const links = [];
            if (ch.affiliateUrl && ch.affiliateUrl.trim() !== '') {
                links.push({
                    text: (ch.affiliateText && ch.affiliateText.trim() !== '')
                        ? ch.affiliateText.trim()
                        : '🔗 查看同款行程與最新優惠',
                    url: ch.affiliateUrl.trim()
                });
            }
            if (Array.isArray(ch.affiliateLinks)) {
                ch.affiliateLinks.forEach(item => {
                    if (item && item.url && item.url.trim() !== '') {
                        links.push({
                            text: (item.text && item.text.trim() !== '')
                                ? item.text.trim()
                                : '🔗 查看同款行程與最新優惠',
                            url: item.url.trim()
                        });
                    }
                });
            }
            if (links.length === 0) return '';

            const buttonsHTML = links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener sponsored" class="affiliate-btn">
                    <span>${link.text}</span>
                    <span class="arrow-icon">↗</span>
                </a>
            `).join('');

            return `<div class="affiliate-container">${buttonsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) { video.currentTime = 0; video.play(); }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.45 });

            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        function openLightbox(chIndex, itemIdx = 0) {
            const ch = currentChaptersList[chIndex];
            if (!ch || !Array.isArray(ch._mediaItems) || ch._mediaItems.length === 0) return;
            lightboxItems = ch._mediaItems;
            lightboxIndex = itemIdx;
            updateLightboxContent();
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        function updateLightboxContent() {
            const item = lightboxItems[lightboxIndex];
            if (!item) return;

            const imgEl = document.getElementById('lightbox-img');
            const videoEl = document.getElementById('lightbox-video');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            const infoEl = document.getElementById('lightbox-info');

            const hasMultiple = lightboxItems.length > 1;
            prevBtn.style.display = hasMultiple ? 'flex' : 'none';
            nextBtn.style.display = hasMultiple ? 'flex' : 'none';

            const countText = `${lightboxIndex + 1} / ${lightboxItems.length}`;
            infoEl.textContent = item.caption ? `${countText} ｜ ${item.caption}` : countText;
            infoEl.style.display = (hasMultiple || item.caption) ? 'block' : 'none';

            if (isVideoFile(item.src)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = 'block';
                videoEl.src = item.src;
                videoEl.currentTime = 0;
                videoEl.play().catch(() => {});
            } else {
                videoEl.pause();
                videoEl.style.display = 'none';
                videoEl.src = '';
                imgEl.style.display = 'block';
                imgEl.src = item.src;
            }
        }

        function stepLightbox(dir) {
            if (lightboxItems.length <= 1) return;
            lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
            updateLightboxContent();
        }

        function handleOverlayClick() {
            if (justSwiped) return;
            closeLightbox();
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightbox-overlay');
            const videoEl = document.getElementById('lightbox-video');
            videoEl.pause();
            videoEl.src = '';
            overlay.style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('lightbox-overlay');
            if (!overlay || overlay.style.display !== 'flex') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepLightbox(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
            else if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
        });

        const lightboxOverlayEl = document.getElementById('lightbox-overlay');
        lightboxOverlayEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        lightboxOverlayEl.addEventListener('touchend', (e) => {
            if (lightboxItems.length <= 1 || e.changedTouches.length === 0) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
                justSwiped = true;
                setTimeout(() => { justSwiped = false; }, 300);
                if (dx < 0) stepLightbox(1);
                else stepLightbox(-1);
            }
        }, { passive: true });

        /* ==============================================================
           6. 萬用章節解析器 (優先讀取 itinerary/*.json 欄位，未填時自動提供通用備援)
           ============================================================== */
        function stripHtmlText(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return (div.textContent || div.innerText || '').trim();
        }

        function alignToNextDepartureTime(rawTimeStr, fallbackTime = '09:30') {
            if (!rawTimeStr) return fallbackTime;
            const match = rawTimeStr.match(/(\d{1,2}):(\d{2})/);
            if (!match) return rawTimeStr;
            return `${String(parseInt(match[1], 10)).padStart(2, '0')}:${match[2]}`;
        }

        function classifyChapterMeta(ch, idxInDay, prevCh) {
            const rawTitle = ch.title || '';
            const cleanFromTitle = rawTitle.replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '').trim();
            const pureName = (ch.spotName && ch.spotName.trim() !== '') ? ch.spotName.trim() : cleanFromTitle;

            const defaultHours = ['08:30', '10:30', '12:30', '14:30', '16:30', '18:30', '20:30'];
            const timeStr = ch.time || defaultHours[Math.min(idxInDay, defaultHours.length - 1)];
            const categoryLabel = ch.categoryLabel || '經典必訪';

            // 尋訪印章判定 (景 / 食 / 住 / 驛)
            let stampChar = '景';
            let stampClass = 'spot';
            if (categoryLabel.includes('住宿') || /飯店|住宿|御宿野乃|Hotel|APA/i.test(pureName)) {
                stampChar = '住';
                stampClass = 'hotel';
            } else if (ch.isFood || categoryLabel.includes('美饌') || /餐廳|料理|牛たん|牛舌|燒肉|真都|平田牧場|五十番|伊豆の華|音茶屋|山頭火|民福|謝朋殿|肉の|カフェ|咖啡/i.test(pureName)) {
                stampChar = '食';
                stampClass = 'food';
            } else if (categoryLabel.includes('交通') || /機場|新幹線|車站|轉乘|Skyliner/i.test(pureName)) {
                stampChar = '驛';
                stampClass = 'transit';
            }

            // 景點介紹與注意事項
            const introText = (ch.intro && ch.intro.trim() !== '')
                ? ch.intro.trim()
                : `【${pureName}】為本段行程之重要參訪據點（座標：${Number(ch.lat).toFixed(4)}, ${Number(ch.lng).toFixed(4)}）。建議搭配左側互動地圖確認周邊動線與停留時間。`;

            const noteText = (ch.note && ch.note.trim() !== '')
                ? ch.note.trim()
                : `• 出發前建議確認【${pureName}】之最新官方營業時間與公休日。\n• 若涉及門票、交通票券或熱門時段入場，建議提前完成預約並預留轉乘緩衝時間。`;

            // 交通段次與時刻表資訊
            let transitInfo = null;
            const hasExplicitTransit = Boolean(ch.routeFromTo || ch.transitMins !== undefined || ch.transitCost !== undefined);
            if ((prevCh && prevCh.lat && prevCh.lng && ch.lat && ch.lng) || hasExplicitTransit) {
                const distKm = (prevCh && prevCh.lat && ch.lat) ? getDistanceKm(prevCh.lat, prevCh.lng, ch.lat, ch.lng) : 10;
                const mode = resolveTransportMode(ch, distKm);
                const modeMap = {
                    flight: { icon: '✈️', name: '國際航班', mins: 210, cost: 8500 },
                    hsr:    { icon: '🚄', name: '高速鐵路／新幹線', mins: Math.max(45, Math.round(distKm * 0.45)), cost: Math.round(distKm * 32) },
                    train:  { icon: '🚃', name: '鐵道列車', mins: Math.max(20, Math.round(distKm * 1.1)), cost: Math.max(240, Math.round(distKm * 22)) },
                    metro:  { icon: '🚇', name: '地鐵／捷運', mins: 18, cost: 210 },
                    ropeway:{ icon: '🚡', name: '山岳纜車', mins: 20, cost: 3800 },
                    boat:   { icon: '⛴️', name: '觀光遊船', mins: 50, cost: 1500 },
                    bus:    { icon: '🚌', name: '路線／高速巴士', mins: Math.max(20, Math.round(distKm * 1.6)), cost: Math.max(500, Math.round(distKm * 45)) },
                    drive:  { icon: '🚕', name: '計程車／專車', mins: Math.max(15, Math.round(distKm * 1.3)), cost: Math.max(1200, Math.round(distKm * 300)) },
                    walk:   { icon: '🚶', name: '漫步前往', mins: Math.max(5, Math.round(distKm * 12)), cost: 0 }
                };
                const picked = modeMap[mode] || modeMap.bus;
                const prevPure = prevCh ? (prevCh.spotName || (prevCh.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '')).trim() : '起始站';
                const routeText = (ch.routeFromTo && ch.routeFromTo.trim() !== '') ? ch.routeFromTo.trim() : `${prevPure} → ${pureName}`;
                const alignedClock = alignToNextDepartureTime(timeStr);

                transitInfo = {
                    mode,
                    icon: picked.icon,
                    modeName: picked.name,
                    routeText,
                    alignedClock,
                    timeRange: ch.scheduleTime || `${alignedClock} 發車`,
                    seatType: ch.seatType || ((mode === 'hsr' || mode === 'flight') ? '💺 對號指定席' : '🚌 依班次運行'),
                    mins: ch.transitMins !== undefined ? Number(ch.transitMins) : picked.mins,
                    cost: ch.transitCost !== undefined ? Number(ch.transitCost) : picked.cost,
                    timetableUrl: ch.timetableUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pureName)}`,
                    timetableLabel: ch.timetableLabel || '查看時刻表與路線'
                };
            }

            // 美食紀錄與預約潛規則
            const isFoodSpot = Boolean(ch.isFood || stampChar === '食');
            const foodReview = (ch.foodReview && ch.foodReview.trim() !== '')
                ? ch.foodReview.trim()
                : `🤖 【AI 美味預覽（用餐後可從後台更新）】「${pureName}」匯聚在地代表性風味料理與嚴選食材，待實際品嚐後可直接從 /admin/ 後台更新您的實測心得！`;
            const foodPolicy = (ch.foodPolicy && ch.foodPolicy.trim() !== '')
                ? ch.foodPolicy.trim()
                : `• 建議留意熱門時段是否需事先預約、店內是否設有每人低消一份餐點或飲品規定，以及現場支援之支付方式。`;

            return {
                stampChar,
                stampClass,
                pureName,
                categoryLabel,
                timeStr,
                transitInfo,
                introText,
                noteText,
                isFoodSpot,
                foodReview,
                foodPolicy
            };
        }
