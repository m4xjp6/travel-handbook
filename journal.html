        /* === 8. 多媒體畫廊、預訂按鈕與燈箱功能 === */
        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            const clean = str.trim();
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|heic|mp4|mov|m4v|webm)$/i.test(clean) ||
                   clean.includes('media/') || clean.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|m4v|webm)$/i.test((str || '').trim());
        }

        function normalizeMediaSrc(rawSrc) {
            let s = (rawSrc || '').trim().replace(/^\/+/, '');
            if (!s) return '';
            if (!s.includes('/') && !s.startsWith('http')) {
                return `media/${tripId}/${s}`;
            }
            return s;
        }

        function buildMediaHTML(ch, chIndex) {
            const items = [];
            if (isMediaFile(ch.mediaPlaceholder)) {
                items.push({ src: normalizeMediaSrc(ch.mediaPlaceholder), caption: '' });
            }
            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const rawSrc = typeof item === 'string' ? item : (item?.src || item?.file || item?.url || '');
                    const caption = typeof item === 'object' && item?.caption ? item.caption : '';
                    if (isMediaFile(rawSrc)) {
                        items.push({ src: normalizeMediaSrc(rawSrc), caption });
                    }
                });
            }
            ch._mediaItems = items;

            if (items.length === 0) {
                return ch.mediaPlaceholder ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>` : '';
            }

            const layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length <= 4) layoutClass = `layout-auto-${items.length}`;
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map((item, itemIdx) => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata" onclick="openLightbox(${chIndex}, ${itemIdx})"></video>
                            <button type="button" class="replay-btn" onclick="event.stopPropagation(); replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>`;
                }
                return `
                    <div class="media-item">
                        <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox(${chIndex}, ${itemIdx})">
                        ${captionHTML}
                    </div>`;
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        function buildAffiliateHTML(ch) {
            const links = [];
            if (ch.affiliateUrl && ch.affiliateUrl.trim() !== '') {
                links.push({
                    text: (ch.affiliateText && ch.affiliateText.trim() !== '')
                        ? ch.affiliateText.trim()
                        : '🔗 查看同款行程與最新優惠',
                    url: ch.affiliateUrl.trim()
                });
            }
            if (Array.isArray(ch.affiliateLinks)) {
                ch.affiliateLinks.forEach(item => {
                    if (item && item.url && item.url.trim() !== '') {
                        links.push({
                            text: (item.text && item.text.trim() !== '')
                                ? item.text.trim()
                                : '🔗 查看同款行程與最新優惠',
                            url: item.url.trim()
                        });
                    }
                });
            }
            if (links.length === 0) return '';

            const buttonsHTML = links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener sponsored" class="affiliate-btn">
                    <span>${link.text}</span>
                    <span class="arrow-icon">↗</span>
                </a>
            `).join('');

            return `<div class="affiliate-container">${buttonsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) {
                video.currentTime = 0;
                video.play();
            }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.45 });

            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        function openLightbox(chIndex, itemIdx = 0) {
            const ch = currentChaptersList[chIndex];
            if (!ch || !Array.isArray(ch._mediaItems) || ch._mediaItems.length === 0) return;

            lightboxItems = ch._mediaItems;
            lightboxIndex = itemIdx;
            updateLightboxContent();
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        function updateLightboxContent() {
            const item = lightboxItems[lightboxIndex];
            if (!item) return;

            const imgEl = document.getElementById('lightbox-img');
            const videoEl = document.getElementById('lightbox-video');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            const infoEl = document.getElementById('lightbox-info');

            const hasMultiple = lightboxItems.length > 1;
            prevBtn.style.display = hasMultiple ? 'flex' : 'none';
            nextBtn.style.display = hasMultiple ? 'flex' : 'none';

            const countText = `${lightboxIndex + 1} / ${lightboxItems.length}`;
            infoEl.textContent = item.caption ? `${countText} ｜ ${item.caption}` : countText;
            infoEl.style.display = (hasMultiple || item.caption) ? 'block' : 'none';

            if (isVideoFile(item.src)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = 'block';
                videoEl.src = item.src;
                videoEl.currentTime = 0;
                videoEl.play().catch(() => {});
            } else {
                videoEl.pause();
                videoEl.style.display = 'none';
                videoEl.src = '';
                imgEl.style.display = 'block';
                imgEl.src = item.src;
            }
        }

        function stepLightbox(dir) {
            if (lightboxItems.length <= 1) return;
            lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
            updateLightboxContent();
        }

        function handleOverlayClick() {
            if (justSwiped) return;
            closeLightbox();
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightbox-overlay');
            const videoEl = document.getElementById('lightbox-video');
            videoEl.pause();
            videoEl.src = '';
            overlay.style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('lightbox-overlay');
            if (!overlay || overlay.style.display !== 'flex') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepLightbox(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
            else if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
        });

        const lightboxOverlayEl = document.getElementById('lightbox-overlay');
        lightboxOverlayEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        lightboxOverlayEl.addEventListener('touchend', (e) => {
            if (lightboxItems.length <= 1 || e.changedTouches.length === 0) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
                justSwiped = true;
                setTimeout(() => { justSwiped = false; }, 300);
                if (dx < 0) stepLightbox(1);
                else stepLightbox(-1);
            }
        }, { passive: true });

        /* ==============================================================
           9. 輔助解析器：自動推算站點分類、時間、車資與景點介紹摘要
           ============================================================== */
        function stripHtmlText(html) {
            const div = document.createElement('div');
            div.innerHTML = html || '';
            return (div.textContent || div.innerText || '').trim();
        }

        function classifyChapterMeta(ch, idxInDay, prevCh) {
            const title = ch.title || '';
            const plain = stripHtmlText(ch.content || '');
            const combined = `${title} ${plain}`;

            // 1. 判定印章與分類標籤
            let stampChar = '景';
            let stampClass = 'spot';
            let categoryLabel = ch.categoryLabel || '經典必訪';

            if (/飯店|住宿|御宿野乃|Hotel|泡湯/i.test(title) && !/五十番/.test(title)) {
                stampChar = '住';
                stampClass = 'hotel';
                categoryLabel = ch.categoryLabel || '溫泉住宿';
            } else if (/午餐|晚餐|料理|牛たん|牛舌|燒肉|真都|平田牧場|五十番|伊豆の華|音茶屋|カフェ|咖啡|甜點/i.test(title)) {
                stampChar = '食';
                stampClass = 'food';
                categoryLabel = ch.categoryLabel || '在地美饌';
            } else if (/機場|新幹線|車站|轉乘|啟程|賦歸|Skyliner/i.test(title)) {
                stampChar = '驛';
                stampClass = 'transit';
                categoryLabel = ch.categoryLabel || '交通樞紐';
            } else if (/神社|八幡宮|山寺|立石寺|瑞巖寺|円通院|五大堂|瑞鳳殿/i.test(title)) {
                categoryLabel = ch.categoryLabel || '歷史古剎';
            } else if (/樹冰|藏王|銀山|松島|狐狸村|鐵塔|展望台/i.test(title)) {
                categoryLabel = ch.categoryLabel || '名勝絕景';
            }

            // 2. 推算時間 (若 JSON 有 ch.time 則優先使用)
            const defaultHours = ['09:00', '11:00', '12:30', '14:30', '16:30', '18:30', '20:30'];
            const timeStr = ch.time || defaultHours[Math.min(idxInDay, defaultHours.length - 1)];

            // 3. 推算與上一站的移動時間與車資
            let transitInfo = null;
            if (prevCh && prevCh.lat && prevCh.lng && ch.lat && ch.lng) {
                const distKm = getDistanceKm(prevCh.lat, prevCh.lng, ch.lat, ch.lng);
                const mode = resolveTransportMode(ch, distKm);
                const modeMap = {
                    flight: { icon: '✈️', name: '航班飛行', mins: 210, cost: 8500 },
                    hsr:    { icon: '🚄', name: '新幹線', mins: Math.max(45, Math.round(distKm * 0.45)), cost: Math.round(distKm * 32) },
                    train:  { icon: '🚃', name: 'JR／電車', mins: Math.max(20, Math.round(distKm * 1.1)), cost: Math.max(240, Math.round(distKm * 22)) },
                    metro:  { icon: '🚇', name: '地鐵移動', mins: 18, cost: 210 },
                    ropeway:{ icon: '🚡', name: '山岳纜車', mins: 20, cost: 3800 },
                    boat:   { icon: '⛴️', name: '觀光遊船', mins: 50, cost: 1500 },
                    bus:    { icon: '🚌', name: '路線巴士／接駁', mins: Math.max(20, Math.round(distKm * 1.6)), cost: Math.max(500, Math.round(distKm * 45)) },
                    drive:  { icon: '🚕', name: '計程車／自駕', mins: Math.max(15, Math.round(distKm * 1.3)), cost: Math.max(1200, Math.round(distKm * 300)) },
                    walk:   { icon: '🚶', name: '漫步前往', mins: Math.max(6, Math.round(distKm * 12)), cost: 0 }
                };
                const picked = modeMap[mode] || modeMap.bus;
                const prevClean = (prevCh.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                const currClean = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                transitInfo = {
                    icon: picked.icon,
                    modeName: picked.name,
                    routeText: `${prevClean.slice(0, 8)} → ${currClean.slice(0, 8)}`,
                    mins: ch.transitMins !== undefined ? Number(ch.transitMins) : picked.mins,
                    cost: ch.transitCost !== undefined ? Number(ch.transitCost) : picked.cost
                };
            }

            // 4. 萃取「景點介紹／攻略備註」文字（優先讀 ch.intro，若無則結合內文與提示框）
            const introText = ch.intro || plain;

            return { stampChar, stampClass, categoryLabel, timeStr, transitInfo, introText };
        }

        /* === 10. 渲染日記內容、行程手風琴卡與地圖節點 === */
        function setActiveChapter(activeSection, activeMarker) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            if (activeSection) activeSection.classList.add('active');

            document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('active'));
            const marker = activeMarker || chapterMarkers.get(activeSection);
            if (marker?.getElement()) {
                marker.getElement().classList.add('active');
            }
        }

        function jumpToJournalChapter(chIndex, sectionId) {
            switchRightView('view-journal');
            setTimeout(() => {
                const sec = document.getElementById(sectionId);
                if (sec) {
                    setActiveChapter(sec);
                    transitionToChapter(chIndex);
                    const topNav = document.querySelector('.top-nav');
                    const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                    const targetY = window.pageYOffset + sec.getBoundingClientRect().top - navBottom - 20;
                    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                }
            }, 80);
        }

        function focusSpotOnMap(chIndex) {
            transitionToChapter(chIndex);
        }

        function renderDay(dayKey) {
            const contentDiv = document.getElementById('content');
            const itinDiv = document.getElementById('itinerary-content');
            contentDiv.innerHTML = '';
            itinDiv.innerHTML = '';
            if (observer) observer.disconnect();

            markersLayer.clearLayers();
            baseRouteLayer.clearLayers();
            activeRouteLayer.clearLayers();
            exploreStampsLayer.clearLayers();
            chapterMarkers.clear();

            const dotIcon = L.divIcon({
                className: 'custom-marker',
                html: '<div class="marker-dot"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            currentChaptersList = [];
            currentActiveIndex = 0;
            const simpleLatLngs = [];
            let spotCount = 0;
            let hotelCount = 0;

            const daysToRender = dayKey === 'ALL'
                ? normalizedDays
                : normalizedDays.filter(d => d.day === dayKey);

            daysToRender.forEach(dayObj => {
                // --- A. 渲染原本的「遊記圖文」視角 ---
                const banner = document.createElement('div');
                banner.className = 'day-banner';
                const fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';
                banner.innerHTML = `
                    <div class="day-banner-header">
                        <div class="day-badge">${dayObj.day}</div>
                        ${fieldTestBadgeHTML}
                    </div>
                    <h1>${dayObj.dayTitle || dayObj.day}</h1>
                `;
                contentDiv.appendChild(banner);

                // --- B. 準備「行程＆景點介紹」視角的單日容器 (復刻附圖三) ---
                let dayTotalTransitMins = 0;
                let dayTotalTransitCost = 0;
                const dayItinCardsHTML = [];
                const cleanSpotNames = [];

                (dayObj.chapters || []).forEach((ch, idxInDay) => {
                    const chIndex = currentChaptersList.length;
                    currentChaptersList.push(ch);

                    const prevCh = idxInDay > 0 ? dayObj.chapters[idxInDay - 1] : null;
                    const meta = classifyChapterMeta(ch, idxInDay, prevCh);

                    if (meta.stampChar === '住') hotelCount++;
                    else spotCount++;

                    const cleanTitle = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                    cleanSpotNames.push(cleanTitle);

                    // 1. 建立遊記章節卡片
                    const section = document.createElement('section');
                    section.className = `chapter ${chIndex === 0 ? 'active' : ''}`;
                    section.id = `section-${ch.id}`;
                    section.setAttribute('data-index', chIndex);
                    section.innerHTML = `
                        <h2>${ch.title}</h2>
                        ${buildMediaHTML(ch, chIndex)}
                        <div class="chapter-body">${ch.content || ''}</div>
                        ${buildAffiliateHTML(ch)}
                    `;
                    contentDiv.appendChild(section);

                    // 2. 累積交通時間與花費，並建立點對點交通列 + 景點介紹手風琴卡
                    if (meta.transitInfo && meta.transitInfo.mins < 180) {
                        dayTotalTransitMins += meta.transitInfo.mins;
                        dayTotalTransitCost += meta.transitInfo.cost;
                        dayItinCardsHTML.push(`
                            <div class="itin-transit-row">
                                <div class="itin-transit-left">
                                    <span class="itin-transit-icon">${meta.transitInfo.icon}</span>
                                    <span>${meta.transitInfo.modeName}｜${meta.transitInfo.routeText}</span>
                                </div>
                                <div class="itin-transit-right">
                                    ${meta.transitInfo.mins} 分 &nbsp; ¥${meta.transitInfo.cost.toLocaleString()}
                                </div>
                            </div>
                        `);
                    }

                    const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanTitle)}&query_place_id=${ch.lat},${ch.lng}`;
                    const isFirstOpen = idxInDay === 0 ? 'open' : '';

                    dayItinCardsHTML.push(`
                        <div class="spot-intro-card ${isFirstOpen}" id="itin-card-${ch.id}">
                            <div class="spot-card-header" onclick="this.parentElement.classList.toggle('open'); focusSpotOnMap(${chIndex});">
                                <div class="spot-header-left">
                                    <span class="spot-time-box">${meta.timeStr}</span>
                                    <span class="spot-cat-pill">${meta.categoryLabel}</span>
                                    <span class="spot-title-text">${cleanTitle}</span>
                                </div>
                                <span class="spot-toggle-arrow">▶</span>
                            </div>
                            <div class="spot-card-body">
                                <div class="spot-intro-label">簡介／攻略備註</div>
                                <div class="spot-intro-text">${meta.introText}</div>
                                <div class="spot-action-pills">
                                    <a href="${gmapUrl}" target="_blank" rel="noopener" class="spot-pill-btn">🗺️ Google 地圖導航</a>
                                    <button type="button" class="spot-pill-btn loc" onclick="focusSpotOnMap(${chIndex})">📍 定位至左側地圖</button>
                                    <button type="button" class="spot-pill-btn loc" onclick="jumpToJournalChapter(${chIndex}, 'section-${ch.id}')">📖 閱讀實拍遊記與照片</button>
                                </div>
                                ${buildAffiliateHTML(ch)}
                            </div>
                        </div>
                    `);

                    // 3. 建立地圖圓點標記 (路線模式) 與 東方方章標記 (尋訪模式)
                    if (ch.lat && ch.lng) {
                        simpleLatLngs.push([ch.lat, ch.lng]);
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);

                        marker.bindTooltip(`${dayObj.day}｜${ch.title}`, {
                            direction: 'top',
                            offset: [0, -10],
                            className: 'marker-tooltip'
                        });

                        marker.on('click', () => {
                            isClickScrolling = true;
                            clearTimeout(scrollUnlockTimer);
                            setActiveChapter(section, marker);
                            transitionToChapter(chIndex);

                            const journalView = document.getElementById('view-journal');
                            if (journalView.classList.contains('active')) {
                                const topNav = document.querySelector('.top-nav');
                                const navBottom = topNav ? topNav.getBoundingClientRect().bottom : 0;
                                const targetY = window.pageYOffset + section.getBoundingClientRect().top - navBottom - 20;
                                window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                            } else {
                                const itinCard = document.getElementById(`itin-card-${ch.id}`);
                                if (itinCard) {
                                    itinCard.classList.add('open');
                                    itinCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }
                            scrollUnlockTimer = setTimeout(() => { isClickScrolling = false; }, 950);
                        });

                        chapterMarkers.set(section, marker);

                        // 尋訪模式印章標記
                        const stampIcon = L.divIcon({
                            className: 'stamp-marker',
                            html: `<div class="stamp-box ${meta.stampClass}">${meta.stampChar}</div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        });
                        const stampMarker = L.marker([ch.lat, ch.lng], { icon: stampIcon }).addTo(exploreStampsLayer);
                        stampMarker.bindTooltip(`[${meta.stampChar}] ${cleanTitle}`, {
                            direction: 'top',
                            offset: [0, -12],
                            className: 'marker-tooltip'
                        });
                        stampMarker.on('click', () => marker.fire('click'));
                    }
                });

                // 組裝當日「行程＆景點介紹」區塊
                const hours = Math.floor(dayTotalTransitMins / 60);
                const mins = dayTotalTransitMins % 60;
                const timeSumStr = hours > 0 ? `${hours} 時 ${mins} 分` : `${mins} 分`;

                const dayItinBlock = document.createElement('div');
                dayItinBlock.className = 'itinerary-day-block';
                dayItinBlock.innerHTML = `
                    <div class="itin-day-header">
                        <h3 class="itin-day-title">${dayObj.day}｜${dayObj.dayTitle || ''}</h3>
                        <div class="itin-day-sub">
                            <span>📅 ${ cleanSpotNames.slice(0, 4).join(' · ') }</span>
                        </div>
                    </div>
                    <div class="itin-summary-box">
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">當日區域移動時間</div>
                            <div class="itin-sum-val">${timeSumStr}</div>
                        </div>
                        <div class="itin-sum-col">
                            <div class="itin-sum-label">預估區域交通花費</div>
                            <div class="itin-sum-val cost">¥${dayTotalTransitCost.toLocaleString()}</div>
                        </div>
                    </div>
                    ${dayItinCardsHTML.join('')}
                `;
                itinDiv.appendChild(dayItinBlock);
            });

            // 更新地圖左上角統計膠囊
            document.getElementById('map-stats-pill').textContent = `${daysToRender.length} 日行跡・${spotCount} 處尋訪・${hotelCount} 處住宿`;

            if (simpleLatLngs.length > 1) {
                L.polyline(simpleLatLngs, {
                    color: '#C4A99E', weight: 2, opacity: 0.45, dashArray: '5, 10'
                }).addTo(baseRouteLayer);
            }

            if (currentChaptersList.length > 0) {
                setActiveChapter(document.querySelector('.chapter'));
                transitionToChapter(0);
            }

            observer = new IntersectionObserver((entries) => {
                if (isClickScrolling) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chapter = entry.target;
                        const newIdx = parseInt(chapter.getAttribute('data-index'), 10);
                        setActiveChapter(chapter);
                        if (!isNaN(newIdx)) transitionToChapter(newIdx);
                    }
                });
            }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });

            document.querySelectorAll('.chapter').forEach(chapter => observer.observe(chapter));
            initVideoAutoplay();
        }

        /* ==============================================================
           11. 📡 資訊情報站引擎 (即時氣象 API + 重新整理按鈕 + 雷達與剪報)
           ============================================================== */
        async function refreshInfoStation(isManualClick = false) {
            const refreshBtn = document.getElementById('btn-refresh-info');
            if (refreshBtn && isManualClick) {
                refreshBtn.textContent = '↻ 連線更新中...';
            }

            document.getElementById('info-trip-code').textContent = `${tripId.toUpperCase()} ・ 旅の速報`;
            document.getElementById('info-station-title').textContent = `${(rawTripData.tripTitle || '旅途').split('｜').pop().trim()}情報手帳`;

            const now = new Date();
            const timeStr = new Intl.DateTimeFormat('zh-TW', {
                timeZone: 'Asia/Tokyo',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).format(now);
            document.getElementById('info-update-time').textContent = `更新：日本時間 ${timeStr}`;

            // 為每一天取代表座標並呼叫 Open-Meteo 抓取即時溫度、降雨機率與最大風速
            const dayRepresentativeCoords = normalizedDays.map((d, idx) => {
                const validChs = (d.chapters || []).filter(c => c.lat && c.lng && c.lat > 26);
                const picked = validChs[Math.floor(validChs.length / 2)] || d.chapters?.[0] || { lat: 38.2682, lng: 140.8694, title: d.day };
                const cleanLoc = (picked.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '').slice(0, 6);
                return {
                    dayKey: d.day,
                    dayCode: `D${String(idx + 1).padStart(2, '0')}`,
                    dayTitle: d.dayTitle || d.day,
                    locName: cleanLoc,
                    lat: picked.lat,
                    lng: picked.lng
                };
            });

            await Promise.all(dayRepresentativeCoords.map(async (item) => {
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lng}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
                    const res = await fetch(url);
                    const wData = await res.json();
                    if (wData && wData.current) {
                        const maxT = Math.round(wData.daily?.temperature_2m_max?.[0] ?? wData.current.temperature_2m);
                        const minT = Math.round(wData.daily?.temperature_2m_min?.[0] ?? wData.current.temperature_2m - 4);
                        const rainProb = wData.daily?.precipitation_probability_max?.[0] ?? 10;
                        const wind = Math.round(wData.current.wind_speed_10m || 8);
                        liveWeatherByDay[item.dayCode] = { ...item, maxT, minT, rainProb, wind };
                    }
                } catch (e) {
                    liveWeatherByDay[item.dayCode] = { ...item, maxT: 8, minT: 0, rainProb: 20, wind: 12 };
                }
            }));

            // 1. 渲染「30 秒情報速讀：出發前先看這五件事」
            const d1W = liveWeatherByDay['D01'] || { locName: '山形', maxT: 6, minT: -2, rainProb: 20, wind: 12 };
            const d2W = liveWeatherByDay['D02'] || { locName: '藏王', maxT: -3, minT: -9, rainProb: 30, wind: 25 };
            const quickFiveEl = document.getElementById('info-quick-five');
            quickFiveEl.innerHTML = `
                <li><span>☀️</span><div><strong>【${d1W.locName} D01 即時氣象】</strong>氣溫 ${d1W.maxT}~${d1W.minT}°C，降雨/降雪機率 ${d1W.rainProb}%，風速最高 ${d1W.wind} km/h。</div></li>
                <li><span>🚡</span><div><strong>【${d2W.locName} D02 山岳風速監測】</strong>氣溫 ${d2W.maxT}~${d2W.minT}°C，目前風速 ${d2W.wind} km/h（藏王纜車遇強風可能暫停運行，出發前請再次點擊右上角重新整理）。</div></li>
                <li><span>🚃</span><div><strong>【交通實測提醒】</strong>冬季「藏王樹冰套票」山交巴士窗口常因暴雪停售，實測直接排隊刷 Suica 上車＋到藏王山麓站買纜車票最順暢！</div></li>
                <li><span>🦊</span><div><strong>【園區閉園與末班車注意】</strong>宮城藏王狐狸村冬季 16:00 閉園、銀山溫泉傍晚實施入場管制，請務必於上午排程出發。</div></li>
                <li><span>🔋</span><div><strong>【極端低溫防凍對策】</strong>山寺階梯與藏王山頂極滑需備簡易冰爪；零下低溫手機易瞬間關機，建議貼暖暖包並隨身攜帶行動電源。</div></li>
            `;

            // 2. 渲染「九天行程影響雷達 (D01~D09)」
            const radarGrid = document.getElementById('info-radar-grid');
            radarGrid.innerHTML = dayRepresentativeCoords.map(item => {
                const w = liveWeatherByDay[item.dayCode] || { maxT: 6, minT: 0, rainProb: 20, wind: 10 };
                const isWarn = w.wind >= 25 || w.rainProb >= 60 || w.minT <= -5;
                const statusText = isWarn
                    ? `⚠️ ${w.maxT}~${w.minT}°C｜風速 ${w.wind}km/h 注意`
                    : `✔ ${w.maxT}~${w.minT}°C｜降雨 ${w.rainProb}%`;
                return `
                    <div class="radar-cell ${isWarn ? 'warn' : ''}" onclick="selectDayFromRadar('${item.dayKey}')">
                        <div class="radar-day-num">${item.dayCode}・${item.locName}</div>
                        <div class="radar-day-status">${statusText}</div>
                    </div>
                `;
            }).join('');

            // 3. 整理並渲染「情報剪報」
            buildInfoClippingsData(dayRepresentativeCoords);
            if (refreshBtn && isManualClick) {
                refreshBtn.textContent = '✔ 已更新最新情報';
                setTimeout(() => { refreshBtn.textContent = '↻ 重新整理'; }, 1800);
            }
        }

        function selectDayFromRadar(dayKey) {
            switchRightView('view-itinerary');
            const tabs = document.querySelectorAll('.day-tab');
            tabs.forEach(b => {
                if (b.textContent === dayKey) b.click();
            });
        }

        function buildInfoClippingsData(dayCoords) {
            allInfoClippings = [];
            const regionsSet = new Set();

            // 動態加入各日即時氣象速報
            dayCoords.forEach(item => {
                const w = liveWeatherByDay[item.dayCode];
                if (w) {
                    regionsSet.add(item.locName);
                    allInfoClippings.push({
                        category: '天氣',
                        region: item.locName,
                        tag: `${item.dayCode} 即時氣象`,
                        title: `【${item.locName}】即時氣溫 ${w.maxT}~${w.minT}°C，降雨機率 ${w.rainProb}%，風速 ${w.wind} km/h`,
                        desc: `對應行程：${item.dayTitle}。請依當日溫差與風速適時調整防風保暖穿搭。`
                    });
                }
            });

            // 自動從各章節內文萃取交通、防災、活動提醒
            normalizedDays.forEach(dayObj => {
                (dayObj.chapters || []).forEach(ch => {
                    const plain = stripHtmlText(ch.content || '');
                    const cleanSpot = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');
                    const locShort = cleanSpot.slice(0, 4);
                    regionsSet.add(locShort);

                    if (/新幹線|巴士|JR|仙石線|Skyliner|套票|預約/.test(plain)) {
                        allInfoClippings.push({
                            category: '交通',
                            region: locShort,
                            tag: `${dayObj.day} 交通情報`,
                            title: `[交通動線] ${cleanSpot}`,
                            desc: plain.slice(0, 110) + (plain.length > 110 ? '…' : '')
                        });
                    }
                    if (/祭|限定|點燈|御朱印|風景印/.test(plain)) {
                        allInfoClippings.push({
                            category: '活動',
                            region: locShort,
                            tag: `${dayObj.day} 限定體驗`,
                            title: `[期間活動＆紀念章] ${cleanSpot}`,
                            desc: plain.slice(0, 110) + (plain.length > 110 ? '…' : '')
                        });
                    }
                    if (/注意|警告|管制|小心|防滑|冰爪|暖暖包/.test(plain)) {
                        allInfoClippings.push({
                            category: '防災',
                            region: locShort,
                            tag: `${dayObj.day} 安全防雷`,
                            title: `[旅途安全提醒] ${cleanSpot}`,
                            desc: plain.slice(0, 110) + (plain.length > 110 ? '…' : '')
                        });
                    }
                });
            });

            const regSelect = document.getElementById('clip-region-select');
            regSelect.innerHTML = `<option value="ALL">全部地區</option>` +
                Array.from(regionsSet).map(r => `<option value="${r}">${r}</option>`).join('');

            filterInfoClippings();
        }

        function filterInfoClippings() {
            const reg = document.getElementById('clip-region-select').value;
            const kw = (document.getElementById('clip-search-input').value || '').trim().toLowerCase();

            const filtered = allInfoClippings.filter(item => {
                const matchCat = currentClipCategory === 'ALL' || item.category === currentClipCategory;
                const matchReg = reg === 'ALL' || item.region === reg;
                const matchKw = !kw || item.title.toLowerCase().includes(kw) || item.desc.toLowerCase().includes(kw);
                return matchCat && matchReg && matchKw;
            });

            const listEl = document.getElementById('info-clippings-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 24px; color:#718096; font-size:0.88rem;">目前沒有符合篩選條件的情報剪報</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="clip-item">
                    <div class="clip-item-top">
                        <span>📌 分類：${item.category} ｜ 地區：${item.region}</span>
                        <span>${item.tag}</span>
                    </div>
                    <div class="clip-item-title">${item.title}</div>
                    <div class="clip-item-desc">${item.desc}</div>
                </div>
            `).join('');
        }

        document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#clip-cat-pills .clip-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentClipCategory = btn.getAttribute('data-cat');
                filterInfoClippings();
            });
        });

        /* ==============================================================
           12. 🎫 文牒・盤纏・舟車・佳餚 自動萃取與渲染引擎 (復刻第一組圖 4～7)
           ============================================================== */
        function renderPackAndBudgetViews() {
            const vouchers = [];
            const transits = [];
            const foods = [];
            let totalSpotCount = 0;

            normalizedDays.forEach((dayObj, dIdx) => {
                (dayObj.chapters || []).forEach((ch, cIdx) => {
                    totalSpotCount++;
                    const prevCh = cIdx > 0 ? dayObj.chapters[cIdx - 1] : null;
                    const meta = classifyChapterMeta(ch, cIdx, prevCh);
                    const cleanTitle = (ch.title || '').replace(/^\d+\.\s*/, '').replace(/^[^｜|]+[｜|]\s*/, '');

                    // 萃取文牒（機票、住宿、特殊門票）
                    if (meta.stampChar === '住' || /機場|纜車|遊船|敘宴|劇場/.test(cleanTitle)) {
                        const vType = meta.stampChar === '住' ? 'hotel' : (/機場/.test(cleanTitle) ? 'flight' : 'spot');
                        const vBadge = meta.stampChar === '住' ? '住宿憑證' : (/機場/.test(cleanTitle) ? meta.timeStr : '門票／預約');
                        vouchers.push({
                            day: dayObj.day,
                            dayNum: dIdx + 1,
                            type: vType,
                            title: cleanTitle,
                            sub: `${dayObj.day} ・ ${dayObj.dayTitle || ''}`,
                            badge: vBadge
                        });
                    }

                    // 萃取舟車段次
                    if (meta.transitInfo) {
                        transits.push({
                            day: dayObj.day,
                            time: meta.timeStr,
                            ...meta.transitInfo
                        });
                    }

                    // 萃取佳餚名單
                    if (meta.stampChar === '食') {
                        foods.push({
                            day: dayObj.day,
                            title: cleanTitle,
                            desc: meta.introText.slice(0, 65) + '…'
                        });
                    }
                });
            });

            // 1. 渲染文牒 (圖4)
            const vContainer = document.getElementById('pack-vouchers');
            vContainer.innerHTML = `
                <div style="margin-bottom: 12px; font-size: 0.86rem; color: var(--text-light);">
                    自動彙整本趟旅程的航班、入住飯店與重要票券憑證（共 ${vouchers.length} 份文牒）：
                </div>
                ${vouchers.map(v => `
                    <div class="voucher-card">
                        <div class="voucher-left ${v.type}">
                            <span style="font-size: 0.72rem; opacity: 0.85;">${v.day}</span>
                            <strong style="font-size: 1rem;">${v.type === 'hotel' ? '宿' : (v.type === 'flight' ? '飛' : '券')}</strong>
                        </div>
                        <div class="voucher-body">
                            <div>
                                <div class="voucher-title">${v.title}</div>
                                <div class="voucher-sub">${v.sub}</div>
                            </div>
                            <div class="voucher-badge">${v.badge}</div>
                        </div>
                    </div>
                `).join('')}
            `;

            // 2. 渲染盤纏記帳 (圖5)
            const bContainer = document.getElementById('pack-budget');
            const bData = rawTripData.budget || {
                currency: 'JPY',
                total: 160000,
                categories: [
                    { name: '交通（新幹線／JR／巴士／纜車）', amount: 48500, pct: 38 },
                    { name: '住宿（溫泉飯店＆商務旅館）', amount: 45000, pct: 35 },
                    { name: '餐飲（A5仙台牛／牛舌／特色料理）', amount: 24800, pct: 19 },
                    { name: '門票與體驗（狐狸村／遊船／念珠）', amount: 9800, pct: 8 }
                ]
            };
            const spent = bData.categories.reduce((acc, c) => acc + c.amount, 0);
            bContainer.innerHTML = `
                <div class="budget-card">
                    <div style="display:flex; justify-content:space-between; align-items:baseline;">
                        <div>
                            <div style="font-size:0.78rem; color:var(--text-light);">旅途行跡統計</div>
                            <div style="font-size:1.5rem; font-weight:700; color:#3B4D54;">${normalizedDays.length} 天 ・ ${totalSpotCount} 處打卡</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:0.78rem; color:var(--text-light);">預估總花費 (${bData.currency})</div>
                            <div style="font-size:1.25rem; font-weight:700; color:#B84A39;">¥${spent.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="budget-bar-wrap">
                        <div class="budget-bar-fill" style="width: ${Math.min(100, Math.round((spent / bData.total) * 100))}%;"></div>
                    </div>
                    <div style="font-size: 0.82rem; color: var(--text-light); margin-bottom: 16px;">
                        預算上限：¥${bData.total.toLocaleString()} ｜ 剩餘彈性預算：¥${Math.max(0, bData.total - spent).toLocaleString()}
                    </div>
                    ${bData.categories.map(cat => `
                        <div class="budget-cat-row">
                            <div class="budget-cat-top">
                                <span>${cat.name}</span>
                                <span>¥${cat.amount.toLocaleString()}</span>
                            </div>
                            <div class="budget-bar-wrap" style="height:6px; margin:4px 0;">
                                <div class="budget-bar-fill" style="width:${cat.pct}%; background:#C4A99E;"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // 3. 渲染舟車段次 (圖6)
            const tContainer = document.getElementById('pack-transit');
            tContainer.innerHTML = `
                <div style="margin-bottom: 12px; font-size: 0.86rem; color: var(--text-light);">
                    飛機、新幹線、JR 與巴士跨區移動段次總表（共 ${transits.length} 段）：
                </div>
                ${transits.map(t => `
                    <div class="voucher-card">
                        <div class="voucher-left" style="background:#7A6258;">
                            <span style="font-size:0.72rem;">${t.day}</span>
                            <strong style="font-size:1.1rem;">${t.icon}</strong>
                        </div>
                        <div class="voucher-body">
                            <div>
                                <div class="voucher-title">${t.time} ｜ ${t.routeText}</div>
                                <div class="voucher-sub">${t.modeName} ・ 預估耗時 ${t.mins} 分鐘</div>
                            </div>
                            <div class="voucher-badge">¥${t.cost.toLocaleString()}</div>
                        </div>
                    </div>
                `).join('')}
            `;

            // 4. 渲染佳餚清單 (圖7)
            const fContainer = document.getElementById('pack-food');
            fContainer.innerHTML = `
                <div style="margin-bottom: 12px; font-size: 0.86rem; color: var(--text-light);">
                    旅途中品嚐過的好味道與私房餐館紀錄（共 ${foods.length} 處）：
                </div>
                ${foods.map((f, i) => `
                    <div class="voucher-card">
                        <div class="voucher-left spot">
                            <span style="font-size:0.72rem;">${f.day}</span>
                            <strong style="font-size:0.95rem;">#${i + 1}</strong>
                        </div>
                        <div class="voucher-body">
                            <div>
                                <div class="voucher-title">🍱 ${f.title}</div>
                                <div class="voucher-sub">${f.desc}</div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }
    </script>
</body>
</html>
