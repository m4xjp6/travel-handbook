<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- 【⚙️ 功能設定】Travelpayouts 聯盟行銷分潤腳本 -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* === 【🎨 顏色修改】全站主色調變數 === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-yellow: #FFE599;     /* 標題底線亮黃 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕 */
            --accent-pink: #E5D1C7;       /* 柔和藕粉 */
            --accent-sage: #D8E2D5;       /* 鼠尾草綠 */
            --accent-sage-dark: #5B7A67;  /* 深鼠尾草綠（行前清單進度條） */
            --text-dark: #4A4A4A;         /* 主要深灰字 */
            --text-light: #7A7A7A;        /* 內文淺灰字 */
            --border-soft: rgba(196, 169, 158, 0.32);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-color); color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* === 1. 左右雙欄主版面（左地圖 / 右內容） === */
        .container { display: flex; width: 100%; }
        #map-container { position: sticky; top: 0; width: 50vw; height: 100vh; background: var(--accent-pink); }
        #map { width: 100%; height: 100%; }
        #right-panel { width: 50vw; box-sizing: border-box; }

        /* 地圖頂部浮動列（統計膠囊與路線/尋訪切換） */
        .map-top-bar {
            position: absolute; top: 14px; left: 14px; right: 14px; z-index: 800;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            pointer-events: none;
        }
        .map-stats-pill {
            pointer-events: auto;
            background: rgba(253, 251, 247, 0.92); backdrop-filter: blur(6px);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-soft);
            font-size: 0.8rem; font-weight: 600; color: var(--accent-brown-dark);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .map-mode-overlay {
            pointer-events: auto; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
            background: rgba(253, 251, 247, 0.92); backdrop-filter: blur(6px);
            padding: 4px 6px; border-radius: 24px; border: 1.5px solid var(--border-soft);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .map-mode-btn {
            font-family: inherit; border: none; background: transparent; color: var(--text-dark);
            padding: 5px 12px; border-radius: 18px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .map-mode-btn.active { background: var(--accent-brown-dark); color: #fff; }

        /* === 2. 右側常駐導覽列、四大模式與天數按鈕 === */
        .top-nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(253, 251, 247, 0.96); backdrop-filter: blur(8px);
            padding: 14px 36px 12px; border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .back-link { text-decoration: none; color: var(--accent-brown-dark); font-size: 0.9rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .trip-main-title { margin: 0; font-size: 1.1rem; color: var(--accent-brown-dark); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .view-mode-bar { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .view-mode-bar::-webkit-scrollbar { display: none; }
        .view-mode-btn {
            font-family: inherit; background: transparent; color: var(--text-dark);
            border: 1.5px solid transparent; padding: 6px 14px; border-radius: 20px;
            font-size: 0.86rem; font-weight: 600; cursor: pointer; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s;
        }
        .view-mode-btn:hover { color: var(--accent-brown-dark); border-color: var(--border-soft); }
        .view-mode-btn.active { background: var(--accent-brown); color: #fff; border-color: var(--accent-brown); box-shadow: 0 3px 9px rgba(196, 169, 158, 0.4); }

        .day-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
        .day-tab {
            border: 1px solid var(--accent-brown); background: #fff; color: var(--accent-brown-dark);
            padding: 5px 13px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .day-tab:hover { background: var(--accent-pink); color: #fff; }
        .day-tab.active { background: var(--accent-brown-dark); border-color: var(--accent-brown-dark); color: #fff; box-shadow: 0 2px 8px rgba(166, 137, 124, 0.35); }

        /* === 3. 視角容器與圖文遊記樣式 === */
        .view-section { display: none; padding: 26px 36px 60px; }
        .view-section.active { display: block; }

        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: #fff; padding: 20px 24px; border-radius: 12px; margin: 14px 0 26px;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .day-badge, .field-test-badge, .draft-preview-badge {
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.28); color: #fff; padding: 4px 12px;
            height: 24px; box-sizing: border-box; border-radius: 12px;
            font-size: 0.8rem; letter-spacing: 0.08em; font-weight: 700;
        }
        .draft-preview-badge { background: rgba(184, 74, 57, 0.85); }
        .day-banner h1 { margin: 0; font-size: 1.25rem; font-weight: 600; line-height: 1.5; }
        .draft-empty-box { text-align: center; padding: 40px 22px; background: #fff; border: 1.5px dashed var(--accent-brown); border-radius: 18px; color: var(--text-light); margin: 16px 0; line-height: 1.7; }

        .chapter {
            min-height: 65vh; margin-bottom: 45px; padding: 30px; background: #fff;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15);
            position: relative; transition: opacity 0.4s; opacity: 0.35;
        }
        .chapter.active { opacity: 1; }
        .chapter h2 { color: var(--accent-brown); font-size: 1.3rem; margin-top: 0; border-bottom: 2px solid var(--accent-yellow); padding-bottom: 10px; display: inline-block; }
        .chapter-body { line-height: 1.8; color: var(--text-light); font-size: 1rem; letter-spacing: 0.04em; white-space: pre-line; }
        .photo-placeholder { width: 100%; min-height: 220px; background: var(--accent-pink); border-radius: 8px; margin: 20px 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.9rem; letter-spacing: 0.1em; }

        /* === 4. 多媒體畫廊與燈箱 === */
        .media-gallery { margin: 20px 0; display: grid; gap: 10px; width: 100%; }
        .media-gallery.layout-single, .media-gallery.layout-stack { grid-template-columns: 1fr; }
        .media-gallery.layout-single .media-item { max-height: 440px; }
        .media-gallery.layout-auto-2, .media-gallery.layout-grid-equal { grid-template-columns: repeat(2, 1fr); }
        .media-gallery.layout-auto-3, .media-gallery.layout-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .media-gallery.layout-auto-4, .media-gallery.layout-grid-4 { grid-template-columns: repeat(4, 1fr); }
        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        .media-gallery.layout-grid-1-2-1 { grid-template-columns: 1fr 2fr 1fr; }
        .media-gallery.layout-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding-bottom: 8px; scrollbar-width: thin; }
        .media-gallery.layout-carousel .media-item { flex: 0 0 82%; scroll-snap-align: center; }

        .media-item { position: relative; min-width: 0; border-radius: 10px; overflow: hidden; background: #f5efe6; height: 260px; }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; transition: transform 0.3s; }
        .media-item img:hover, .media-item video:hover { transform: scale(1.02); }
        .media-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.65)); color: #fff; font-size: 0.78rem; padding: 16px 10px 6px; pointer-events: none; }
        .replay-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 14px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; backdrop-filter: blur(4px); z-index: 5; }

        #lightbox-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 9999; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; touch-action: pan-y; }
        #lightbox-overlay img, #lightbox-overlay video { max-width: 85vw; max-height: 85vh; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); object-fit: contain; cursor: default; user-select: none; -webkit-user-drag: none; }
        .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.35); font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10001; backdrop-filter: blur(4px); transition: all 0.2s; user-select: none; }
        .lightbox-nav:hover { background: rgba(196, 169, 158, 0.85); transform: translateY(-50%) scale(1.08); }
        .lightbox-nav.prev { left: 24px; }
        .lightbox-nav.next { right: 24px; }
        .lightbox-info { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; pointer-events: none; z-index: 10001; white-space: nowrap; }

        /* === 5. 內文重點框與推薦預訂按鈕 === */
        .callout-box { display: flex; align-items: flex-start; padding: 14px 18px; border-radius: 8px; margin: 16px 0; font-size: 0.92rem; line-height: 1.6; color: #333; white-space: normal; }
        .callout-icon { font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
        .callout-content { flex: 1; }
        .callout-title { font-weight: 700; margin-bottom: 4px; }
        .callout-tip { background: #fdf6ec; border-left: 4px solid #e6a23c; }
        .callout-tip .callout-title { color: #b88230; }
        .callout-sci { background: #f0f9eb; border-left: 4px solid #67c23a; }
        .callout-sci .callout-title { color: #529b2e; }
        .callout-info { background: #eef4ff; border-left: 4px solid #3b82f6; }
        .callout-info .callout-title { color: #2563eb; }
        .callout-story { background: #f6f2ff; border-left: 4px solid #8b5cf6; }
        .callout-story .callout-title { color: #6d28d9; }
        .callout-warning { background: #fff1f2; border-left: 4px solid #f43f5e; }
        .callout-warning .callout-title { color: #be123c; }

        .affiliate-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(196, 169, 158, 0.35); }
        .affiliate-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #f7f1ed; color: var(--accent-brown-dark); border: 1px solid #d8c3b8; border-radius: 24px; font-size: 0.86rem; font-weight: 600; text-decoration: none; transition: all 0.25s; box-shadow: 0 2px 6px rgba(196, 169, 158, 0.15); }
        .affiliate-btn:hover { background: var(--accent-brown); color: #fff; border-color: var(--accent-brown); transform: translateY(-2px); }

        /* === 6. 視角一：📅 行程安排 === */
        .itinerary-day-block { margin-bottom: 38px; }
        .itin-day-header { margin-bottom: 14px; }
        .itin-day-title { font-family: 'Noto Serif TC', serif; font-size: 1.32rem; font-weight: 700; color: var(--text-dark); margin: 0 0 6px; }
        .itin-day-sub { font-size: 0.88rem; color: var(--text-light); line-height: 1.5; }
        .itin-summary-box { display: grid; grid-template-columns: 1fr 1fr; background: #F4EFE6; border: 1.5px solid #D8C8B8; border-radius: 14px; padding: 14px 10px; margin: 14px 0 18px; text-align: center; }
        .itin-sum-col:first-child { border-right: 1px solid #DFD3C5; }
        .itin-sum-label { font-size: 0.78rem; color: var(--text-light); margin-bottom: 4px; }
        .itin-sum-val { font-family: 'Noto Serif TC', serif; font-size: 1.25rem; font-weight: 700; color: #2C3E50; }
        .itin-sum-val.cost { color: #B84A39; }

        .itin-transit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; margin: 6px 0; font-size: 0.84rem; color: var(--text-light); border-bottom: 1px dotted rgba(196, 169, 158, 0.45); gap: 8px; }
        .itin-transit-left { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
        .itin-transit-icon { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #EFE7DA; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        .itin-transit-right { font-weight: 600; color: var(--text-dark); white-space: nowrap; }

        .spot-intro-card { background: #fff; border: 1.5px solid #8E7F76; border-radius: 16px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 3px 12px rgba(196, 169, 158, 0.12); }
        .spot-card-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; cursor: pointer; user-select: none; gap: 10px; }
        .spot-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .spot-time-box { background: #F4EFE6; border: 1.5px solid #6E6259; color: #3A322D; font-family: 'Noto Serif TC', serif; font-size: 0.9rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
        .spot-cat-pill { background: #F5E6D3; color: #9C6B3B; font-size: 0.76rem; font-weight: 700; padding: 3px 9px; border-radius: 8px; }
        .spot-title-text { font-size: 1rem; font-weight: 700; color: #2B2B2B; }
        .spot-toggle-arrow { color: #8E7F76; font-size: 0.85rem; transition: transform 0.25s; flex-shrink: 0; }
        .spot-intro-card.open .spot-toggle-arrow { transform: rotate(90deg); }
        .spot-card-body { display: none; padding: 0 18px 16px; border-top: 1px dashed #E5DEC9; }
        .spot-intro-card.open .spot-card-body { display: block; }

        .spot-sub-block { margin-top: 12px; padding: 11px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.68; }
        .spot-sub-block.intro-block { background: #F9F6F0; border-left: 3.5px solid #4A7C59; }
        .spot-sub-block.note-block { background: #FFF9F2; border-left: 3.5px solid #D97724; color: #5C4028; }
        .spot-sub-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
        .spot-sub-block.intro-block .spot-sub-title { color: #3B6E4C; }
        .spot-sub-block.note-block .spot-sub-title { color: #B85D14; }
        .spot-sub-text { white-space: pre-line; margin: 0; }
        .spot-action-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .spot-pill-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid #C9D6DF; background: #F0F5F9; color: #3A506B; transition: all 0.2s; }
        .spot-pill-btn.loc { background: #F4EFE6; border-color: #D8C8B8; color: #6E5A4F; }

        /* === 7. 視角二：📡 資訊情報 === */
        .info-station-header { background: linear-gradient(135deg, #EBF3F9 0%, #F5F9FC 100%); border: 1.5px solid #C5D9E8; border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; }
        .info-tag-pill { display: inline-block; background: #fff; border: 1px solid #B8CFE0; color: #3B5975; font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.06em; margin-bottom: 8px; }
        .info-station-title { font-family: 'Noto Serif TC', serif; font-size: 1.45rem; font-weight: 700; color: #23394D; margin: 0 0 6px; }
        .info-station-sub { font-size: 0.86rem; color: #546E85; margin: 0 0 14px; }
        .info-status-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(184, 207, 224, 0.5); font-size: 0.82rem; color: #46637A; }
        .info-live-dot { display: inline-block; width: 8px; height: 8px; background: #38A169; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.2); }
        .info-live-dot.ended { background: #A0AEC0; box-shadow: none; }
        .info-refresh-btn { font-family: inherit; background: #fff; color: #2B4C6F; border: 1.5px solid #B0C7D9; padding: 6px 14px; border-radius: 18px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .info-refresh-btn:hover:not(:disabled) { background: #2B4C6F; color: #fff; }
        .info-refresh-btn:disabled { background: #EDF2F7; color: #718096; border-color: #CBD5E0; cursor: not-allowed; }

        .info-card-panel { background: #fff; border: 1.5px solid #D5E3ED; border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(59, 89, 117, 0.06); }
        .info-panel-title { font-size: 1.05rem; font-weight: 700; color: #23394D; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        .quick-read-list { list-style: none; padding: 0; margin: 0; }
        .quick-read-list li { padding: 10px 0; border-bottom: 1px dashed #E2ECF2; font-size: 0.9rem; line-height: 1.55; color: #2D3748; display: flex; align-items: flex-start; gap: 8px; }
        .quick-read-list li:last-child { border-bottom: none; }

        .radar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .radar-cell { background: #F8FBFD; border: 1px solid #D5E3ED; border-radius: 12px; padding: 10px 8px; text-align: center; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
        .radar-cell:hover { border-color: #7FA6C4; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(59, 89, 117, 0.1); }
        .radar-main-link { text-decoration: none; color: inherit; display: block; }
        .radar-day-num { font-weight: 700; font-size: 0.88rem; color: #23394D; margin-bottom: 3px; }
        .radar-day-status { font-size: 0.76rem; color: #647F94; line-height: 1.35; }
        .radar-cell.warn { background: #FFFDF5; border-color: #F6AD55; }
        .radar-cell.warn .radar-day-status { color: #C05621; font-weight: 600; }
        .radar-ext-links { display: flex; justify-content: center; gap: 6px; padding-top: 5px; border-top: 1px dashed #E2ECF2; }
        .radar-ext-a { font-size: 0.7rem; font-weight: 600; color: #2B6CB0; background: #EBF8FF; padding: 2px 7px; border-radius: 8px; text-decoration: none; }

        .clip-filter-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .clip-pill { border: 1px solid #C5D9E8; background: #fff; color: #46637A; padding: 5px 12px; border-radius: 18px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .clip-pill.active { background: #4A7696; border-color: #4A7696; color: #fff; }
        .clip-search-row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px; margin-bottom: 14px; }
        .clip-input, .clip-select { font-family: inherit; border: 1px solid #C5D9E8; border-radius: 10px; padding: 7px 10px; font-size: 0.84rem; color: #23394D; background: #F8FBFD; }
        .clip-item { padding: 12px 14px; border-radius: 12px; background: #F8FBFD; border: 1px solid #E2ECF2; margin-bottom: 8px; }
        .clip-item.urgent { background: #FFFDF9; border-left: 4px solid #DD6B20; }
        .clip-item-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #647F94; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }

        /* === 8. 視角三：🎫 票券蒐集（含互動台幣記帳 ＆ 行前 Check List） === */
        .pack-sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; background: #F3ECE3; padding: 6px; border-radius: 14px; margin-bottom: 16px; }

        .pack-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.84rem; color: var(--text-light); flex-wrap: wrap; gap: 8px; }

        .ticket-left-strip.spot { background: #8C4A32; }
        .ticket-left-strip.transit { background: #6E5A4F; }
        .ticket-head-main { flex: 1; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }

        .ticket-head-title { font-weight: 700; font-size: 0.94rem; line-height: 1.4; }
        .ticket-head-sub { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }
        .ticket-head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .ticket-time-pill { background: #F4EFE6; border: 1px solid #D8C8B8; color: #5A463C; padding: 3px 9px; border-radius: 10px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
        .ticket-time-pill.reserved { background: #EBF5EE; border-color: #A3C9AE; color: #2F6B43; }
        .ticket-arrow { color: var(--accent-brown-dark); font-size: 0.8rem; transition: transform 0.25s; }
        .collapsible-ticket-card.open .ticket-arrow { transform: rotate(90deg); }
        .ticket-detail-body { display: none; padding: 14px 16px 16px; background: #FCFBF9; border-top: 1.5px dashed #E2D9CE; }
        .collapsible-ticket-card.open .ticket-detail-body { display: block; }

        /* 飯店住宿憑證 */
        .hotel-voucher-paper { background: #fff; border: 1.5px solid #C8B6A6; border-radius: 12px; overflow: hidden; }
        .hv-top-banner { background: linear-gradient(135deg, #4A3E3B 0%, #6E5D58 100%); color: #F7EFE8; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; letter-spacing: 0.08em; flex-wrap: wrap; gap: 6px; }
        .hv-stamp-confirmed { border: 1.5px solid #9AE6B4; color: #9AE6B4; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; }
        .hv-check-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #F8F4EE; padding: 12px 16px; border-bottom: 1px solid #EAE0D5; text-align: center; gap: 8px; }
        .hv-check-label { font-size: 0.72rem; color: #8C7A6B; font-weight: 600; }
        .hv-check-val { font-family: 'Noto Serif TC', serif; font-size: 0.94rem; font-weight: 700; color: #3A2E2A; margin-top: 2px; }
        .hv-nights-pill { background: #5B4B49; color: #fff; padding: 4px 11px; border-radius: 16px; font-size: 0.76rem; font-weight: 700; }
        .hv-info-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        .hv-info-table th, .hv-info-table td { padding: 8px 14px; border-bottom: 1px solid #F0EAE2; text-align: left; }
        .hv-info-table th { width: 28%; color: #8C7A6B; font-weight: 600; background: #FDFBF9; }
        .hv-barcode-bar { padding: 10px 16px; background: #FAF6F0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .css-barcode { height: 24px; width: 140px; background: repeating-linear-gradient(90deg, #3A2E2A 0 2px, transparent 2px 5px, #3A2E2A 5px 6px, transparent 6px 9px); opacity: 0.75; }
        .timetable-link-btn { display: inline-flex; align-items: center; gap: 5px; background: #EDF6F9; color: #1D5B79; border: 1px solid #B6D7E8; padding: 6px 13px; border-radius: 18px; font-size: 0.8rem; font-weight: 700; text-decoration: none; transition: all 0.2s; }
        .timetable-link-btn:hover { background: #1D5B79; color: #fff; }

        /* 雲端同步控制條（記帳與行前清單共用） */
        .cloud-auth-bar {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
            background: #F7F2EB; border: 1px solid var(--border-soft); border-radius: 12px;
            padding: 10px 14px; margin-bottom: 14px; font-size: 0.82rem;
        }
        .cloud-auth-status { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text-dark); }
        .cloud-auth-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cloud-btn {
            font-family: inherit; border: 1px solid var(--accent-brown); background: #fff;
            color: var(--accent-brown-dark); padding: 5px 11px; border-radius: 14px;
            font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .cloud-btn:hover { background: var(--accent-brown); color: #fff; }
        .cloud-btn.primary { background: var(--accent-brown-dark); color: #fff; border-color: var(--accent-brown-dark); }
        .cloud-btn.primary:hover { filter: brightness(0.92); }
        .cloud-btn.sage { background: var(--accent-sage-dark); color: #fff; border-color: var(--accent-sage-dark); }

        /* 互動式台幣記帳表單與明細 */
        .budget-card, .expense-detail-panel, .expense-form-panel, .checklist-card {
            background: #fff; border-radius: 16px; padding: 18px 20px; border: 1px solid var(--border-soft);
            margin-bottom: 16px; box-shadow: 0 3px 12px rgba(196, 169, 158, 0.1);
        }
        .budget-bar-wrap { height: 8px; background: #EFEAE4; border-radius: 6px; overflow: hidden; margin: 8px 0 14px; }
        .budget-bar-fill { height: 100%; background: #3B4D54; border-radius: 6px; transition: width 0.3s; }
        .budget-cat-row { margin-bottom: 10px; }
        .budget-cat-top { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 600; margin-bottom: 4px; gap: 8px; }

        .expense-form-panel { background: #FCF9F5; border: 1.5px solid var(--accent-brown); }
        .exp-form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .exp-field { display: flex; flex-direction: column; gap: 4px; }
        .exp-field.full { grid-column: 1 / -1; }
        .exp-field label { font-size: 0.76rem; font-weight: 700; color: var(--accent-brown-dark); }
        .exp-input, .exp-select {
            font-family: inherit; border: 1px solid #D8C8B8; border-radius: 10px;
            padding: 8px 10px; font-size: 0.85rem; color: var(--text-dark); background: #fff;
            width: 100%; box-sizing: border-box;
        }
        .exp-rate-row { display: flex; gap: 6px; align-items: center; }
        .exp-check-row { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-dark); cursor: pointer; margin-top: 2px; }
        .exp-form-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border-soft); }
        .exp-rate-hint { font-size: 0.74rem; color: var(--text-light); }

        .expense-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .expense-filter-btn { font-family: inherit; border: 1px solid var(--border-soft); background: #FAF7F2; color: var(--text-dark); padding: 5px 11px; border-radius: 16px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .expense-filter-btn.active { background: var(--accent-brown-dark); border-color: var(--accent-brown-dark); color: #fff; }
        .expense-item-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 8px; border-bottom: 1px dashed #EAE3DC; font-size: 0.85rem; gap: 10px; }
        .expense-item-row:last-child { border-bottom: none; }
        .expense-item-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .expense-item-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .expense-cat-tag { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: #F3ECE3; color: #6E5A4F; white-space: nowrap; }
        .expense-cat-tag.交通 { background: #EBF3F9; color: #2B5B84; }
        .expense-cat-tag.住宿 { background: #F2EFE9; color: #5B4B49; }
        .expense-cat-tag.餐飲 { background: #FDF3EB; color: #9C4A32; }
        .expense-cat-tag.門票 { background: #EDF7ED; color: #2E6B3E; }
        .expense-cat-tag.購物 { background: #F6EEF8; color: #6B3F7C; }
        .expense-sub-pill { font-size: 0.71rem; color: var(--text-light); background: #F5F2EE; padding: 1px 6px; border-radius: 6px; }
        .expense-sub-pill.est { background: #FFF8E7; color: #9C6B3B; border: 1px solid #EAD7B7; }
        .expense-item-title { font-weight: 600; word-break: break-word; }
        .expense-fx-note { font-size: 0.75rem; color: var(--text-light); }
        .expense-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .expense-item-amount { font-family: 'Noto Serif TC', serif; font-weight: 700; color: #B84A39; white-space: nowrap; font-size: 0.92rem; }
        .expense-row-ops { display: flex; gap: 4px; }
        .icon-mini-btn { border: 1px solid #E2D9CE; background: #fff; color: var(--text-light); border-radius: 8px; padding: 2px 7px; font-size: 0.74rem; cursor: pointer; }
        .icon-mini-btn:hover { background: #F4EFE6; color: var(--text-dark); }
        .icon-mini-btn.del:hover { background: #FFF1F2; color: #BE123C; border-color: #FDA4AF; }

        /* ✅ 行前準備清單樣式 */
        .chk-progress-bar { height: 10px; background: #EAEFE8; border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
        .chk-progress-fill { height: 100%; background: var(--accent-sage-dark); border-radius: 8px; transition: width 0.3s; }
        .chk-add-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; margin-bottom: 14px; }
        .chk-group-title { font-size: 0.84rem; font-weight: 700; color: var(--accent-sage-dark); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #E4ECE2; display: flex; justify-content: space-between; }
        .chk-item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 6px; border-bottom: 1px dashed #ECE7E0; }
        .chk-item-row:last-child { border-bottom: none; }
        .chk-label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; font-size: 0.88rem; line-height: 1.45; }
        .chk-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-sage-dark); cursor: pointer; flex-shrink: 0; }
        .chk-label.done span { text-decoration: line-through; color: #A0A0A0; }

        /* 📝 隨手記事樣式 */
        .note-textarea {
            font-family: inherit; border: 1px solid #D8C8B8; border-radius: 10px;
            padding: 10px 12px; font-size: 0.88rem; color: var(--text-dark); background: #fff;
            width: 100%; min-height: 92px; box-sizing: border-box; resize: vertical; line-height: 1.6;
        }
        .note-card {
            background: #FCFBF9; border: 1px solid #E5DDD5; border-left: 4px solid var(--accent-brown);
            border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
        }
        .note-card.tag-避坑提醒 { border-left-color: #DD6B20; background: #FFFDF9; }
        .note-card.tag-美食口感 { border-left-color: #B84A39; }
        .note-card.tag-實用情報 { border-left-color: #3B82F6; }
        .note-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .note-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.74rem; }
        .note-tag-pill { background: #EFE7DA; color: #6E5A4F; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
        .note-spot-pill { background: #EDF6F9; color: #1D5B79; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
        .note-time { font-size: 0.72rem; color: var(--text-light); }
        .note-content { font-size: 0.88rem; line-height: 1.68; color: var(--text-dark); white-space: pre-line; word-break: break-word; }

        /* 美食紀錄色塊 */
        .food-review-box { padding: 10px 14px; background: #F2F7FA; border-left: 3.5px solid #3B82F6; border-radius: 8px; margin-bottom: 10px; font-size: 0.86rem; line-height: 1.65; color: #2C3E50; }
        .food-policy-box { padding: 10px 14px; background: #F3FAF4; border-left: 3.5px solid #38A169; border-radius: 8px; font-size: 0.85rem; line-height: 1.65; color: #274E37; }

        /* === 9. 地圖標記、尋訪方章、方向箭頭與移動頭貼 === */
        .custom-marker, .stamp-marker, .route-arrow-icon, .fox-traveler-icon { background: transparent; border: none; }
        .custom-marker .marker-dot { width: 16px; height: 16px; box-sizing: border-box; background: var(--accent-brown); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; transition: all 0.25s; }
        .custom-marker:hover .marker-dot, .custom-marker.active .marker-dot { background: var(--accent-brown-dark); transform: scale(1.35); box-shadow: 0 0 0 4px rgba(255, 229, 153, 0.7), 0 3px 8px rgba(0,0,0,0.3); }

        .stamp-box { width: 26px; height: 26px; border-radius: 6px; background: #3B4D54; color: #fff; border: 2px solid #fff; font-family: 'Noto Serif TC', serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.28); cursor: pointer; transition: transform 0.2s; }
        .stamp-box.food { background: #9C4A32; }
        .stamp-box.hotel { background: #5B6E58; }
        .stamp-box.transit { background: #7A6258; }
        .stamp-box:hover { transform: scale(1.2); }

        .route-arrow-icon { pointer-events: none; }
        .route-arrow-inner { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; color: var(--accent-brown-dark); font-weight: 700; font-size: 13px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

        .fox-traveler-icon { z-index: 2000 !important; pointer-events: none; }
        .fox-wrapper { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; border: 2.5px solid var(--accent-brown-dark); border-radius: 50%; box-shadow: 0 4px 12px rgba(166, 137, 124, 0.55); font-size: 20px; overflow: hidden; transition: transform 0.15s; }
        .fox-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .fox-wrapper.walking { animation: foxWalkBounce 0.32s infinite alternate ease-in-out; }
        @keyframes foxWalkBounce { from { margin-top: 0; } to { margin-top: -6px; } }

        .marker-tooltip { background: rgba(74, 74, 74, 0.92); color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .marker-tooltip::before { border-top-color: rgba(74, 74, 74, 0.92) !important; }

        /* === 10. 手機版 RWD 專屬優化 === */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map-container { width: 100vw; height: 36vh; position: sticky; top: 0; z-index: 200; }
            #right-panel { width: 100vw; }
            .top-nav { top: 36vh; padding: 10px 14px; }
            .view-section { padding: 16px 14px 50px; }

            /* 1. 地圖頂部統計與路線切換上下錯開不重疊 */
            .map-top-bar { top: 10px; left: 10px; right: 10px; flex-direction: column; align-items: flex-start; gap: 6px; }
            .map-stats-pill { font-size: 0.74rem; padding: 5px 10px; max-width: 100%; box-sizing: border-box; }
            .map-mode-overlay { align-self: flex-end; padding: 3px 5px; }
            .map-mode-btn { padding: 4px 10px; font-size: 0.76rem; }

            /* 2. 頂部 4 大分頁單行均分不裁切 */
            .nav-header { margin-bottom: 8px; }
            .trip-main-title { font-size: 0.96rem; }
            .view-mode-bar { gap: 4px; margin-bottom: 8px; }
            .view-mode-btn { flex: 1; justify-content: center; padding: 6px 4px; font-size: 0.76rem; gap: 3px; }

            /* 3. 表單、清單與卡片響應式 */
            .spot-card-header { padding: 12px 14px; }
            .spot-card-body { padding: 0 14px 14px; }
            .chapter { min-height: auto; margin-bottom: 28px; padding: 20px 16px; }
            .media-gallery:not(.layout-single):not(.layout-stack):not(.layout-carousel) { grid-template-columns: repeat(2, 1fr); }
            .media-item { height: 180px; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.1rem; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
            .affiliate-btn { width: 100%; justify-content: center; box-sizing: border-box; }
            .radar-grid { grid-template-columns: repeat(2, 1fr); }
            .clip-search-row, .exp-form-grid { grid-template-columns: 1fr; }
            .chk-add-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側常駐互動地圖 -->
        <div id="map-container">
            <div class="map-top-bar">
                <div class="map-stats-pill" id="map-stats-pill">讀取行跡中...</div>
                <div class="map-mode-overlay">
                    <button type="button" class="map-mode-btn active" id="btn-map-route" onclick="switchMapDisplayMode('route')">🗺️ 路線</button>
                    <button type="button" class="map-mode-btn" id="btn-map-explore" onclick="switchMapDisplayMode('explore')">🧭 尋訪</button>
                </div>
            </div>
            <div id="map"></div>
        </div>

        <!-- 右側導覽列與四大視角 -->
        <div id="right-panel">
            <div class="top-nav">
                <div class="nav-header">
                    <a href="index.html" class="back-link">&lt; 書櫃</a>
                    <h2 class="trip-main-title" id="trip-title">讀取中...</h2>
                </div>

                <div class="view-mode-bar">
                    <button type="button" class="view-mode-btn active" data-view="view-itinerary" onclick="switchRightView('view-itinerary')">📅 行程安排</button>
                    <button type="button" class="view-mode-btn" data-view="view-info" onclick="switchRightView('view-info')">📡 資訊情報</button>
                    <button type="button" class="view-mode-btn" data-view="view-pack" onclick="switchRightView('view-pack')">🎫 票券蒐集</button>
                    <button type="button" class="view-mode-btn" id="btn-view-journal" data-view="view-journal" onclick="switchRightView('view-journal')">📖 圖文遊記</button>
                </div>

                <div class="day-tabs" id="day-tabs"></div>
            </div>

            <!-- 視角 1：📅 行程安排 -->
            <div id="view-itinerary" class="view-section active">
                <div id="itinerary-content"></div>
            </div>

            <!-- 視角 2：📡 資訊情報（出發前 3 天～結束日自動啟用即時抓取） -->
            <div id="view-info" class="view-section">
                <div class="info-station-header">
                    <span class="info-tag-pill" id="info-trip-code">TRIP LIVE ・ 旅の速報</span>
                    <h2 class="info-station-title" id="info-station-title">旅途即時情報手帳</h2>
                    <p class="info-station-sub">掌握出發前 3 天與旅途中的即時天氣、交通運行快訊、防災預警與重要新聞。</p>

                        <span><span class="info-live-dot" id="info-live-dot"></span><span id="info-conn-label">即時連線</span> ｜ <span id="info-update-time">更新：讀取中...</span></span>

            <!-- 視角 3：🎫 票券蒐集（票券住宿、交通時刻、台幣記帳、美食紀錄、行前清單） -->
