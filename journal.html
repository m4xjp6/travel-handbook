<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讀取中... ｜ 電子旅行手帳</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #FDFBF7;
            --accent-yellow: #FFE599;
            --accent-brown: #C4A99E;
            --accent-brown-dark: #a6897c;
            --accent-pink: #E5D1C7;
            --text-dark: #4A4A4A;
            --text-light: #7A7A7A;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100%;
        }
        .container { display: flex; width: 100%; }

        /* 左側地圖區塊 */
        #map-container {
            position: sticky;
            top: 0;
            width: 50vw;
            height: 100vh;
            background-color: var(--accent-pink);
        }
        #map { width: 100%; height: 100%; }

        /* 右側內容區塊 */
        #right-panel { width: 50vw; box-sizing: border-box; }

        /* 頂部常駐導覽列 */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            padding: 16px 40px 12px 40px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.25);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-link {
            text-decoration: none;
            color: var(--accent-brown-dark);
            font-size: 0.9rem;
            font-weight: bold;
        }
        .trip-main-title {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent-brown-dark);
        }

        /* 天數按鈕列 (Day Tabs) */
        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .day-tab {
            border: 1px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .day-tab:hover { background: var(--accent-pink); color: white; }
        .day-tab.active {
            background: var(--accent-brown);
            color: white;
            box-shadow: 0 2px 8px rgba(196, 169, 158, 0.4);
        }

        /* 文章內容容器 */
        #content { padding: 30px 40px 60px 40px; }

        /* 每日大標題橫幅 */
        .day-banner {
            background: linear-gradient(135deg, #C4A99E 0%, #d8c2b8 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0 30px 0;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.25);
        }
        .day-banner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .day-banner .day-badge,
        .day-banner .field-test-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.28);
            color: white;
            padding: 4px 12px;
            height: 24px;
            box-sizing: border-box;
            border-radius: 12px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            font-weight: bold;
            line-height: 1;
        }
        .day-banner h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
        }

        /* 單一章節卡片 */
        .chapter {
            min-height: 65vh;
            margin-bottom: 45px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(196, 169, 158, 0.15);
            position: relative;
            transition: opacity 0.4s ease;
            opacity: 0.35;
        }
        .chapter.active { opacity: 1; }
        .chapter h2 {
            color: var(--accent-brown);
            font-size: 1.3rem;
            margin-top: 0;
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 10px;
            display: inline-block;
        }
        .chapter-body {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1rem;
            letter-spacing: 0.04em;
            white-space: pre-line;
        }
        .photo-placeholder {
            width: 100%;
            min-height: 220px;
            background-color: var(--accent-pink);
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            overflow: hidden;
        }

        /* 網頁版多媒體畫廊排版系統 (電腦版一行最多四張，自動等比例平分) */
        .media-gallery {
            margin: 20px 0;
            display: grid;
            gap: 10px;
            width: 100%;
        }
        .media-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #f3ece8;
            width: 100%;
        }
        .media-item img,
        .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .media-item img:hover { transform: scale(1.02); }
        .media-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.65));
            color: #fff;
            font-size: 0.78rem;
            padding: 16px 10px 6px;
            pointer-events: none;
        }
        .replay-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 5;
        }
        .replay-btn:hover { background: rgba(0, 0, 0, 0.8); }

        /* 網頁版畫廊版型設定 */
        .media-gallery.layout-single,
        .media-gallery.layout-stack { grid-template-columns: 1fr; }
        .media-gallery.layout-single .media-item { max-height: 440px; }

        /* 電腦網頁版：自動適應張數（最多四張同高並排，2張50%、3張33%、4張25%） */
        .media-gallery.layout-auto-2,
        .media-gallery.layout-auto-3,
        .media-gallery.layout-auto-4,
        .media-gallery.layout-grid-equal,
        .media-gallery.layout-grid-3,
        .media-gallery.layout-grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        }

        .media-gallery.layout-grid-2-1 { grid-template-columns: 2fr 1fr; }
        .media-gallery.layout-grid-1-2 { grid-template-columns: 1fr 2fr; }
        
        .media-gallery.layout-carousel {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            scroll-snap-type: x mandatory;
            padding-bottom: 6px;
        }
        .media-gallery.layout-carousel .media-item {
            flex: 0 0 78%;
            scroll-snap-align: center;
            aspect-ratio: 4 / 3;
        }

        /* 網頁版並排圖片統一固定高度 (260px) */
        .layout-grid-2-1 .media-item,
        .layout-grid-1-2 .media-item,
        .layout-grid-equal .media-item,
        .layout-grid-3 .media-item,
        .layout-grid-4 .media-item,
        .layout-auto-2 .media-item,
        .layout-auto-3 .media-item,
        .layout-auto-4 .media-item {
            height: 260px;
        }

        /* 點擊放大燈箱 */
        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
        }
        #lightbox-overlay img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        /* 地圖標記圓點 */
        .custom-marker { background: transparent; border: none; }
        .custom-marker .marker-dot {
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            background-color: var(--accent-brown);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }
        .custom-marker:hover .marker-dot,
        .custom-marker.active .marker-dot {
            background-color: var(--accent-brown-dark);
            transform: scale(1.35);
        }

        /* 路線上的方向小箭頭與小狐狸 */
        .route-arrow-icon { background: transparent; border: none; pointer-events: none; }
        .route-arrow-inner {
            width: 14px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-brown-dark); font-weight: bold; font-size: 13px;
            text-shadow: 0 0 3px #fff;
        }
        .fox-traveler-icon { background: transparent; border: none; z-index: 2000 !important; pointer-events: none; }
        .fox-wrapper {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; border: 2.5px solid var(--accent-brown-dark);
            border-radius: 50%; box-shadow: 0 4px 12px rgba(166, 137, 124, 0.55);
            font-size: 20px;
        }

        /* 📱 手機版 RWD：強制一行最多兩張照片 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #map-container { width: 100vw; height: 38vh; position: sticky; top: 0; z-index: 200; }
            #right-panel { width: 100vw; }
            .top-nav { top: 38vh; padding: 12px 20px; }
            #content { padding: 20px; }
            .chapter { min-height: auto; margin-bottom: 30px; }

            /* 手機版強制一排最多兩張 (50% - 50%) */
            .media-gallery.layout-auto-2,
            .media-gallery.layout-auto-3,
            .media-gallery.layout-auto-4,
            .media-gallery.layout-grid-equal,
            .media-gallery.layout-grid-3,
            .media-gallery.layout-grid-4,
            .media-gallery.layout-grid-2-1,
            .media-gallery.layout-grid-1-2 {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            /* 手機版並排高度微調 */
            .layout-grid-2-1 .media-item,
            .layout-grid-1-2 .media-item,
            .layout-grid-equal .media-item,
            .layout-grid-3 .media-item,
            .layout-grid-4 .media-item,
            .layout-auto-2 .media-item,
            .layout-auto-3 .media-item,
            .layout-auto-4 .media-item {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側地圖 -->
        <div id="map-container"><div id="map"></div></div>

        <!-- 右側導覽列與日記內容 -->
        <div id="right-panel">
            <div class="top-nav">
                <div class="nav-header">
                    <a href="index.html" class="back-link">&lt; 書櫃</a>
                    <h2 class="trip-main-title" id="trip-title">讀取中...</h2>
                </div>
                <div class="day-tabs" id="day-tabs"></div>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('trip') || 'tohoku_2026';

        let map = null;
        let baseRouteLayer = null;
        let activeRouteLayer = null;
        let markersLayer = null;
        let foxMarker = null;
        let foxAnimFrame = null;
        let videoObserver = null;
        let normalizedDays = [];
        let currentChaptersList = [];
        let currentActiveIndex = 0;
        const segmentCoordsCache = {};
        let chapterMarkers = new Map();
        let isClickScrolling = false;
        let scrollUnlockTimer = null;

        fetch(`data/${tripId}.json`)
            .then(res => {
                if (!res.ok) throw new Error('找不到該旅程的資料檔');
                return res.json();
            })
            .then(data => {
                document.title = data.tripTitle || '電子旅行手帳';
                document.getElementById('trip-title').textContent = data.tripTitle || '';

                if (Array.isArray(data.days) && data.days.length > 0) {
                    normalizedDays = data.days;
                } else if (Array.isArray(data.chapters)) {
                    const grouped = {};
                    data.chapters.forEach(ch => {
                        const d = ch.day || 'Day 01';
                        if (!grouped[d]) grouped[d] = { day: d, dayTitle: ch.dayTitle || '', isFieldTest: ch.isFieldTest || false, chapters: [] };
                        grouped[d].chapters.push(ch);
                    });
                    normalizedDays = Object.values(grouped);
                }

                initMap(normalizedDays);
                buildDayTabs();
                renderDay('ALL');
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `<h2>糟糕，讀取失敗！</h2><p>${error.message}</p>`;
            });

        function initMap(daysData) {
            let startLat = 35.6895, startLng = 139.6917, startZoom = 7;
            if (daysData && daysData.length > 0 && daysData[0].chapters && daysData[0].chapters.length > 0) {
                const firstCh = daysData[0].chapters[0];
                if (firstCh.lat && firstCh.lng) {
                    startLat = firstCh.lat;
                    startLng = firstCh.lng;
                    startZoom = firstCh.zoom || 13;
                }
            }

            map = L.map('map', { zoomControl: false }).setView([startLat, startLng], startZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            baseRouteLayer = L.layerGroup().addTo(map);
            activeRouteLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        function getDistanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function autoDetectMode(prevCh, currCh, distKm) {
            if (currCh.transport) return currCh.transport.toString().trim().toLowerCase();
            const text = `${currCh.title || ''} ${currCh.content || ''}`;
            if (distKm > 250 || /直飛|航班|班機|起飛|降落/.test(text)) return 'flight';
            if (/遊船|觀光船|渡輪/.test(text)) return 'boat';
            if (/纜車/.test(currCh.title || '')) return 'ropeway';
            if (/新幹線|高鐵/.test(currCh.title || '')) return 'hsr';
            if (/JR|火車|電鐵/.test(currCh.title || '')) return 'train';
            return distKm <= 3.5 ? 'walk' : 'bus';
        }

        async function getDetailedPath(prevCh, currCh) {
            const cacheKey = `auto_v1_${prevCh.id}_to_${currCh.id}`;
            if (segmentCoordsCache[cacheKey]) return segmentCoordsCache[cacheKey];

            const start = [prevCh.lat, prevCh.lng];
            const end = [currCh.lat, currCh.lng];
            const distKm = getDistanceKm(prevCh.lat, prevCh.lng, currCh.lat, currCh.lng);
            const mode = autoDetectMode(prevCh, currCh, distKm);

            if (['flight', 'hsr', 'train', 'boat', 'ropeway'].includes(mode) || distKm > 250) {
                const arc = generateCurve(start, end, 0.15, 36);
                segmentCoordsCache[cacheKey] = arc;
                return arc;
            }

            try {
                const profile = ['walk', 'foot', '步行'].includes(mode) ? 'foot' : 'driving';
                const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${prevCh.lng},${prevCh.lat};${currCh.lng},${currCh.lat}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    segmentCoordsCache[cacheKey] = coords;
                    return coords;
                }
            } catch (e) {}

            const fallback = generateCurve(start, end, 0.05, 24);
            segmentCoordsCache[cacheKey] = fallback;
            return fallback;
        }

        function generateCurve(start, end, curvature = 0.15, segments = 32) {
            const [lat1, lng1] = start, [lat2, lng2] = end;
            const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
            const ctrlLat = midLat - (lng2 - lng1) * curvature;
            const ctrlLng = midLng + (lat2 - lat1) * curvature;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) ** 2 * lat1 + 2 * (1 - t) * t * ctrlLat + t ** 2 * lat2;
                const lng = (1 - t) ** 2 * lng1 + 2 * (1 - t) * t * ctrlLng + t ** 2 * lng2;
                points.push([Number(lat.toFixed(5)), Number(lng.toFixed(5))]);
            }
            return points;
        }

        function drawActiveArrowRoute(coords) {
            activeRouteLayer.clearLayers();
            if (!coords || coords.length < 2) return;
            L.polyline(coords, { color: '#a6897c', weight: 3.5, opacity: 0.9, dashArray: '6, 8' }).addTo(activeRouteLayer);
        }

        function animateFoxAlongPath(coords, targetZoom) {
            if (foxAnimFrame) cancelAnimationFrame(foxAnimFrame);
            if (!coords || coords.length === 0) return;

            if (!foxMarker) {
                const foxIcon = L.divIcon({
                    className: 'fox-traveler-icon',
                    html: '<div class="fox-wrapper" id="fox-avatar">🦊</div>',
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                foxMarker = L.marker(coords[0], { icon: foxIcon, zIndexOffset: 2000 }).addTo(map);
            } else {
                foxMarker.setLatLng(coords[0]);
            }

            map.flyTo(coords[coords.length - 1], targetZoom || 15, { animate: true, duration: 1.0 });
        }

        async function transitionToChapter(newIndex) {
            const targetCh = currentChaptersList[newIndex];
            if (!targetCh || !targetCh.lat || !targetCh.lng) return;
            currentActiveIndex = newIndex;
        }

        function buildDayTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'day-tab active';
            allBtn.textContent = '全部天數';
            allBtn.onclick = () => selectTab('ALL', allBtn);
            tabsContainer.appendChild(allBtn);

            normalizedDays.forEach(dayObj => {
                const btn = document.createElement('button');
                btn.className = 'day-tab';
                btn.textContent = dayObj.day;
                btn.onclick = () => selectTab(dayObj.day, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function selectTab(dayKey, clickedBtn) {
            document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');
            renderDay(dayKey);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function isMediaFile(str) {
            if (!str || typeof str !== 'string') return false;
            return /\.(jpeg|jpg|gif|png|webp|avif|svg|mp4|mov|webm)$/i.test(str) || str.includes('media/') || str.includes('images/');
        }

        function isVideoFile(str) {
            return /\.(mp4|mov|webm)$/i.test(str);
        }

        function buildMediaHTML(ch) {
            const items = [];
            if (isMediaFile(ch.mediaPlaceholder)) items.push({ src: ch.mediaPlaceholder, caption: '' });
            if (Array.isArray(ch.mediaList)) {
                ch.mediaList.forEach(item => {
                    const src = typeof item === 'string' ? item : item.src;
                    const caption = typeof item === 'object' && item.caption ? item.caption : '';
                    if (isMediaFile(src)) items.push({ src, caption });
                });
            }

            if (items.length === 0) {
                return ch.mediaPlaceholder ? `<div class="photo-placeholder">${ch.mediaPlaceholder}</div>` : '';
            }

            let layout = ch.mediaLayout || 'auto';
            let layoutClass = `layout-${layout}`;
            if (layout === 'auto') {
                if (items.length === 1) layoutClass = 'layout-single';
                else if (items.length === 2) layoutClass = 'layout-auto-2';
                else if (items.length === 3) layoutClass = 'layout-auto-3';
                else if (items.length === 4) layoutClass = 'layout-auto-4';
                else layoutClass = 'layout-carousel';
            }

            const itemsHTML = items.map(item => {
                const captionHTML = item.caption ? `<div class="media-caption">${item.caption}</div>` : '';
                if (isVideoFile(item.src)) {
                    return `
                        <div class="media-item">
                            <video class="auto-video" src="${item.src}" muted loop playsinline preload="metadata"></video>
                            <button type="button" class="replay-btn" onclick="replayVideo(this)">↻ 重播</button>
                            ${captionHTML}
                        </div>
                    `;
                } else {
                    return `
                        <div class="media-item">
                            <img src="${item.src}" alt="${item.caption || ch.title}" loading="lazy" onclick="openLightbox('${item.src}')">
                            ${captionHTML}
                        </div>
                    `;
                }
            }).join('');

            return `<div class="media-gallery ${layoutClass}">${itemsHTML}</div>`;
        }

        function replayVideo(btn) {
            const video = btn.parentElement.querySelector('video');
            if (video) { video.currentTime = 0; video.play(); }
        }

        function initVideoAutoplay() {
            if (videoObserver) videoObserver.disconnect();
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) { video.currentTime = 0; video.play().catch(() => {}); }
                    else { video.pause(); }
                });
            }, { threshold: 0.45 });
            document.querySelectorAll('.auto-video').forEach(v => videoObserver.observe(v));
        }

        function openLightbox(src) {
            let overlay = document.getElementById('lightbox-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'lightbox-overlay';
                overlay.onclick = () => overlay.style.display = 'none';
                overlay.innerHTML = '<img id="lightbox-img" src="" alt="放大預覽">';
                document.body.appendChild(overlay);
            }
            document.getElementById('lightbox-img').src = src;
            overlay.style.display = 'flex';
        }

        function setActiveChapter(activeSection, activeMarker) {
            document.querySelectorAll('.chapter').forEach(c => c.classList.remove('active'));
            if (activeSection) activeSection.classList.add('active');
        }

        function renderDay(dayKey) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            markersLayer.clearLayers();
            baseRouteLayer.clearLayers();
            activeRouteLayer.clearLayers();
            chapterMarkers.clear();

            const dotIcon = L.divIcon({ className: 'custom-marker', html: '<div class="marker-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
            currentChaptersList = [];
            const simpleLatLngs = [];

            const daysToRender = dayKey === 'ALL' ? normalizedDays : normalizedDays.filter(d => d.day === dayKey);

            daysToRender.forEach(dayObj => {
                const banner = document.createElement('div');
                banner.className = 'day-banner';
                const fieldTestBadgeHTML = dayObj.isFieldTest ? `<span class="field-test-badge">行程實測</span>` : '';
                banner.innerHTML = `
                    <div class="day-banner-header">
                        <div class="day-badge">${dayObj.day}</div>
                        ${fieldTestBadgeHTML}
                    </div>
                    <h1>${dayObj.dayTitle || dayObj.day}</h1>
                `;
                contentDiv.appendChild(banner);

                (dayObj.chapters || []).forEach((ch) => {
                    const chIndex = currentChaptersList.length;
                    currentChaptersList.push(ch);

                    const section = document.createElement('section');
                    section.className = `chapter ${chIndex === 0 ? 'active' : ''}`;
                    section.id = `section-${ch.id}`;
                    section.setAttribute('data-index', chIndex);

                    const mediaHTML = buildMediaHTML(ch);
                    section.innerHTML = `
                        <h2>${ch.title}</h2>
                        ${mediaHTML}
                        <div class="chapter-body">${ch.content || ''}</div>
                    `;
                    contentDiv.appendChild(section);

                    if (ch.lat && ch.lng) {
                        simpleLatLngs.push([ch.lat, ch.lng]);
                        const marker = L.marker([ch.lat, ch.lng], { icon: dotIcon }).addTo(markersLayer);
                        marker.on('click', () => {
                            setActiveChapter(section);
                            window.scrollTo({ top: section.offsetTop - 100, behavior: 'smooth' });
                        });
                        chapterMarkers.set(section, marker);
                    }
                });
            });

            if (simpleLatLngs.length > 1) {
                L.polyline(simpleLatLngs, { color: '#C4A99E', weight: 2, opacity: 0.45, dashArray: '5, 10' }).addTo(baseRouteLayer);
            }

            initVideoAutoplay();
        }
    </script>
</body>
</html>
