backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "trips"
    label: "旅程手帳"
    folder: "data"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "tripId"
    slug: "{{tripId}}"
    fields:
      - {label: "旅程代號 (英文)", name: "tripId", widget: "string", hint: "例如: tohoku_2026"}
      - {label: "旅程標題", name: "tripTitle", widget: "string", hint: "例如: °•* 𝐅𝐥â𝐧𝐞𝐮𝐫 *•° ｜ 日本東北冬日漫旅"}
      - label: "每日章節內容"
        name: "chapters"
        widget: "list"
        fields:
          - {label: "章節 ID", name: "id", widget: "string", hint: "例如: ch-1"}
          - {label: "緯度 (Lat)", name: "lat", widget: "number", value_type: "float", hint: "例如: 38.1397"}
          - {label: "經度 (Lng)", name: "lng", widget: "number", value_type: "float", hint: "例如: 140.9169"}
          - {label: "地圖縮放層級 (Zoom)", name: "zoom", widget: "number", value_type: "int", default: 13}
          - {label: "標題", name: "title", widget: "string", hint: "例如: 01. 降落｜仙台國際機場"}
          - {label: "照片或影片", name: "mediaPlaceholder", widget: "image", required: false, hint: "可直接從電腦上傳照片（可先留空）"}
          - {label: "手帳內文", name: "content", widget: "text"}
