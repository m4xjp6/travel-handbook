backend:
  name: git-gateway
  branch: main

# 預設全域媒體資料夾
media_folder: "media"
public_folder: "media"

collections:
  - name: "trips"
    label: "°•* 𝐅𝐥â𝐧𝐞𝐮𝐫 *•° ｜ 旅行手帳後台"
    folder: "data"
    create: true
    identifier_field: "tripId"
    slug: "{{tripId}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "旅程 ID (英文，例如: tohoku_2026)", name: "tripId", widget: "string"}
      - {label: "旅程總標題", name: "tripTitle", widget: "string"}
      - label: "天數日記列表"
        name: "days"
        widget: "list"
        summary: "{{fields.day}} ｜ {{fields.dayTitle}}"
        fields:
          - {label: "天數標籤", name: "day", widget: "string", hint: "例如: Day 01"}
          - {label: "當日主題標題", name: "dayTitle", widget: "string", hint: "例如: 走進日本三景的水墨畫！"}
          - {label: "是否為行程實測", name: "isFieldTest", widget: "boolean", default: false, required: false, hint: "打勾後會在前端標題自動加上【行程實測】"}
          - label: "章節內容"
            name: "chapters"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "章節 ID", name: "id", widget: "string"}
              - {label: "緯度 (Lat)", name: "lat", widget: "number", value_type: "float"}
              - {label: "經度 (Lng)", name: "lng", widget: "number", value_type: "float"}
              - {label: "地圖縮放層級 (Zoom)", name: "zoom", widget: "number", default: 13}
              - label: "抵達本站的交通方式 (無時間軸紀錄時繪製路線用)"
                name: "transport"
                widget: "select"
                default: "walk"
                required: false
                options:
                  - { label: "🚶 步行 / 散步 (貼合人行街道)", value: "walk" }
                  - { label: "🚌 巴士 / 公車 / 自駕 / 計程車 (貼合公路)", value: "bus" }
                  - { label: "🚇 捷運 / 地鐵 / 輕軌 (Metro / MRT / Subway)", value: "metro" }
                  - { label: "🚆 火車 / 台鐵 / JR / 私鐵 (Train / Railway)", value: "train" }
                  - { label: "🚄 高鐵 / 新幹線 / 高速鐵路 (HSR / Shinkansen)", value: "hsr" }
                  - { label: "🚡 纜車 / 索道 (Ropeway / Cable Car)", value: "ropeway" }
                  - { label: "⛴️ 遊船 / 渡輪 / 船班 (Boat / Ferry)", value: "boat" }
                  - { label: "✈️ 飛機 / 國內外航班 (Flight)", value: "flight" }
              - {label: "標題", name: "title", widget: "string", hint: "格式：01. 動作/亮點｜地點與細節"}
              - label: "照片排版樣式"
                name: "mediaLayout"
                widget: "select"
                required: false
                default: "auto"
                options:
                  - { label: "✨ 自動智慧排版 (依張數自動調整)", value: "auto" }
                  - { label: "📐 左寬右窄 (2:1 雜誌風雙圖)", value: "grid-2-1" }
                  - { label: "📐 左窄右寬 (1:2 雜誌風雙圖)", value: "grid-1-2" }
                  - { label: "📐 雙窄中寬 (1:2:1 雜誌風三圖)", value: "grid-1-2-1" }
                  - { label: "⚖️ 雙欄對稱並排 (1:1)", value: "grid-equal" }
                  - { label: "⚖️ 三張固定並排 (1:1:1)", value: "grid-3" }
                  - { label: "⚖️ 四張固定並排 (1:1:1:1)", value: "grid-4" }
                  - { label: "🎠 橫向滑動輪播 (IG風，適合多張照片)", value: "carousel" }
                  - { label: "🖼️ 單欄垂直大圖堆疊", value: "stack" }
              - label: "單張主圖/影片 或 佔位提示文字 (相容舊資料)"
                name: "mediaPlaceholder"
                widget: "file"
                required: false
                media_folder: "../media/{{tripId}}"
                public_folder: "media/{{tripId}}"
                hint: "若只有 1 張照片或影片可直接傳這裡；若有多張請用下方清單"
              - label: "多張照片與影片清單 (可新增多筆)"
                name: "mediaList"
                widget: "list"
                required: false
                hint: "點擊 Add 新增多張照片(.jpg/.png/.gif)或影片(.mp4/.mov)，可拖曳調整順序"
                fields:
                  - label: "檔案 (照片/GIF/影片)"
                    name: "src"
                    widget: "file"
                    media_folder: "../media/{{tripId}}"
                    public_folder: "media/{{tripId}}"
                  - label: "圖說 (選填)"
                    name: "caption"
                    widget: "string"
                    required: false
              - {label: "內文", name: "content", widget: "text"}
