<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>°•* Flâneur *•° 旅行手帳書櫃</title>
    <style>
        /* === 1. 全域色彩變數與基礎頁面設定（全面採用溫潤奶茶棕，不使用黑色字體） === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕（按鈕文字與強調色） */
            --accent-pink: #E5D1C7;       /* 藕粉底色（滑鼠懸停） */
            --text-main: #7A6258;         /* 主要內文深可可棕（取代原本偏黑的深灰色） */
            --text-light: #9E887E;        /* 次要內文淺可可棕 */
            --callout-bg: #F5EFE6;        /* 溫潤米杏色提示框底色 */
        }

        body {
            margin: 0;
            padding: 40px 24px 80px;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 1060px;
            margin-inline: auto;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-brown-dark);
            text-align: center;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
            margin: 0 0 22px 0;
        }

        /* === 2. 七大洲與國家雙層篩選按鈕區 === */
        .filter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.3);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* 國家按鈕列：未點選任何大洲時預設隱藏 */
        #country-filters {
            display: none;
            padding-top: 4px;
            animation: fadeInDown 0.25s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 第一層（七大洲）與第二層（國家）共用溫潤奶茶色系按鈕設定 */
        .filter-btn,
        .country-btn {
            border: 1.5px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark); /* 文字採用深奶茶棕，非黑色 */
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* 國家按鈕尺寸稍微輕巧，方便與大洲區分層級 */
        .country-btn {
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        /* 滑鼠移過去的效果 */
        .filter-btn:hover,
        .country-btn:hover {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
            color: white;
        }

        /* 點選後的狀態（維持有底色與白字） */
        .filter-btn.active {
            background: var(--accent-brown);
            border-color: var(--accent-brown);
            color: white;
            box-shadow: 0 2px 8px rgba(196, 169, 158, 0.45);
        }

        .country-btn.active {
            background: var(--accent-brown-dark);
            border-color: var(--accent-brown-dark);
            color: white;
            box-shadow: 0 2px 8px rgba(166, 137, 124, 0.45);
        }

        /* === 3. 總覽提示框 (Callout) === */
        .callout {
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 28px;
            font-size: 0.92rem;
            background-color: var(--callout-bg);
            border-left: 4px solid var(--accent-brown);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* === 4. 書櫃卡片網格與單一旅程卡片 === */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .trip-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(196, 169, 158, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(196, 169, 158, 0.32);
        }

        /* 3:4 三格封面拼貼區塊（手機與電腦皆嚴格三等份平分） */
        .cover-collage {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            aspect-ratio: 9 / 4;
        }
        .cover-collage div {
            min-width: 0;
            border-right: 2px solid white;
            background-color: var(--accent-brown);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
        }
        .cover-collage div:last-child { border-right: none; }
        .cover-collage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .trip-card:hover .cover-collage img { transform: scale(1.04); }

        /* 卡片下方文字與重點表格 */
        .card-content { padding: 20px 24px; }
        .card-content h3 {
            margin: 0 0 12px 0;
            color: var(--accent-brown-dark);
            font-size: 1.15rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            color: var(--text-main);
        }
        th, td {
            padding: 8px 4px;
            text-align: left;
            border-bottom: 1px solid #f0ebe6;
        }
        tr:last-child th, tr:last-child td { border-bottom: none; }
        th { color: var(--text-light); width: 22%; font-weight: 500; }

        /* 尚無旅程時的空狀態提示 */
        #empty-state {
            display: none;
            text-align: center;
            padding: 48px 20px;
            background: white;
            border-radius: 14px;
            color: var(--text-light);
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.12);
            font-size: 0.95rem;
        }

        /* === 5. 右下角管理手帳懸浮按鈕 === */
        .admin-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--accent-brown);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            transition: background-color 0.2s, transform 0.2s;
        }
        .admin-fab:hover {
            background-color: var(--accent-brown-dark);
            transform: translateY(-2px);
        }

        /* === 6. 手機版 RWD 響應式配置 === */
        @media (max-width: 768px) {
            body { padding: 24px 16px 70px; }
            h1 { font-size: 1.4rem; }
            .grid-container { grid-template-columns: 1fr; gap: 20px; }
            .filter-btn { padding: 6px 13px; font-size: 0.85rem; }
            .country-btn { padding: 5px 12px; font-size: 0.8rem; }
        }
    </style>
    <!-- 引入 Netlify Identity Widget 套件，處理密碼設定與登入彈窗 -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <h1>°•* Flâneur *•° 旅行手帳書櫃</h1>

    <!-- 雙層篩選器：上排七大洲、下排為點選該洲後才出現的國家 -->
    <div class="filter-section">
        <!-- 第一排：全部 + 七大洲按鈕 -->
        <div class="filter-row" id="continent-filters">
            <button type="button" class="filter-btn active" data-continent="ALL">全部</button>
            <button type="button" class="filter-btn" data-continent="亞洲">亞洲</button>
            <button type="button" class="filter-btn" data-continent="歐洲">歐洲</button>
            <button type="button" class="filter-btn" data-continent="北美洲">北美洲</button>
            <button type="button" class="filter-btn" data-continent="非洲">非洲</button>
            <button type="button" class="filter-btn" data-continent="南美洲">南美洲</button>
            <button type="button" class="filter-btn" data-continent="大洋洲">大洋洲</button>
            <button type="button" class="filter-btn" data-continent="南極洲">南極洲</button>
        </div>

        <!-- 第二排：國家／地區按鈕（預設隱藏，點擊對應大洲時才會顯示該洲的國家） -->
        <!-- 未來若去其他洲的國家，只需複製一行並設定對應的 data-continent="歐洲" 即可 -->
        <div class="filter-row" id="country-filters">
            <button type="button" class="country-btn" data-continent="亞洲" data-country="台灣">台灣</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="日本">日本</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="韓國">韓國</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="香港">香港</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="中國">中國</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="馬來西亞">馬來西亞</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="新加坡">新加坡</button>
        </div>
    </div>

    <div class="callout">
        <strong>📚 總覽資訊：</strong>點擊上方七大洲可展開對應國家並篩選旅程，點擊下方的旅程卡片即可開啟該趟旅行的專屬「動態地圖手帳」。
    </div>

    <!-- 手帳卡片列表（新增卡片時，設定 data-continent="洲名" 與 data-country="國家名" 即可自動連動篩選） -->
    <div class="grid-container" id="cards-grid">

        <!-- 卡片 1：南洋星馬（跨馬來西亞與新加坡兩國，用逗號分隔即可同時支援兩顆國家按鈕） -->
        <a href="journal.html?trip=malaysia_2027" class="trip-card" data-continent="亞洲" data-country="馬來西亞,新加坡">
            <div class="cover-collage">
                <div><img src="media/malaysia_2027/cover-1.png" alt="封面照 1"></div>
                <div><img src="media/malaysia_2027/cover-2.png" alt="封面照 2"></div>
                <div><img src="media/malaysia_2027/cover-3.png" alt="封面照 3"></div>
            </div>
            <div class="card-content">
                <h3>南洋星馬春季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>11 天 10 夜</td></tr>
                    <tr><th>重點</th><td>吉隆坡敘宴、又見馬六甲、星耀樟宜</td></tr>
                    <tr><th>季節</th><td>2027 春季</td></tr>
                </table>
            </div>
        </a>

        <!-- 卡片 2：日本東北 -->
        <a href="journal.html?trip=tohoku_2026" class="trip-card" data-continent="亞洲" data-country="日本">
            <div class="cover-collage">
                <div><img src="media/tohoku_2026/cover-1.png" alt="封面照 1"></div>
                <div><img src="media/tohoku_2026/cover-2.png" alt="封面照 2"></div>
                <div><img src="media/tohoku_2026/cover-3.png" alt="封面照 3"></div>
            </div>
            <div class="card-content">
                <h3>日本東北冬季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>9 天 8 夜</td></tr>
                    <tr><th>重點</th><td>藏王樹冰、銀山溫泉、狐狸村</td></tr>
                    <tr><th>季節</th><td>2026 冬季</td></tr>
                </table>
            </div>
        </a>

    </div>

    <!-- 若篩選的洲或國家目前還沒有卡片時顯示的提示 -->
    <div id="empty-state">
        ✨ 這個地區的旅行手帳正在醞釀中，敬請期待下一段旅程！
    </div>

    <!-- 右下角管理手帳按鈕 -->
    <a href="admin/" class="admin-fab">✏️ 管理手帳</a>

    <script>
        /* === 七大洲與國家雙層連動篩選邏輯 === */
        const continentBtns = document.querySelectorAll('#continent-filters .filter-btn');
        const countryRow = document.getElementById('country-filters');
        const countryBtns = document.querySelectorAll('#country-filters .country-btn');
        const cards = document.querySelectorAll('.trip-card');
        const emptyState = document.getElementById('empty-state');

        let currentContinent = 'ALL'; // 預設為全部（不選特定洲）
        let currentCountry = null;    // 預設不選特定國家

        // 更新國家按鈕列的顯示狀態（僅在選中特定大洲時，顯示屬於該洲的國家按鈕）
        function updateCountryRowVisibility() {
            if (currentContinent === 'ALL') {
                countryRow.style.display = 'none';
                return;
            }

            let hasCountriesForContinent = false;
            countryBtns.forEach(btn => {
                const btnContinent = (btn.getAttribute('data-continent') || '').trim();
                if (btnContinent === currentContinent) {
                    btn.style.display = 'inline-block';
                    hasCountriesForContinent = true;
                } else {
                    btn.style.display = 'none';
                }
            });

            // 若該洲有設定國家按鈕則展開，否則保持隱藏
            countryRow.style.display = hasCountriesForContinent ? 'flex' : 'none';
        }

        // 執行卡片顯示與隱藏判斷
        function applyFilter() {
            let visibleCount = 0;

            cards.forEach(card => {
                const cardContinent = (card.getAttribute('data-continent') || '').trim();
                const cardCountries = (card.getAttribute('data-country') || '')
                    .split(',')
                    .map(s => s.trim());

                const matchContinent = (currentContinent === 'ALL') || (cardContinent === currentContinent);
                const matchCountry = !currentCountry || cardCountries.includes(currentCountry);

                if (matchContinent && matchCountry) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        // 1. 點擊「七大洲」按鈕：切換大洲（保持底色）並展開該洲的國家按鈕
        continentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const selected = btn.getAttribute('data-continent');

                // 若再次點擊目前已選中的大洲（且未選國家），則退回「全部」並收起國家列
                if (currentContinent === selected && !currentCountry && selected !== 'ALL') {
                    currentContinent = 'ALL';
                } else {
                    currentContinent = selected;
                }

                // 切換大洲時重置國家選擇
                currentCountry = null;

                // 讓被點選的大洲維持有底色 (active)
                continentBtns.forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-continent') === currentContinent);
                });
                countryBtns.forEach(b => b.classList.remove('active'));

                updateCountryRowVisibility();
                applyFilter();
            });
        });

        // 2. 點擊「國家」按鈕：篩選該國卡片，且大洲與國家按鈕同時維持有底色
        countryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const selectedCountry = btn.getAttribute('data-country');

                // 若再次點擊已選中的國家，則取消國家鎖定（退回顯示該洲的所有卡片）
                if (currentCountry === selectedCountry) {
                    currentCountry = null;
                    countryBtns.forEach(b => b.classList.remove('active'));
                } else {
                    currentCountry = selectedCountry;
                    // 讓點選的國家按鈕維持有底色，同時上方的大洲按鈕也保留底色！
                    countryBtns.forEach(b => b.classList.toggle('active', b === btn));
                }

                applyFilter();
            });
        });
    </script>
</body>
</html>
