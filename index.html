<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>°•* Flâneur *•° 旅行手帳書櫃</title>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --accent-brown: #C4A99E;
            --accent-brown-dark: #a6897c;
            --text-dark: #4A4A4A;
            --callout-blue: #eef4ff;
        }
        body {
            margin: 0;
            padding: 40px 24px 90px 24px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            color: var(--accent-brown);
            text-align: center;
            border-bottom: 2px solid var(--accent-brown);
            padding-bottom: 20px;
            line-height: 1.4;
        }
        
        .callout {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.6;
            background-color: var(--callout-blue);
            border-left: 4px solid #3b82f6;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .trip-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.2);
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .trip-card:hover {
            transform: translateY(-5px);
        }
        
        /* 3:4 三格封面拼貼區塊 */
        .cover-collage {
            display: flex;
            aspect-ratio: 9 / 4; /* 三張 3:4 並排的黃金比例 (3+3+3 : 4) */
            min-height: 220px;
        }
        .cover-collage div {
            flex: 1;
            border-right: 2px solid white;
            background-color: var(--accent-brown);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
        }
        .cover-collage div:last-child {
            border-right: none;
        }
        .cover-collage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .trip-card:hover .cover-collage img {
            transform: scale(1.04);
        }
        
        .card-content {
            padding: 22px;
        }
        .card-content h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent-brown);
            font-size: 1.25rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            margin-top: 10px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #f0ece6;
            line-height: 1.5;
        }
        tr:last-child th, tr:last-child td {
            border-bottom: none;
        }
        th {
            color: #888;
            width: 25%;
            font-weight: 500;
        }

        /* 右下角管理手帳懸浮按鈕 */
        .admin-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--accent-brown);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            transition: background-color 0.2s, transform 0.2s;
        }
        .admin-fab:hover {
            background-color: var(--accent-brown-dark);
            transform: translateY(-2px);
        }
    </style>
    <!-- 引入 Netlify Identity Widget 套件，處理密碼設定與登入彈窗 -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <h1>°•* Flâneur *•° 旅行手帳書櫃</h1>

    <div class="callout">
        <strong>📚 總覽資訊：</strong>點擊下方的旅程卡片，即可開啟該趟旅行的專屬「動態地圖手帳」。點擊右下角按鈕可進行管理。
    </div>

    <div class="grid-container">
        <!-- 卡片 1：日本東北 -->
        <a href="journal.html?trip=tohoku_2026" class="trip-card">
            <div class="cover-collage">
                <div><img src="media/tohoku_2026/cover1.png" alt="封面照 1"></div>
                <div><img src="media/tohoku_2026/cover2.png" alt="封面照 2"></div>
                <div><img src="media/tohoku_2026/cover3.png" alt="封面照 3"></div>
            </div>
            <div class="card-content">
                <h3>日本東北冬季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>9 天 8 夜</td></tr>
                    <tr><th>重點</th><td>藏王樹冰、銀山溫泉、狐狸村</td></tr>
                    <tr><th>季節</th><td>2026 冬季</td></tr>
                </table>
            </div>
        </a>

        <!-- 卡片 2：馬來西亞 -->
        <a href="journal.html?trip=malaysia_2027" class="trip-card">
            <div class="cover-collage">
                <div><img src="media/malaysia_2027/cover1.png" alt="封面照 1"></div>
                <div><img src="media/malaysia_2027/cover2.png" alt="封面照 2"></div>
                <div><img src="media/malaysia_2027/cover3.png" alt="封面照 3"></div>
            </div>
            <div class="card-content">
                <h3>南洋星馬春季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>11 天 10 夜</td></tr>
                    <tr><th>重點</th><td>吉隆坡敘宴、又見馬六甲、星耀樟宜</td></tr>
                    <tr><th>季節</th><td>2027 春季</td></tr>
                </table>
            </div>
        </a>
    </div>

    <!-- 右下角管理手帳按鈕 -->
    <a href="admin/" class="admin-fab">✏️ 管理手帳</a>

    <!-- 內建 Netlify 驗證攔截腳本 -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
        
        window.netlifyIdentity.on("invite", token => {
          window.netlifyIdentity.open();
          window.netlifyIdentity.on("signup", user => {
            document.location.href = "/admin/";
          });
        });
      }
    </script>
</body>
</html>
