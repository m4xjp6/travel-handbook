<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>°•* 𝐅𝐥â𝐧𝐞𝐮𝐫 *•° 旅行手帳書櫃</title>

    <!-- 引入 Google Fonts 優雅襯線與黑體，確保各裝置字體變化一致 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

    <!-- 引入 Netlify Identity Widget 套件 -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* === 1. 全域色彩變數與基礎頁面設定（全面採用溫潤奶茶棕，不使用黑色字體） === */
        :root {
            --bg-color: #FDFBF7;          /* 手帳米白底色 */
            --accent-brown: #C4A99E;      /* 主題奶茶棕 */
            --accent-brown-dark: #a6897c; /* 深奶茶棕（按鈕文字與強調色） */
            --accent-pink: #E5D1C7;       /* 藕粉底色（滑鼠懸停） */
            --text-main: #7A6258;         /* 主要內文深可可棕 */
            --text-light: #9E887E;        /* 次要內文淺可可棕 */
            --callout-bg: #F5EFE6;        /* 溫潤米杏色提示框底色 */
        }

        body {
            margin: 0;
            padding: 40px 24px 80px;
            font-family: 'Noto Sans TC', 'PingFang TC', 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 1060px;
            margin-inline: auto;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: 'Noto Serif TC', 'PingFang TC', serif;
            color: var(--accent-brown-dark);
            text-align: center;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            margin: 0 0 24px 0;
        }

        /* === 2. 七大洲與國家雙層篩選按鈕區 === */
        .filter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(196, 169, 158, 0.3);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        #country-filters {
            display: none;
            padding-top: 4px;
            animation: fadeInDown 0.25s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-btn,
        .country-btn {
            font-family: inherit;
            border: 1.5px solid var(--accent-brown);
            background: white;
            color: var(--accent-brown-dark);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .country-btn {
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        .filter-btn:hover,
        .country-btn:hover {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
            color: white;
        }

        .filter-btn.active {
            background: var(--accent-brown);
            border-color: var(--accent-brown);
            color: white;
            box-shadow: 0 2px 8px rgba(196, 169, 158, 0.45);
        }

        .country-btn.active {
            background: var(--accent-brown-dark);
            border-color: var(--accent-brown-dark);
            color: white;
            box-shadow: 0 2px 8px rgba(166, 137, 124, 0.45);
        }

        /* === 3. 總覽提示框 (Callout) === */
        .callout {
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 28px;
            font-size: 0.92rem;
            background-color: var(--callout-bg);
            border-left: 4px solid var(--accent-brown);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* === 4. 書櫃卡片網格與單一旅程卡片 === */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        /* 當畫面上只有 1 張卡片顯示時，自動置中呈現最佳比例 */
        .grid-container.single-card {
            grid-template-columns: minmax(0, 560px);
            justify-content: center;
        }

        .trip-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(196, 169, 158, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
            display: block;
        }

        /* 標記為 draft (建構中) 的卡片強制隱藏 */
        .trip-card[data-status="draft"] {
            display: none !important;
        }

        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(196, 169, 158, 0.32);
        }

        /* 3:4 三格封面拼貼區塊 */
        .cover-collage {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            aspect-ratio: 9 / 4;
        }
        .cover-collage div {
            min-width: 0;
            border-right: 2px solid white;
            background-color: var(--accent-brown);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        .cover-collage div:last-child { border-right: none; }
        .cover-collage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .trip-card:hover .cover-collage img { transform: scale(1.04); }

        /* 卡片下方文字與重點表格 */
        .card-content { padding: 20px 24px; }
        .card-content h3 {
            font-family: 'Noto Serif TC', 'PingFang TC', serif;
            margin: 0 0 12px 0;
            color: var(--accent-brown-dark);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            color: var(--text-main);
        }
        th, td {
            padding: 8px 4px;
            text-align: left;
            border-bottom: 1px solid #f0ebe6;
            color: var(--text-main);
        }
        tr:last-child th, tr:last-child td { border-bottom: none; }
        th { color: var(--text-light); width: 22%; font-weight: 500; }

        /* 尚無旅程時的空狀態提示 */
        #empty-state {
            display: none;
            text-align: center;
            padding: 48px 20px;
            background: white;
            border-radius: 14px;
            color: var(--text-light);
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.12);
            font-size: 0.95rem;
        }

        /* === 5. 右下角管理手帳懸浮按鈕 === */
        .admin-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--accent-brown);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(196, 169, 158, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            transition: background-color 0.2s, transform 0.2s;
        }
        .admin-fab:hover {
            background-color: var(--accent-brown-dark);
            transform: translateY(-2px);
        }

        /* === 6. 手機版 RWD 響應式配置 === */
        @media (max-width: 768px) {
            body { padding: 24px 16px 70px; }
            h1 { font-size: 1.45rem; }
            .grid-container { grid-template-columns: 1fr; gap: 20px; }
            .filter-btn { padding: 6px 13px; font-size: 0.85rem; }
            .country-btn { padding: 5px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <h1>°•* 𝐅𝐥â𝐧𝐞𝐮𝐫 *•° 旅行手帳書櫃</h1>

    <!-- 雙層篩選器：上排七大洲、下排為點選該洲後才出現的國家 -->
    <div class="filter-section">
        <!-- 第一排：全部 + 七大洲按鈕 -->
        <div class="filter-row" id="continent-filters">
            <button type="button" class="filter-btn active" data-continent="ALL">全部</button>
            <button type="button" class="filter-btn" data-continent="亞洲">亞洲</button>
            <button type="button" class="filter-btn" data-continent="歐洲">歐洲</button>
            <button type="button" class="filter-btn" data-continent="北美洲">北美洲</button>
            <button type="button" class="filter-btn" data-continent="非洲">非洲</button>
            <button type="button" class="filter-btn" data-continent="南美洲">南美洲</button>
            <button type="button" class="filter-btn" data-continent="大洋洲">大洋洲</button>
            <button type="button" class="filter-btn" data-continent="南極洲">南極洲</button>
        </div>

        <!-- 第二排：國家／地區按鈕（系統會自動只顯示「目前有公開卡片」的國家） -->
        <div class="filter-row" id="country-filters">
            <button type="button" class="country-btn" data-continent="亞洲" data-country="台灣">台灣</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="日本">日本</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="韓國">韓國</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="香港">香港</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="中國">中國</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="馬來西亞">馬來西亞</button>
            <button type="button" class="country-btn" data-continent="亞洲" data-country="新加坡">新加坡</button>
        </div>
    </div>

    <div class="callout">
        <strong>📚 總覽資訊：</strong>點擊上方七大洲可展開對應國家並篩選旅程，點擊下方的旅程卡片即可開啟該趟旅行的專屬「動態地圖手帳」。
    </div>

    <!-- 手帳卡片列表 -->
    <!-- 💡 小撇步：尚未建構完成的卡片加上 data-status="draft" 即可在首頁隱藏；建構完成後刪除 data-status="draft" 就會自動公開！ -->
    <div class="grid-container" id="cards-grid">

        <!-- 卡片 1：南洋星馬（目前加上 data-status="draft" 設為隱藏，不顯示於首頁） -->
        <a href="journal.html?trip=malaysia_2027" class="trip-card" data-continent="亞洲" data-country="馬來西亞,新加坡" data-status="draft">
            <div class="cover-collage">
                <div><img src="media/malaysia_2027/cover-1.png" alt="封面照 1" onerror="this.parentElement.innerHTML='封面照 1'"></div>
                <div><img src="media/malaysia_2027/cover-2.png" alt="封面照 2" onerror="this.parentElement.innerHTML='封面照 2'"></div>
                <div><img src="media/malaysia_2027/cover-3.png" alt="封面照 3" onerror="this.parentElement.innerHTML='封面照 3'"></div>
            </div>
            <div class="card-content">
                <h3>南洋星馬春季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>11 天 10 夜</td></tr>
                    <tr><th>重點</th><td>吉隆坡敘宴、又見馬六甲、星耀樟宜</td></tr>
                    <tr><th>季節</th><td>2027 春季</td></tr>
                </table>
            </div>
        </a>

        <!-- 卡片 2：日本東北（公開顯示中） -->
        <a href="journal.html?trip=tohoku_2026" class="trip-card" data-continent="亞洲" data-country="日本">
            <div class="cover-collage">
                <div><img src="media/tohoku_2026/cover-1.png" alt="封面照 1" onerror="this.parentElement.innerHTML='封面照 1'"></div>
                <div><img src="media/tohoku_2026/cover-2.png" alt="封面照 2" onerror="this.parentElement.innerHTML='封面照 2'"></div>
                <div><img src="media/tohoku_2026/cover-3.png" alt="封面照 3" onerror="this.parentElement.innerHTML='封面照 3'"></div>
            </div>
            <div class="card-content">
                <h3>日本東北冬季漫旅</h3>
                <table>
                    <tr><th>天數</th><td>9 天 8 夜</td></tr>
                    <tr><th>重點</th><td>藏王樹冰、銀山溫泉、狐狸村</td></tr>
                    <tr><th>季節</th><td>2026 冬季</td></tr>
                </table>
            </div>
        </a>

    </div>

    <!-- 若篩選的洲或國家目前還沒有卡片時顯示的提示 -->
    <div id="empty-state">
        ✨ 這個地區的旅行手帳正在醞釀中，敬請期待下一段旅程！
    </div>

    <!-- 右下角管理手帳按鈕 -->
    <a href="admin/" class="admin-fab">✏️ 管理手帳</a>

    <script>
        /* === 七大洲與國家雙層連動篩選邏輯（支援 draft 草稿自動隱藏） === */
        const continentBtns = document.querySelectorAll('#continent-filters .filter-btn');
        const countryRow = document.getElementById('country-filters');
        const countryBtns = document.querySelectorAll('#country-filters .country-btn');
        const cardsGrid = document.getElementById('cards-grid');
        // 只抓取「非 draft（已公開）」的旅程卡片參與篩選與顯示
        const publishedCards = Array.from(document.querySelectorAll('.trip-card:not([data-status="draft"])'));
        const emptyState = document.getElementById('empty-state');

        let currentContinent = 'ALL';
        let currentCountry = null;

        // 統計目前所有「已公開卡片」涵蓋的國家，讓沒有卡片的國家按鈕自動隱藏
        const activeCountries = new Set();
        publishedCards.forEach(card => {
            (card.getAttribute('data-country') || '')
                .split(',')
                .map(s => s.trim())
                .filter(Boolean)
                .forEach(c => activeCountries.add(c));
        });

        function updateCountryRowVisibility() {
            if (currentContinent === 'ALL') {
                countryRow.style.display = 'none';
                return;
            }

            let hasCountriesForContinent = false;
            countryBtns.forEach(btn => {
                const btnContinent = (btn.getAttribute('data-continent') || '').trim();
                const btnCountry = (btn.getAttribute('data-country') || '').trim();
                // 屬於當前選中的大洲，且該國家至少有一張公開卡片才顯示按鈕
                if (btnContinent === currentContinent && activeCountries.has(btnCountry)) {
                    btn.style.display = 'inline-block';
                    hasCountriesForContinent = true;
                } else {
                    btn.style.display = 'none';
                }
            });

            countryRow.style.display = hasCountriesForContinent ? 'flex' : 'none';
        }

        function applyFilter() {
            let visibleCount = 0;

            publishedCards.forEach(card => {
                const cardContinent = (card.getAttribute('data-continent') || '').trim();
                const cardCountries = (card.getAttribute('data-country') || '')
                    .split(',')
                    .map(s => s.trim());

                const matchContinent = (currentContinent === 'ALL') || (cardContinent === currentContinent);
                const matchCountry = !currentCountry || cardCountries.includes(currentCountry);

                if (matchContinent && matchCountry) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // 若目前只顯示 1 張卡片，套用置中單卡版型；2 張以上則雙欄並排
            cardsGrid.classList.toggle('single-card', visibleCount === 1);
            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        continentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const selected = btn.getAttribute('data-continent');

                if (currentContinent === selected && !currentCountry && selected !== 'ALL') {
                    currentContinent = 'ALL';
                } else {
                    currentContinent = selected;
                }

                currentCountry = null;

                continentBtns.forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-continent') === currentContinent);
                });
                countryBtns.forEach(b => b.classList.remove('active'));

                updateCountryRowVisibility();
                applyFilter();
            });
        });

        countryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const selectedCountry = btn.getAttribute('data-country');

                if (currentCountry === selectedCountry) {
                    currentCountry = null;
                    countryBtns.forEach(b => b.classList.remove('active'));
                } else {
                    currentCountry = selectedCountry;
                    countryBtns.forEach(b => b.classList.toggle('active', b === btn));
                }

                applyFilter();
            });
        });

        // 頁面載入時立刻執行一次初始篩選與版面校正
        applyFilter();
    </script>
</body>
</html>
